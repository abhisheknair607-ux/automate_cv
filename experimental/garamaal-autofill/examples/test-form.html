<!doctype html><html lang="en"><meta charset="utf-8"><title>Garamaal synthetic application</title>
<h1>Financial Analyst — Example Corp</h1>
<p>Fictional job application for local testing. No submission or navigation is required.</p>
<form>
  <p><label>First Name <input name="first_name"></label></p>
  <p><label>Email Address <input type="email" name="email"></label></p>
  <p><label>Do you have experience building financial forecasts?
    <select name="forecasting"><option value="">Select an answer</option><option value="Y">Yes</option><option value="N">No</option></select></label></p>
  <fieldset><legend>Describe a relevant finance achievement</legend><textarea name="achievement"></textarea></fieldset>
  <p><label>Do you have relatives employed at this company?
    <select name="relatives"><option value="">Select an answer</option><option value="Y">Yes</option><option value="N">No</option></select></label></p>
  <p><label>Salary expectation <input name="salary"></label></p>
  <button type="button">Continue (manual test only)</button>
</form>
