<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Garamaal — Multi-User Profile and Sign-In Design Prototype</title>
<style>
:root{--navy:#132a49;--blue:#2563eb;--blueSoft:#eaf1ff;--ink:#14243a;--muted:#6c7a90;--line:#dfe6ef;--bg:#f5f7fb;--white:#fff;--shadow:0 5px 24px rgba(21,43,72,.055)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #83aaff;outline-offset:2px}.hide{display:none!important}button:disabled{cursor:not-allowed;opacity:.6}
.shell{display:flex;min-height:100dvh}.side{width:230px;flex:none;background:var(--navy);color:#fff;padding:20px 13px;display:flex;flex-direction:column;position:sticky;top:0;height:100dvh}.brand{padding:0 10px 18px;font-size:26px;font-weight:850;letter-spacing:-.05em}.brand small{display:block;font-size:10px;color:#a9bfdd;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.nav{display:grid;gap:4px}.nav button{text-align:left;border:0;border-radius:11px;padding:12px;background:transparent;color:#b8cae2;font-weight:650}.nav button.active,.nav button:hover{background:#294668;color:white}.nav span{display:inline-block;width:24px;font-size:17px}.sidefooter{margin-top:auto;padding:13px;border:1px solid #486282;border-radius:10px;color:#b9cee9;font-size:11px}.main{flex:1;min-width:0}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 26px;position:sticky;top:0;z-index:4}.right{display:flex;align-items:center;gap:9px}.round{width:34px;height:34px;background:#e0ebff;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#285aa2;font-weight:850}.container{max-width:1150px;margin:auto;padding:30px 28px 95px}.eyebrow{font-size:11px;color:#5676ab;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.heading{font-size:29px;font-weight:850;letter-spacing:-.045em;margin:5px 0;line-height:1.2}.muted{color:var(--muted)}.small{font-size:12px}.label{font-size:12px;color:#45566e;font-weight:750}.card{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);padding:20px}.grid{display:grid;gap:16px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.btn{border:1px solid #d2ddec;background:white;color:#284568;border-radius:10px;padding:9px 12px;font-weight:750;font-size:12px;min-height:37px}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.soft{background:var(--blueSoft);border-color:#dae8ff;color:#205dbc}.btn:hover{filter:brightness(.96)}.pill{border-radius:50px;background:#eaf1ff;color:#315a9d;padding:4px 9px;font-weight:780;font-size:11px}.badge{background:#fff5dd;color:#7e5a10;border-radius:10px;padding:6px 8px;font-weight:750;font-size:11px}.progress{height:8px;border-radius:10px;background:#e3eaf4;overflow:hidden}.progress>div{width:64%;height:100%;background:#3778e6}.kpi{font-size:28px;font-weight:850;letter-spacing:-.045em}.mutedline{font-size:12px;color:var(--muted);margin:4px 0}.profilecard{background:linear-gradient(110deg,#fff,#edf4ff)}.profilelayout{display:grid;grid-template-columns:235px 1fr;gap:16px;align-items:start}.tabs{display:grid;gap:5px}.tabs button{border:0;background:transparent;text-align:left;padding:11px 13px;border-radius:10px;color:#51657e;font-weight:700}.tabs button.active{background:var(--blueSoft);color:#245cb5}.field{display:grid;gap:5px;margin-top:8px}.field input,.field textarea,.field select{width:100%;border-radius:10px;border:1px solid #cfd9e9;background:#fff;color:var(--ink);padding:10px 11px;min-height:42px;font-size:13px}.field textarea{min-height:78px;resize:vertical}.form{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}.full{grid-column:1/-1}.subhead{font-weight:820;font-size:16px;margin:0 0 7px}.employer{border:1px solid #dbe4ef;border-radius:12px;padding:16px;margin-top:12px}.evidence{border:1px dashed #afc1dc;border-radius:12px;background:#fafdff;padding:15px;margin-top:13px}.preview{border:1px solid #cce3d2;background:#eef8f0;padding:12px;border-radius:10px;color:#2b603e;font-size:12px}.micro{font-size:11px;color:#708096}.blank{border:1px dashed #c8d7e9;padding:32px;text-align:center;background:#fbfdff;border-radius:12px}.loginbg{min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 20%,#deebff,transparent 42%),var(--bg)}.loginbox{width:min(880px,100%);display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 18px 65px #12355d1b}.loginleft{background:linear-gradient(135deg,#132a49,#295289);color:#fff;padding:36px;display:flex;justify-content:center;flex-direction:column}.loginleft h1{font-size:33px;line-height:1.15;letter-spacing:-.05em}.loginright{padding:38px;display:grid;align-content:center;gap:14px}.previewflag{position:fixed;z-index:10;right:13px;bottom:13px;border:1px solid #e0c67b;border-radius:50px;background:#fff8df;color:#7a5c1b;padding:6px 10px;font-size:11px;font-weight:850;box-shadow:var(--shadow)}.bottom{display:none}
@media(max-width:780px){.side{width:185px}.container{padding:22px 18px 98px}.profilelayout{grid-template-columns:1fr}.tabs{grid-template-columns:repeat(5,minmax(100px,1fr));overflow-x:auto}.tabs button{text-align:center;font-size:11px}.three{grid-template-columns:1fr 1fr}}
@media(max-width:630px){.side{display:none}.top{padding:0 14px;height:59px}.container{padding:18px 12px 100px}.heading{font-size:25px}.three,.two,.form,.loginbox{grid-template-columns:1fr}.full{grid-column:auto}.loginleft,.loginright{padding:25px}.loginleft h1{font-size:28px}.bottom{display:flex;position:fixed;z-index:6;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);justify-content:space-around;padding:7px 0 calc(7px + env(safe-area-inset-bottom))}.bottom button{border:0;background:transparent;color:#6b7890;display:grid;place-items:center;gap:1px;font-size:10px;font-weight:750}.bottom button.active{color:var(--blue)}.bottom span{font-size:18px}.previewflag{bottom:66px;right:7px}}
</style>
</head>
<body><main id="root"></main><div class="previewflag">DESIGN COPY · NO LIVE BACKEND</div>
<script>
'use strict';
var page='login',section='dashboard',tab='Work Experience',adding=false,expanded=true;
var names=['Work Experience','Education','Achievements','Interests','Skills'];
function e(s){return String(s==null?'':s).replace(/[&<>"']/g,function(k){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[k]})}
function button(label,action,style){return '<button class="btn '+(style||'')+'" data-action="'+action+'">'+label+'</button>'}
function menu(label,id,ico){return '<button data-nav="'+id+'" class="'+(section===id?'active':'')+'"><span>'+ico+'</span>'+label+'</button>'}
function auth(){return '<div class="loginbg"><div class="loginbox"><section class="loginleft"><div style="font-size:23px;font-weight:850">Garamaal.</div><h1>Your career, in one place.</h1><p style="color:#c4d7ed">A personal workspace for job discovery, tailored CVs and professional connections.</p><p class="small" style="border:1px solid #6987aa;border-radius:10px;padding:10px">Proposed multi-user sign-in. No real account or Google service is contacted here.</p></section><section class="loginright"><div class="eyebrow">Welcome</div><h2 style="margin:0;font-size:24px">Sign in to Garamaal</h2><p class="muted small">All your profile details, rankings and application history will be private to your user ID.</p><button class="btn" data-action="login" style="min-height:48px">G &nbsp; Continue with Google — preview</button><label class="field"><span class="label">Invitation code (planned)</span><input disabled placeholder="Available when invitations launch"></label><div class="micro">Future: Firebase Auth → invitation check → terms/privacy → your own dashboard.</div>'+button('Explore sample interface','login','soft')+'</section></div></div>'}
function structure(body){return '<div class="shell"><aside class="side"><div class="brand">Garamaal<small>Career Control Centre</small></div><div class="nav">'+menu('Dashboard','dashboard','▦')+menu('My Profile','profile','◉')+menu('Discovery','discovery','⌕')+menu('Make CV','fresh','▤')+menu('Add Job','add','＋')+menu('Social Hub','social','◇')+'</div><div class="sidefooter">Planned architecture<br>Firebase user ID • Private Firestore records<br>Preview only</div></aside><div class="main"><div class="top"><strong>Garamaal <span class="muted">/ '+e(section==='profile'?'My Profile':section==='dashboard'?'Dashboard':section)+'</span></strong><div class="right"><span class="badge">Prototype</span><div class="round">U</div><button class="btn" data-action="logout">Sign out</button></div></div><div class="container">'+body+'</div></div><nav class="bottom">'+menu('Home','dashboard','▦')+menu('Profile','profile','◉')+menu('Jobs','discovery','⌕')+menu('Make CV','fresh','▤')+menu('Social','social','◇')+'</nav></div>'}
function dashboard(){return '<div class="row"><div><div class="eyebrow">Overview</div><h1 class="heading">Your career dashboard</h1><p class="muted">Jobs, applications and progress at a glance.</p></div>'+button('+ Add job','goadd','primary')+'</div><section class="card" style="margin-top:15px"><div class="row"><div><strong>Rank Jobs with ChatGPT</strong><div class="mutedline">Your profile + your selected job descriptions → personal fit scores</div></div>'+button('Copy ranking prompt','ranking','primary')+'</div></section><div class="grid three" style="margin:15px 0"><section class="card"><div class="kpi">168</div><div class="mutedline">Discovered vacancies · sample</div></section><section class="card"><div class="kpi">24</div><div class="mutedline">Applications · sample</div></section><section class="card"><div class="kpi">6</div><div class="mutedline">CV requested · sample</div></section></div><div class="grid two"><section class="card profilecard"><div class="row"><div class="eyebrow">My Profile</div><span class="pill">64% complete</span></div><h2 class="subhead" style="margin:8px 0">Build your verified career profile</h2><p class="muted small">Make CVs and personalised rankings more consistent by checking your experience, results and evidence.</p><div class="progress"><div></div></div><p class="mutedline">3 experience records • 4 achievements • 8 skills</p><div class="row">'+button('Open my profile','profile','primary')+'<span class="micro">Private to your account</span></div></section><section class="card"><h2 class="subhead">From vacancy to CV</h2><p class="mutedline">Seems Kacha → Seems Taaza → Seems Fresh → Garam CV Ready</p><div class="grid" style="gap:10px"><div class="pill">Keep existing Jobs workflow in live app</div><div class="micro">This design proposes replacing only the current dashboard “Next move” card, not changing production tools.</div></div></section></div>'}
function input(name,value,type){return '<label class="field"><span class="label">'+e(name)+'</span><input type="'+(type||'text')+'" value="'+e(value||'')+'" aria-label="'+e(name)+'"></label>'}
function select(name,choices){return '<label class="field"><span class="label">'+e(name)+'</span><select>'+choices.map(function(x){return '<option>'+e(x)+'</option>'}).join('')+'</select></label>'}
function text(name,value,attr){return '<label class="field '+(attr||'')+'"><span class="label">'+e(name)+'</span><textarea>'+e(value||'')+'</textarea></label>'}
function experience(){return '<div class="row"><div><h2 class="subhead">Work Experience</h2><p class="mutedline">Separate each role; attach as many results as needed.</p></div>'+button('+ Add employer','addEmployer','primary')+'</div><div class="employer"><div class="row"><div><strong>Example Advisory Group</strong><div class="mutedline">Financial Planning Associate · Dublin · Jan 2025 – Present</div></div><span class="pill">Sample record</span></div><div class="form">'+input('Employer','Example Advisory Group')+input('Job title','Financial Planning Associate')+input('Start date','2025-01','month')+input('End date','Present')+input('Location','Dublin')+select('Work type',['Full time','Contract','Part time','Internship'])+text('Role summary / original notes','Supported client planning, product delivery and process improvement.','full')+'</div><div style="margin-top:16px" class="row"><div><strong>Impact achievements</strong><div class="mutedline">Each achievement is reusable in different CVs.</div></div>'+button(expanded?'Collapse example':'Expand example','toggle','soft')+'</div>'+(expanded?'<div class="evidence"><div class="form">'+text('Situation / challenge','Manual processing slowed client requests.','full')+text('Action taken','Mapped the workflow and coordinated a revised process.','full')+text('Outcome / result','Shortened turnaround time for the team.','full')+input('Metric value (optional)','15')+select('Metric type',['% faster turnaround','% cost saved','€ revenue','Clients served','No metric'])+select('Evidence quality',['Self-reported — review needed','Verified document','Manager confirmed','Not measurable'])+input('Source / document reference','Optional private attachment')+'</div><p class="micro">Do not fabricate performance figures. Add a baseline and timeframe when known.</p><div class="preview"><strong>CV bullet preview — illustrative:</strong> Improved a manual client workflow through process mapping and team coordination, supporting faster response times. <span class="micro">(No unverified 15% claim included.)</span></div>'+button('Save draft in preview','save','primary')+' <span id="status" class="micro">No cloud saves in this prototype.</span></div>':'')+'</div>'+(adding?'<div class="employer"><strong>New employment record</strong><div class="form">'+input('Employer','')+input('Job title','')+input('Start date','')+input('End date','')+text('Responsibilities and achievements','Paste original description here.','full')+'</div>'+button('Save preview record','save','primary')+'</div>':'')+'<div class="card" style="margin-top:14px"><strong>Quick import</strong><p class="mutedline">Paste your complete existing CV once, then approve how experiences and results are separated. Import/extraction will be implemented later.</p>'+text('Paste career history','', 'full')+button('Show proposed extraction','import','soft')+'</div>'}
function other(){if(tab==='Education')return '<h2 class="subhead">Education</h2><div class="form">'+input('Institution','Example University')+input('Qualification','MSc Finance')+input('Dates','2023 – 2024')+input('Grade','Optional')+text('Key modules, projects or evidence','','full')+'</div>'+button('Add qualification','save','primary');
if(tab==='Achievements')return '<h2 class="subhead">Achievements</h2><p class="mutedline">Link achievements to roles, projects and supporting files.</p><div class="form">'+input('Achievement title','Process improvement project')+input('Linked experience (optional)','Example Advisory Group')+text('Situation and action','','full')+text('Result and source','','full')+'</div>'+button('Add achievement','save','primary');
if(tab==='Interests')return '<h2 class="subhead">Interests and Career Goals</h2><div class="form">'+text('Preferred career directions','Corporate Finance, Wealth Management','full')+input('Target locations','Dublin, London')+text('Industry interests','Financial services, technology','full')+select('Visa / work authorisation evidence',['Not set','User supplied — verified','Not disclosed'])+'</div>'+button('Save preferences','save','primary');
return '<h2 class="subhead">Skills</h2><p class="mutedline">Evidence-linked skills, not just keyword lists.</p><div class="form">'+input('Skill','Financial modelling')+select('Proficiency',['Intermediate','Beginner','Advanced','Expert'])+input('Linked achievement / evidence','Optional')+select('Include in CV',['Yes','No','Ask each time'])+'</div>'+button('Add skill','save','primary')}
function profile(){return '<div class="eyebrow">My Profile • Private workspace</div><div class="row"><div><h1 class="heading">Your career profile</h1><p class="muted">A verified evidence library for better CVs and job rankings.</p></div><span class="pill">Draft • UID-controlled in future</span></div><section class="card profilecard" style="margin:17px 0"><div class="row"><div><strong>Profile completion</strong><p class="mutedline">Review outcomes and attach evidence before publishing.</p></div><strong>64%</strong></div><div class="progress"><div></div></div><p class="micro">In the full app, edits create a version history and do not trigger paid OpenAI calls.</p></section><div class="profilelayout"><nav class="card tabs" aria-label="Profile sections">'+names.map(function(n){return '<button data-tab="'+e(n)+'" class="'+(tab===n?'active':'')+'">'+e(n)+'</button>'}).join('')+'</nav><section class="card">'+(tab==='Work Experience'?experience():other())+'</section></div>'}
function placeholder(){return '<div class="eyebrow">Design scope</div><h1 class="heading">'+e(section)+'</h1><section class="card blank"><strong>Existing '+e(section)+' workflow is preserved.</strong><p>This prototype only designs the new multi-user Profile and sign-in screens. Actual job/Social processing is not connected.</p>'+button('Return to Dashboard','dashboard','primary')+'</section>'}
function render(){document.getElementById('root').innerHTML=page==='login'?auth():structure(section==='dashboard'?dashboard():section==='profile'?profile():placeholder())}
document.addEventListener('click',function(ev){var a=ev.target.closest('[data-action],[data-nav],[data-tab]');if(!a)return;if(a.hasAttribute('data-nav')){section=a.getAttribute('data-nav');render();window.scrollTo(0,0);return}if(a.hasAttribute('data-tab')){tab=a.getAttribute('data-tab');render();return}var k=a.getAttribute('data-action');if(k==='login'){page='workspace';section='dashboard'}else if(k==='logout'){page='login'}else if(k==='profile'){section='profile'}else if(k==='dashboard'){section='dashboard'}else if(k==='goadd'){section='add'}else if(k==='addEmployer'){adding=true;section='profile';tab='Work Experience'}else if(k==='toggle'){expanded=!expanded}else if(k==='save'){alert('Preview only: draft edits were not sent to a server or saved.')}else if(k==='import'){alert('Proposed import preview: extraction needs user approval and will be built after the data model is agreed.')}else if(k==='ranking'){alert('Rank with my ChatGPT: planned copy/export and validated import flow. This prototype does not access a real profile or call an API.')}render()});
render();
</script>
</body>
</html>
