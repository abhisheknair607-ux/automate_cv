<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#132a49">
<meta http-equiv="Content-Security-Policy" content="connect-src 'none'; object-src 'none'; form-action 'none'; worker-src 'none'; frame-src 'self' file:">
<title>Garamaal — Home and Swipe Design Preview</title>
<style>
:root{--navy:#132a49;--blue:#2563eb;--ink:#14243a;--muted:#61718a;--line:#dce5ef;--bg:#f5f7fb;--soft:#edf4ff;--white:#fff;--green:#147d53;--radius:14px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #78aaf5;outline-offset:2px}
button:disabled{opacity:.5;cursor:not-allowed}
h1,h2,h3,p{margin-top:0}
h1{font-size:clamp(24px,4vw,32px);line-height:1.16;letter-spacing:-.04em;margin-bottom:8px}
h2{font-size:17px;letter-spacing:-.015em;margin-bottom:8px}
a{color:var(--blue)}
.screen{min-height:100dvh}
.layout{display:grid;grid-template-columns:226px minmax(0,1fr)}
.side{height:100dvh;position:sticky;top:0;background:var(--navy);color:white;padding:21px 12px;display:flex;flex-direction:column}
.brand{font-weight:850;font-size:25px;letter-spacing:-.055em;padding:1px 11px 18px}
.brand small{display:block;letter-spacing:.14em;color:#b2c7e4;font-size:9px}
.sidenav{display:grid;gap:3px}
.navlink{display:flex;align-items:center;gap:12px;border:0;border-radius:10px;padding:12px 13px;background:transparent;color:#bfd0e6;text-align:left;font-weight:700;width:100%;min-height:44px}
.navlink:hover,.navlink[aria-current=page]{background:#2c496b;color:#fff}
.navicon{font-size:18px;line-height:1;width:23px;text-align:center}
.sidefoot{margin-top:auto;border:1px solid #536e90;color:#bdcee3;border-radius:11px;padding:12px;font-size:11px}
.main{min-width:0}
.top{position:sticky;top:0;z-index:5;background:white;border-bottom:1px solid var(--line);height:62px;padding:0 24px;display:flex;gap:12px;justify-content:space-between;align-items:center}
.topright{display:flex;align-items:center;gap:9px}
.avatar{border-radius:50%;background:#e9f2ff;color:#245a9f;font-weight:850;width:34px;height:34px;display:grid;place-items:center}
.container{max-width:1220px;margin:auto;padding:26px 24px 110px}
.card{background:white;border:1px solid var(--line);border-radius:var(--radius);padding:19px;box-shadow:0 4px 22px #16294e08}
.grid{display:grid;gap:16px}
.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.eyebrow{color:#5576a6;text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:830}
.muted{color:var(--muted)}
.small{font-size:12px}
.micro{font-size:11px;color:#79879a}
.btn{border:1px solid #cfdceb;background:white;color:#27558f;border-radius:10px;font-size:12px;font-weight:780;padding:9px 13px;min-height:44px}
.btn.primary{background:var(--blue);color:white;border-color:var(--blue)}
.btn.soft{background:var(--soft)}
.pill{background:#e9f2ff;color:#23589c;border-radius:50px;padding:5px 10px;font-size:11px;font-weight:760}
.note{background:#fff8e4;border:1px solid #e7d7a9;border-radius:11px;padding:12px;color:#765922;font-size:12px;margin:16px 0}
.note strong{display:block}
.progress{height:8px;border-radius:20px;background:#e2ebf5;overflow:hidden;margin:11px 0}
.progress div{height:100%;background:#3776df;width:64%}
.kpi{font-size:29px;font-weight:850;letter-spacing:-.04em}
.profile-layout{display:grid;grid-template-columns:225px minmax(0,1fr);gap:16px;align-items:start}
.tabs{display:grid;gap:5px}
.tabs button{width:100%;text-align:left;padding:11px 12px;border:0;background:transparent;color:#58708e;font-weight:740;border-radius:9px;min-height:43px}
.tabs button[aria-selected=true]{background:var(--soft);color:#245eb2}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.field{display:block}
.field span{display:block;font-size:12px;font-weight:750;color:#49617c;margin-bottom:5px}
.field input,.field textarea,.field select{display:block;width:100%;border:1px solid #cbd9e8;border-radius:9px;padding:10px;min-height:44px;color:var(--ink);background:white}
.field textarea{min-height:86px;resize:vertical}
.full{grid-column:1/-1}
.experience{border:1px solid #dbe5f0;border-radius:12px;margin-top:15px;padding:15px}
.achievement{border:1px dashed #b4cbe5;border-radius:12px;margin:12px 0;padding:14px;background:#fcfdff}
.proof{border:1px solid #c9e4d4;background:#f0faf3;color:#315d43;border-radius:10px;padding:12px;font-size:12px;margin:12px 0}
.section-divider{border:0;border-top:1px solid #e2e9f1;margin:18px 0}
.frame-card{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:white}
.frame-header{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.frame-card iframe{display:block;border:0;width:100%;height:calc(100dvh - 235px);min-height:520px;background:var(--bg)}
.subnav{display:flex;overflow-x:auto;gap:8px;padding:5px 0 12px}
.subnav button{white-space:nowrap}
.paper{white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f9fd;border:1px solid var(--line);padding:12px;border-radius:10px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;max-height:320px;overflow-y:auto}
.loginbg{display:grid;place-items:center;min-height:100dvh;background:radial-gradient(circle at 15% 20%,#dceaff,transparent 45%),var(--bg);padding:22px}
.login{max-width:900px;width:100%;display:grid;grid-template-columns:1fr 1fr;border-radius:18px;border:1px solid var(--line);overflow:hidden;background:white;box-shadow:0 12px 56px #15345c1b}
.loginleft{background:linear-gradient(130deg,#132a49,#326098);padding:34px;color:white;display:flex;flex-direction:column;justify-content:center}
.loginleft h1{font-size:35px}
.loginleft p{color:#d5e2f2}
.loginright{padding:35px;display:grid;gap:13px;align-content:center}
.loginright .btn{width:100%}
.previewflag{position:fixed;z-index:12;bottom:10px;right:10px;background:#fff9e5;border:1px solid #e4d4a1;color:#795c1a;border-radius:25px;padding:7px 12px;font-size:11px;font-weight:830}
.bottomnav{display:none}
.inline-list{padding-left:18px;color:#526782}
@media(max-width:960px){.profile-layout{grid-template-columns:1fr}.tabs{display:grid;grid-template-columns:repeat(5,minmax(132px,1fr));overflow:auto}.tabs button{text-align:center}.three{grid-template-columns:1fr 1fr}}
@media(max-width:720px){
.layout{display:block}.side{display:none}.top{padding:0 12px;height:57px}.container{padding:19px 12px 105px}
.card{padding:15px}.three,.two,.form,.login{grid-template-columns:1fr}.full{grid-column:auto}
.loginleft,.loginright{padding:24px}.loginleft h1{font-size:27px}
.frame-card iframe{height:75dvh;min-height:410px}
.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:white;border-top:1px solid var(--line);display:flex;justify-content:space-around;gap:2px;padding:5px 3px calc(5px + env(safe-area-inset-bottom))}
.bottomnav button{background:none;border:0;color:#62758c;font-size:10px;font-weight:750;min-height:45px;min-width:50px;padding:4px}
.bottomnav button[aria-current=page]{color:var(--blue)}
.bottomnav b{font-size:18px;display:block;line-height:22px}
.previewflag{right:7px;bottom:calc(66px + env(safe-area-inset-bottom))}
}
@media(max-width:390px){.topright .pill{display:none}.bottomnav button{min-width:44px}.tabs{grid-template-columns:repeat(5,117px)}}

/* Stage 2 — spacing, density, safe areas, focus and responsive integration */
:root{--radius:13px;--shadow:0 5px 16px rgba(16,43,75,.055)}
body{font-size:14px;line-height:1.48}
.container{max-width:1120px;padding:22px 24px 96px}
.card{padding:17px;box-shadow:var(--shadow)}
.grid{gap:12px}
.row{gap:9px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;text-align:center;line-height:1.3;white-space:normal}
.btn:hover{filter:brightness(.976)}
.btn:active{transform:translateY(1px)}
.field input,.field textarea,.field select{border-color:#c8d6e7;background:#fff;font-size:14px}
.field textarea{min-height:74px}
.field input:focus,.field textarea:focus{border-color:var(--blue);background:#fff}
.field span{font-size:12px}
.field:focus-within span{color:#265bae}
.form{gap:10px 13px}
.profile-layout{grid-template-columns:195px minmax(0,1fr);gap:13px}
.tabs{position:sticky;top:77px}
.tabs button{font-size:12px}
.experience{padding:0;background:#fff;overflow:hidden}
.experience>.experience-head{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:14px 15px;cursor:pointer;list-style:none;min-height:54px}
.experience>.experience-head::-webkit-details-marker{display:none}
.experience>.experience-head::after{content:"⌄";font-size:18px;color:#426ca6;flex-shrink:0}
.experience[open]>.experience-head::after{content:"⌃"}
.experience .experience-body{padding:0 14px 14px}
.experience>.experience-head:focus-visible{outline:3px solid #78aaf5;outline-offset:-3px}
.achievement{background:#f8fbff;border:1px solid #d8e5f3;padding:0;overflow:hidden}
.achievement>summary{cursor:pointer;padding:13px 14px;min-height:46px;font-weight:770;list-style:none;display:flex;align-items:center;justify-content:space-between}
.achievement>summary::-webkit-details-marker{display:none}
.achievement>summary:after{content:"⌄";color:#406ca5;font-size:17px}
.achievement[open]>summary:after{content:"⌃"}
.achievement .achievement-body{padding:2px 13px 13px}
.evidence-advanced{border-top:1px solid #dce6f3;margin-top:12px;padding-top:8px}
.evidence-advanced summary{cursor:pointer;color:#275b9d;min-height:40px;display:flex;align-items:center;font-weight:730;font-size:12px}
.evidence-advanced .form{padding-top:6px}
.form-status{font-size:12px;color:#176949;background:#e8f7ef;border-radius:8px;padding:8px 10px}
.form-status[hidden]{display:none}
.section-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.profile-submit{position:sticky;bottom:12px;background:rgba(255,255,255,.97);padding:11px;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;z-index:3;box-shadow:0 8px 25px #15345411}
.feature-top{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.feature-top .btn{min-height:40px}
.feature-page .frame-card{border-radius:12px}
.feature-page .frame-card iframe{height:calc(100dvh - 164px);min-height:560px}
.frame-header{padding:9px 12px;gap:7px}
.frame-header .row{gap:6px}
.frame-header .btn{padding:8px 10px;min-height:40px}
.mobile-more{display:none}
.bottomnav button:focus-visible{outline:3px solid #78aaf5;outline-offset:-5px}
.bottomnav button[aria-current=page]{background:#f0f6ff;border-radius:10px}
.bottomnav button{min-height:52px}
@media(max-width:960px){.profile-layout{grid-template-columns:minmax(0,1fr)}.tabs{top:73px;grid-template-columns:repeat(5,minmax(126px,1fr));overflow:auto;scrollbar-width:thin;padding:7px;scroll-snap-type:x proximity}.tabs button{scroll-snap-align:start}}
@media(max-width:720px){
 body{font-size:13.5px}
 .container{padding:14px 12px calc(94px + env(safe-area-inset-bottom));max-width:none}
 .top{padding:0 11px}
 .top>strong{min-width:0;max-width:65vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:13px}
 .topright{gap:5px}
 .topright>.btn{min-height:38px;padding:7px 8px}
 .grid{gap:10px}
 .card{padding:14px}
 .loginleft,.loginright{padding:23px}
 .loginleft{min-height:178px}
 .profile-layout{gap:9px}
 .tabs{margin:0 -1px;top:57px;padding:7px;display:flex;gap:6px;position:sticky;z-index:4;border-radius:11px}
 .tabs button{width:auto;flex:0 0 auto;min-width:113px;padding:9px 12px;min-height:42px}
 .experience .experience-body{padding:0 11px 11px}
 .achievement .achievement-body{padding:0 11px 11px}
 .form{grid-template-columns:1fr;gap:10px}
 .full{grid-column:1}
 .profile-submit{bottom:calc(77px + env(safe-area-inset-bottom));padding:9px 10px}
 .profile-submit .btn{flex:1}
 .feature-page .container{padding:0 0 calc(5px + env(safe-area-inset-bottom))}
 .feature-page .bottomnav{display:none}
 .feature-page .top{height:48px}
 .feature-page .topright{display:none}
 .feature-page .frame-card{border:0;border-radius:0}
 .feature-page .frame-card iframe{height:calc(100dvh - 102px - env(safe-area-inset-bottom));min-height:360px}
 .feature-page .frame-header{padding:5px 9px;min-height:50px}
 .feature-page .frame-header strong{font-size:12px}
 .feature-page .frame-header .row{display:none}
 .feature-top{padding:8px 9px;margin:0}
 .feature-page .note{display:none}
 .mobile-more{display:block;position:fixed;inset:0;z-index:11}
 .mobile-more .backdrop{position:absolute;inset:0;background:rgba(10,27,51,.5);border:0;width:100%}
 .mobile-more .sheet{position:absolute;bottom:0;left:0;right:0;background:#fff;border-radius:18px 18px 0 0;padding:12px 14px calc(82px + env(safe-area-inset-bottom));box-shadow:0 -12px 38px #0c214133;max-height:85dvh;overflow:auto}
 .mobile-more .sheet h2{margin:3px 0 13px}
 .mobile-more .sheet nav{display:grid;grid-template-columns:1fr 1fr;gap:8px}
 .mobile-more .sheet nav button{text-align:left;padding:12px;border:1px solid #e1e9f3;border-radius:10px;min-height:48px;background:#f8fbff;color:#234972;font-weight:700}
 .mobile-more .sheet button:focus-visible{outline-offset:-2px}
 .bottomnav{box-shadow:0 -4px 16px #172b4411;min-height:63px}
 .bottomnav button{min-width:52px;min-height:51px}
 .bottomnav b{font-size:19px}
 .note{margin:10px 0;padding:10px}
 .previewflag{font-size:9px;padding:5px 8px;bottom:calc(67px + env(safe-area-inset-bottom))}
}
@media(max-width:365px){
 .container{padding-left:9px;padding-right:9px}
 .bottomnav button{min-width:44px;font-size:9px}
 .tabs button{min-width:107px}
 .topright>.btn{font-size:10px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition:none!important;animation:none!important}}


/* Stage 2.2 | reference-inspired bold home launcher and compact two-hub navigation */
:root{--funk-lime:#dbff56;--funk-purple:#c879ed;--funk-ink:#191919}
#root{min-height:100dvh}
.stage22 .layout{display:block!important}
.stage22 .side{display:none!important}
.stage22 .main{width:100%;min-height:100dvh}
.stage22 .container{max-width:1000px;padding:13px 16px calc(101px + env(safe-area-inset-bottom))}
.stage22.launch-home{background:#191919;color:#fff;min-height:100dvh}
.stage22.launch-home .main{background:#191919}
.stage22.launch-home .top{max-width:680px;margin:0 auto;position:relative;background:#191919;color:#fff;border:0;height:54px;padding:0 18px}
.stage22.launch-home .container{max-width:680px;padding:10px 18px 42px}
.stage22.launch-home .top .avatar{background:var(--funk-lime);color:#171717}
.stage22.launch-home .bottomnav{display:none!important}
.launch-title{font-size:clamp(39px,9.5vw,62px);line-height:.99;letter-spacing:-.065em;font-weight:930;color:#fff;margin:18px 0 25px}
.launch-title em{color:var(--funk-purple);font-family:"Segoe Print","Brush Script MT",cursive;font-weight:780;white-space:nowrap;letter-spacing:-.05em}
.launch-actions{display:grid;gap:13px}
.launch-action{position:relative;isolation:isolate;overflow:hidden;width:100%;min-height:136px;border:0;border-radius:28px;text-align:left;padding:16px 20px;color:#181818;display:flex;align-items:center;gap:16px;transition:transform .15s}
.launch-action:active{transform:scale(.987)}.launch-action:focus-visible{outline:3px solid #fff;outline-offset:4px}
.launch-action.lime{background:var(--funk-lime)}.launch-action.purple{background:var(--funk-purple)}.launch-action.white{background:#fff}
.launch-symbol{width:55px;height:55px;flex:0 0 55px;border-radius:50%;display:grid;place-items:center;background:#191919;color:#fff;font-size:27px;z-index:1}
.launch-copy{z-index:1;max-width:68%;line-height:1.2}
.launch-copy strong{font-size:clamp(22px,4.8vw,30px);letter-spacing:-.045em;line-height:1.02;font-weight:900;display:block}
.launch-copy small{font-size:12px;display:block;font-weight:650;margin-top:7px}
.launch-art{position:absolute;right:0;top:13%;font-size:74px;line-height:1;transform:rotate(-15deg);text-shadow:3px 5px #2d2d2d19}
.launch-art.ticket{font-size:18px;line-height:1.03;top:46%;right:-2%;padding:9px 11px;background:var(--funk-lime);border:3px dashed #171717;transform:rotate(9deg);font-weight:950;text-align:center}
.launch-art.round{border:6px solid #171717;border-radius:100%;width:103px;height:103px;display:grid;place-items:center;background:#fff;top:42%;right:-4%;font-size:45px;transform:rotate(18deg)}
.launch-micro{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:-5px 0 18px}
.launch-micro button{min-height:38px;border:1px solid #505050;background:#2a2a2a;color:#fff;border-radius:999px;font-size:11px;font-weight:730;padding:8px 12px}
.launch-footer{margin:29px 5px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;color:#fff;font-weight:900;font-size:clamp(20px,5vw,30px);line-height:1.07;letter-spacing:-.04em}
.launch-footer button{border:0;background:transparent;color:var(--funk-lime);font-size:44px;cursor:pointer;min-width:55px;min-height:50px}
.launch-disclaimer{font-size:10px;color:#b4b4b4;margin-top:14px;text-align:center}
.stage22.hub-page .top{height:50px;background:var(--white);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:8;padding:0 10px;gap:7px}
.stage22.hub-page .top strong{font-size:15px;color:var(--ink)}
.stage22 .top .return{border:0;background:transparent;min-height:42px;min-width:41px;cursor:pointer;color:var(--ink);font-size:25px;border-radius:9px}
.stage22.launch-home .top .return{color:#fff}
.stage22 .top .avatar{border:0;cursor:pointer}
.stage22 .top .topright .pill,.stage22 .top .topright .btn{display:none!important}
.stage22.hub-page .bottomnav{display:flex!important;position:fixed;z-index:9;bottom:0;left:0;right:0;width:100%;justify-content:space-around;align-items:center;gap:0;padding:5px 3px calc(5px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #d9e3ed;box-shadow:0 -4px 20px #15294a13}
.stage22.hub-page .bottomnav button{flex:1;min-width:0;max-width:155px;background:transparent;border:0;border-radius:11px;font-size:10px;min-height:53px;padding:5px 2px;color:#657690;line-height:1.12;font-weight:710}
.stage22.hub-page .bottomnav button b{font-size:21px;line-height:24px;display:block;margin-bottom:3px}
.stage22.hub-page .bottomnav button.active{background:#edf4ff;color:#2055ac;font-weight:850}
.stage22.hub-page .bottomnav button.spotlight b{border-radius:100%;background:var(--funk-purple);color:#151515;border:3px solid #fff;display:grid;place-items:center;height:42px;width:42px;margin:-15px auto 1px;font-size:24px;box-shadow:0 3px 8px #33233c20}
.stage22.hub-page .feature-page .container{max-width:none;padding:0 0 calc(72px + env(safe-area-inset-bottom))}
.stage22.hub-page .frame-card{border:0;border-radius:0;background:transparent}
.stage22.hub-page .frame-card iframe{height:calc(100dvh - 131px - env(safe-area-inset-bottom));min-height:340px;border:0}
.stage22.hub-page .feature-top,.stage22.hub-page .frame-header,.stage22.hub-page .frame-card + .micro{display:none!important}
.stage22.hub-page .profile-submit{bottom:calc(79px + env(safe-area-inset-bottom))}
.stage22.hub-page .mobile-more{z-index:11}
.stage22.hub-page .mobile-more .sheet{padding:16px 14px calc(95px + env(safe-area-inset-bottom));max-width:550px;margin:0 auto}
.stage22.hub-page .mobile-more .sheet nav{grid-template-columns:1fr}
.stage22.hub-page .mobile-more .sheet nav button{min-height:52px}
.hub-title{font-size:17px;font-weight:850;line-height:1.15;margin:5px 0 10px}
.hub-topactions{display:flex;align-items:center;gap:7px;justify-content:space-between;margin:0 0 10px}
.hub-topactions .btn{min-height:37px;padding:6px 10px}
.hub-swipe{max-width:630px;margin:auto}
.hub-swipe .row{margin-bottom:10px}
.job-swipe-card{background:#fff;border:1px solid #d9e4ef;border-radius:23px;overflow:hidden;box-shadow:0 15px 28px #152e5715;touch-action:pan-y}
.job-swipe-hero{min-height:147px;background:#191919;padding:21px;position:relative;color:#fff}
.job-swipe-hero h2{font-size:clamp(24px,5vw,31px);margin:10px 0 7px;color:#fff;max-width:80%;line-height:1.09}
.job-swipe-hero p{font-size:12px;color:#d4d4d4;margin:0}
.job-swipe-hero .art{position:absolute;right:14px;top:17px;color:var(--funk-lime);font-size:48px;transform:rotate(13deg)}
.job-swipe-details{padding:16px}
.job-swipe-chips{display:flex;gap:6px;flex-wrap:wrap}
.job-swipe-chips .pill{font-size:10px;background:#f0f3fa;color:#394d66}
.job-swipe-details h3{font-size:13px;margin:14px 0 5px}
.job-swipe-details ul{padding-left:19px;margin:5px 0 9px;font-size:12px;line-height:1.5}
.job-swipe-details li{margin:5px 0}
.job-swipe-details details{border-top:1px solid #e0e7f0;margin-top:13px}
.job-swipe-details summary{cursor:pointer;padding:13px 0;min-height:44px;color:#2864b3;font-size:12px;font-weight:850}
.job-swipe-details .jd-full{white-space:pre-line;max-height:40dvh;overflow:auto;font-size:12px;line-height:1.56;color:#48566c;padding:0 0 10px}
.job-swipe-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:11px 0 0}
.job-swipe-controls button{min-height:58px;border-radius:15px;border:1px solid #cfdbeb;font-size:14px;font-weight:850;cursor:pointer}
.job-swipe-controls .pass{background:#fff;color:#334963}
.job-swipe-controls .save{background:var(--funk-lime);color:#171717;border-color:var(--funk-lime)}
.job-swipe-hint{text-align:center;color:#6c7a8d;font-size:11px;margin:10px 0}
.job-swipe-finish{text-align:center;padding:40px 14px}
.job-swipe-finish h2{font-size:23px}
.small-stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.small-stat-grid .card{padding:11px}
.small-stat-grid .kpi{font-size:clamp(17px,4.8vw,27px)}
.small-stat-grid .micro{font-size:10px}
.reminder-list{display:grid;gap:8px;margin:12px 0}
.reminder-entry{display:flex;align-items:center;justify-content:space-between;gap:9px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}
.reminder-entry .small{margin:0}
.dashboard-mini{font-size:12px;color:#516783}
@media(min-width:800px){.stage22.hub-page .bottomnav{max-width:890px;margin:0 auto;border-radius:15px 15px 0 0}}
@media(max-width:540px){
 .stage22.launch-home .top{padding:0 15px}
 .stage22.launch-home .container{padding:0 14px 36px}
 .launch-title{margin:14px 0 23px;font-size:clamp(36px,10.7vw,50px)}
 .launch-actions{gap:12px}
 .launch-action{min-height:131px;border-radius:24px;padding:13px 15px;gap:14px}
 .launch-symbol{width:51px;height:51px;flex-basis:51px;font-size:25px}
 .launch-copy strong{font-size:24px}
 .launch-copy small{font-size:11px}
 .launch-art{font-size:54px}
 .launch-art.round{width:88px;height:88px;font-size:36px}
 .launch-art.ticket{font-size:15px}
 .stage22.hub-page .container{padding:11px 11px calc(94px + env(safe-area-inset-bottom))}
 .stage22.hub-page .feature-page .container{padding:0 0 calc(70px + env(safe-area-inset-bottom))}
 .stage22.hub-page .frame-card iframe{height:calc(100dvh - 127px - env(safe-area-inset-bottom))}
 .job-swipe-hero{min-height:135px;padding:18px}
 .job-swipe-details{padding:13px}
}
@media(max-width:350px){.launch-action{min-height:120px}.launch-symbol{width:44px;height:44px;flex-basis:44px}.launch-copy strong{font-size:21px}.stage22.hub-page .bottomnav button{font-size:9px}}

<body><div id="root"></div><div class="previewflag">UX CONCEPT · DESIGN ONLY</div>
<script>
"use strict";
const NAV=[["home","Dashboard","▦"],["jobs","Jobs","⌕"],["profile","Profile","◉"],["social","Social Hub","◇"],["rank","My Rankings","▤"],["usage","Usage & Credits","◷"],["account","Account","⚙"]];
const TABS=["Work Experience","Education","Achievements","Interests","Skills"];
const DEMO_JOBS=[{id:"sample-job-1",employer:"Example Capital",title:"Corporate Finance Analyst",jd:"Financial modelling, valuation, Excel, transaction analysis and clear stakeholder communication."},{id:"sample-job-2",employer:"Sample Wealth",title:"Wealth Planner",jd:"Provide planning support, client suitability review and wealth reporting."}];
const app={uid:null,view:"home",section:"Work Experience",profiles:{},jobsPage:"dashboard",socialPage:"dashboard",lastMessage:"",moreOpen:false,rankJobId:"sample-job-1",dirty:false,openExperience:0,openAchievementKey:"",swipeIndex:0,viewedHome:true,reminders:[{id:1,text:"Review shortlisted jobs",done:false},{id:2,text:"Follow up on new connections",done:false}],weeklyTarget:8};
function safe(t){return String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function model(uid){return {name:uid==="a"?"Abhishek (sample)":uid==="p"?"Pooja (sample)":"New member (sample)",headline:"Financial services professional",goals:"Corporate Finance / Wealth Management",location:"Dublin, Ireland",saves:0,ranking:{},experience:[{company:"Example Advisory",title:"Associate",start:"2025-01",end:"",location:"Dublin",summary:"Client advisory and workflow improvements.",achievements:[{challenge:"Manual client reporting required a clearer review process.",action:"Coordinated a new review checklist and case tracking workflow.",result:"Made reporting more consistent.",metric:"",unit:"",evidence:"Self-reported; verify before using a figure",bullet:"Improved client case reporting by coordinating a review checklist and introducing consistent tracking."}]}],education:[{school:"Example University",degree:"MSc Finance",dates:"2023–2024"}],achievements:[{name:"Professional development",detail:"Add qualifications, dates and supporting documents."}],interests:[{name:"Private wealth",detail:"Career interest"}],skills:[{name:"Financial modelling",level:"Advanced"}]}}
function p(){return app.profiles[app.uid]}
function btn(label,action,value="",cl=""){return '<button class="btn '+cl+'" type="button" data-action="'+safe(action)+'" data-value="'+safe(value)+'">'+label+'</button>'}
function field(path,label,value,type="text",full=false){return '<label class="field '+(full?"full":"")+'"><span>'+safe(label)+'</span>'+(type==="textarea"?'<textarea data-path="'+safe(path)+'" aria-label="'+safe(label)+'">'+safe(value||"")+'</textarea>':'<input type="'+safe(type)+'" data-path="'+safe(path)+'" aria-label="'+safe(label)+'" value="'+safe(value||"")+'">')+'</label>'}
function pageTitle(title,subtitle){return '<div class="eyebrow">My workspace</div><div class="row"><div><h1>'+safe(title)+'</h1><p class="muted small">'+safe(subtitle)+'</p></div><span class="pill">Private user data · planned</span></div>'}
function note(msg){return '<div class="note"><strong>Design-only version</strong>'+safe(msg||"All screens use sample information. No live Google, OpenAI, LinkedIn, GitHub Actions, Sheets or Drive requests are made.")+'</div>'}
function login(){return '<main class="loginbg"><div class="login"><div class="loginleft"><strong style="font-size:26px">Garamaal.</strong><h1>Your career, all in one place.</h1><p>Discover shared opportunities, and keep profiles, CVs, rankings and professional relationships separate for every user.</p><p class="small">Future path: Google → Firebase Auth UID → private workspace and spending controls.</p></div><div class="loginright"><div class="eyebrow">Welcome to Garamaal</div><h2>Sign in to your workspace</h2><p class="muted small">These sign-ins are illustrative. They do not access or modify either sample account.</p>'+btn("Continue with Google — simulation","enter","n","primary")+btn("Explore Abhishek’s sample","enter","a")+btn("Explore Pooja’s sample","enter","p")+'<div class="micro">Future: invitations, ownership rules, terms, profile onboarding, credit limits and API usage.</div></div></div></main>'}
function shell(content){
 const launcher=app.view==="home";
 const hub=app.view==="jobs"||app.view==="social";
 const feature=hub&&((app.view==="jobs"&&["dashboard","discovery","fresh","add"].includes(app.jobsPage))||(app.view==="social"&&["dashboard","inbox","swipe","followups"].includes(app.socialPage)));
 const pageTitleText=app.view==="jobs"?"Jobs":app.view==="social"?"Social":app.view==="profile"?"My profile":app.view==="stats"?"Statistics":app.view==="account"?"Account":app.view==="rank"?"My rankings":app.view==="usage"?"Credits":"Garamaal";
 const header='<header class="top"><button type="button" class="return" data-action="back" aria-label="Go back">'+(launcher?"✦":"‹")+'</button><strong>'+ (launcher?"GARAMAAL":safe(pageTitleText))+'</strong><div class="topright"><button type="button" class="avatar" data-action="goto" data-value="account" aria-label="Open my profile and account">'+safe(p().name[0])+'</button></div></header>';
 const items=app.view==="jobs"?[["dashboard","Dashboard","▦"],["discovery","Discovery","⌕"],["swipe","Swipe","⇄"],["fresh","Make CV","▤"],["more","More","⋯"]]:app.view==="social"?[["dashboard","Targets","◎"],["inbox","Research","▣"],["swipe","Swipe","⇄"],["followups","Follow-ups","↗"],["stats","Stats","▥"]]:[];
 const current=app.view==="jobs"?app.jobsPage:app.socialPage;
 const mobile=items.map(([id,label,ic])=>'<button type="button" class="'+(current===id||current==="add"&&id==="more"?"active ":"")+(id==="swipe"?"spotlight":"")+'" data-action="hub-tab" data-value="'+id+'" aria-label="'+safe(label)+'" '+(current===id?'aria-current="page"':'')+'><b aria-hidden="true">'+ic+'</b>'+safe(label)+'</button>').join("");
 const more=app.moreOpen?'<div class="mobile-more" id="mobile-more-menu"><button aria-label="Close menu" class="backdrop" data-action="close-more"></button><div class="sheet" role="dialog" aria-modal="true" aria-label="More tools"><div class="row"><h2>More options</h2>'+btn("Close","close-more")+'</div><nav aria-label="Additional tools">'+(app.view==="jobs"?'<button id="more-first" data-action="hub-tab" data-value="add">＋ Add job</button><button data-action="goto" data-value="stats">▥ Job statistics and targets</button>':'')+'<button data-action="goto" data-value="rank">▤ My rankings</button><button data-action="goto" data-value="usage">◷ Credits</button><button data-action="goto" data-value="profile">◉ Profile</button><button data-action="goto" data-value="account">⚙ Account</button></nav></div></div>':"";
 return '<div class="stage22 '+(launcher?"launch-home":"hub-page")+'"><div class="layout '+(feature?'feature-page':'')+'"><div class="main">'+header+'<main class="container">'+content+'<div id="status-message" class="form-status" role="status" aria-live="polite" hidden></div></main></div></div>'+(hub?'<nav class="bottomnav" aria-label="'+(app.view==="jobs"?"Jobs":"Social")+' navigation">'+mobile+'</nav>':"")+more+'</div>';
}
function completeness(d){
 const hasWork=d.experience.some(x=>x.company.trim()&&x.title.trim()&&x.achievements.some(a=>a.action.trim()));
 const hasEvidence=d.experience.some(x=>x.achievements.some(a=>a.result.trim()&&a.evidence.trim()&&!/self.reported/i.test(a.evidence)));
 const checks=[hasWork,d.education.some(x=>x.school.trim()&&x.degree.trim()),d.achievements.some(x=>x.name.trim()),Boolean(d.goals.trim()&&d.location.trim()),d.skills.some(x=>x.name.trim()),hasEvidence];
 return {done:checks.filter(Boolean).length,total:checks.length,percent:Math.round(checks.filter(Boolean).length/checks.length*100)};
}
function inform(message){app.notice=message;const node=document.getElementById("status-message");if(node){node.textContent=message;node.hidden=false}else alert(message)}
function home(){
 const c=completeness(p()),saved=Object.values(p().jobPreferences||{}).filter(x=>x==="interested").length,pending=app.reminders.filter(x=>!x.done).length;
 return '<h1 class="launch-title">What do<br>you want<br>to do <em>today?</em></h1>'+
 '<div class="launch-micro"><button data-action="goto" data-value="stats">◎ Targets · '+saved+'/'+app.weeklyTarget+'</button><button data-action="goto" data-value="stats">◷ Reminders · '+pending+'</button><button data-action="goto" data-value="stats">▥ My stats</button></div>'+
 '<div class="launch-actions">'+
 '<button class="launch-action lime" data-action="goto" data-value="profile"><span class="launch-symbol">◉</span><span class="launch-copy"><strong>Update profile</strong><small>'+c.percent+'% complete · Your career story</small></span><span class="launch-art" aria-hidden="true">✎</span></button>'+
 '<button class="launch-action white" data-action="goto" data-value="jobs"><span class="launch-symbol">↗</span><span class="launch-copy"><strong>Apply jobs</strong><small>Discover · Swipe · Make CV</small></span><span class="launch-art round" aria-hidden="true">✦</span></button>'+
 '<button class="launch-action purple" data-action="goto" data-value="social"><span class="launch-symbol">⇄</span><span class="launch-copy"><strong>Network</strong><small>Targets · Research · Connect</small></span><span class="launch-art" aria-hidden="true">◎</span></button>'+
 '<button class="launch-action white" data-action="goto" data-value="stats"><span class="launch-symbol">▥</span><span class="launch-copy"><strong>Statistics</strong><small>My targets, progress & reminders</small></span><span class="launch-art ticket" aria-hidden="true">GOAL<br>GETTER!</span></button>'+
 '</div><div class="launch-footer"><span>START YOUR<br>JOURNEY</span><button aria-label="Start with Jobs" data-action="goto" data-value="jobs">⟶</button></div>'+
 '<div class="launch-disclaimer">UI concept · sample data · no live changes</div>';
}
function experience(x,i){
 const top='<div><strong>'+safe(x.company||"New employer")+'</strong><div class="micro">'+safe(x.title||"Add designation")+' · '+safe(x.location||"Add location")+'</div></div>';
 const fields='<div class="form">'+field("experience:"+i+":company","Company",x.company)+field("experience:"+i+":title","Designation",x.title)+field("experience:"+i+":start","Start date",x.start,"month")+field("experience:"+i+":end","End date (blank = present)",x.end,"month")+field("experience:"+i+":location","Location",x.location)+field("experience:"+i+":summary","Role overview / unedited original notes",x.summary,"textarea",true)+'</div>';
 const ach=x.achievements.map((a,j)=>{
  const previewId=i+":"+j, preview=app.bulletPreview?.id===previewId?app.bulletPreview:null;
  const details='<div class="form">'+field("ach:"+i+":"+j+":challenge","Situation / challenge",a.challenge,"textarea",true)+field("ach:"+i+":"+j+":action","Action (what you did)",a.action,"textarea",true)+field("ach:"+i+":"+j+":result","Result (measured or qualitative)",a.result,"textarea",true)+'</div>';
  const advanced='<details class="evidence-advanced"><summary>Numbers, evidence and preferred wording (optional)</summary><div class="form">'+field("ach:"+i+":"+j+":metric","Numeric value",a.metric)+field("ach:"+i+":"+j+":unit","Unit, baseline / timeframe",a.unit)+field("ach:"+i+":"+j+":evidence","Evidence / verification state",a.evidence,"textarea",true)+field("ach:"+i+":"+j+":bullet","Preferred CV bullet (user-checked)",a.bullet,"textarea",true)+'</div></details>';
  const result=preview?'<div class="proof" role="status"><strong>CV bullet preview · '+preview.words+' words</strong><div>'+safe(preview.bullet)+'</div><div class="micro">'+(preview.words>25?"Over the 25-word preference: shorten before using.":"Review wording and evidence before using.")+' No performance figures are generated.</div></div>':"";
  return '<details class="achievement" '+(j===0||app.openAchievementKey===previewId?"open":"")+'><summary>Impact '+(j+1)+' · '+safe((a.result||a.action||"Add result").slice(0,44))+'</summary><div class="achievement-body">'+details+advanced+'<div class="row" style="margin-top:10px">'+btn("Preview concise bullet","preview-bullet",previewId,"soft")+'<span class="micro">No paid API calls</span></div>'+result+'</div></details>';
 }).join("");
 return '<details class="experience" '+(i===app.openExperience?"open":"")+'><summary class="experience-head">'+top+'<span class="pill">Role '+(i+1)+'</span></summary><div class="experience-body">'+fields+'<hr class="section-divider"><div class="section-toolbar"><strong>Reusable STAR achievements</strong>'+btn("+ Achievement","add-ach",i)+'</div>'+ach+'<div class="proof">Evidence-first: keep a meaningful outcome; add a numeric result only when verified. Source notes are preserved separately.</div></div></details>';
}
function profile(){
 const d=p(), t=app.section, complete=completeness(d);let body="";
 if(t==="Work Experience")body='<div class="section-toolbar"><div><h2>Work Experience</h2><p class="muted small">Add one card for every role. Expand only the achievement you want to edit.</p></div>'+btn("+ Add role","add-exp","","primary")+'</div>'+d.experience.map(experience).join("")+'<div class="card" style="margin-top:13px"><h2>Import full CV text (future)</h2><p class="small muted">Paste once, then approve each proposed role and achievement before anything becomes verified.</p>'+field("paste:original","Original, unedited career history",d.originalRaw||"", "textarea",true)+'</div>';
 if(t==="Education")body='<div class="section-toolbar"><h2>Education</h2>'+btn("+ Education","add-edu","","primary")+'</div>'+d.education.map((x,i)=>'<div class="experience form" style="padding:13px">'+field("edu:"+i+":school","Institution",x.school)+field("edu:"+i+":degree","Qualification",x.degree)+field("edu:"+i+":dates","Dates",x.dates)+'</div>').join("");
 if(t==="Achievements")body='<div class="section-toolbar"><h2>Achievements & qualifications</h2>'+btn("+ Achievement","add-award","","primary")+'</div>'+d.achievements.map((x,i)=>'<div class="experience form" style="padding:13px">'+field("award:"+i+":name","Award, credential or project",x.name)+field("award:"+i+":detail","Details and supporting evidence",x.detail,"textarea",true)+'</div>').join("");
 if(t==="Interests")body='<h2>Interests and career goals</h2><p class="muted small">These preferences guide your private fit scores. They are not automatically shared.</p><div class="form">'+field("root:goals","Target roles and sectors",d.goals,"textarea",true)+field("root:location","Preferred location",d.location)+field("root:headline","Professional headline",d.headline)+'</div>';
 if(t==="Skills")body='<div class="section-toolbar"><h2>Skills</h2>'+btn("+ Skill","add-skill","","primary")+'</div>'+d.skills.map((x,i)=>'<div class="experience form" style="padding:13px">'+field("skill:"+i+":name","Skill",x.name)+field("skill:"+i+":level","Proficiency / evidence context",x.level)+'</div>').join("");
 const tabs=TABS.map(v=>'<button id="tab-'+TABS.indexOf(v)+'" role="tab" aria-controls="profile-panel" tabindex="'+(t===v?0:-1)+'" aria-selected="'+(t===v)+'" data-tab="'+safe(v)+'">'+safe(v)+'</button>').join("");
 return pageTitle("My career profile","Editable per-role evidence library — no automated model calls")+
 '<div class="card" style="margin:12px 0"><div class="row"><div><strong>Profile readiness</strong><p class="micro" style="margin:2px 0">'+complete.done+' of '+complete.total+' profile checks complete · estimates only</p></div><span class="pill">'+complete.percent+'%</span></div><div class="progress" aria-label="Profile completeness"><div style="width:'+complete.percent+'%"></div></div><span class="micro">One readiness check is source-backed results; self-reported figures remain unverified until reviewed.</span></div>'+
 '<div class="profile-layout"><nav class="card tabs" aria-label="Profile sections" role="tablist">'+tabs+'</nav><section id="profile-panel" role="tabpanel" aria-labelledby="tab-'+TABS.indexOf(t)+'" class="card">'+body+'<hr class="section-divider"><div class="profile-submit">'+btn("Save draft in preview","save","","primary")+'<span class="micro" id="draft-status">'+(app.dirty?"Changes in this preview":"Edited fields are browser-memory only")+'</span></div></section></div>';
}
function original(kind){
 const src=kind==="social"?"social.html":"jobs.html";
 const title=kind==="social"?"Social Networking Hub":"Jobs · Discovery · Make CV";
 return '<div class="feature-top">'+btn("← Back to dashboard","goto","home","soft")+'<span class="pill">'+(kind==="social"?"Research · Swipe · Follow-ups":"Dashboard · Discovery · CV · Add job")+'</span></div>'+
 '<div class="frame-card"><div class="frame-header"><strong>'+safe(title)+' <span class="micro">· Preserved reference</span></strong><div class="row">'+(kind==="jobs"?btn("Dashboard","job-nav","dashboard")+btn("Discovery","job-nav","discovery")+btn("Make CV","job-nav","fresh")+btn("Add Job","job-nav","add"):"")+'</div><a class="btn" href="'+src+'" target="_blank" rel="noopener noreferrer">Open full page ↗</a></div>'+
 '<iframe id="legacy-frame" src="'+src+'" title="'+safe(title)+' full preserved feature page" sandbox="allow-scripts allow-forms allow-modals" referrerpolicy="no-referrer" loading="eager"></iframe></div>'+
 '<p class="micro" style="padding:10px">Network connections are blocked in this preview. The original A/P switch is legacy UI, not multi-user authorisation.</p>';
}

const DISCOVERY_READY_SAMPLES=[
 {id:"ready-fin-001",employer:"Example Capital",role:"Corporate Finance Analyst",location:"Dublin · Hybrid",type:"Corporate Finance",level:"Analyst",stage:"JD complete",keyPoints:["Financial modelling and valuation work","Support due diligence and transaction execution","Build stakeholder-ready financial analysis"],jd:"Example Capital — Corporate Finance Analyst\nDublin, Ireland · Hybrid\n\nRole overview\nSupport corporate finance transactions and business valuations, preparing financial models and investment analysis and working closely with team members and clients.\n\nResponsibilities\n• Build financial models and valuation materials\n• Conduct due diligence and company research\n• Prepare concise client presentations and investment summaries\n• Support transaction execution and documentation\n\nRequirements\n• Financial modelling and spreadsheet analysis\n• Ability to communicate findings clearly\n• Interest in corporate finance and transactions\n\nThis is a fictional job-description sample.",jdComplete:true,discoveryPassed:true},
 {id:"ready-wealth-002",employer:"Sample Wealth",role:"Wealth Planning Associate",location:"Dublin · Office",type:"Wealth Management",level:"Associate",stage:"JD complete",keyPoints:["Assist with financial planning and suitability","Prepare client portfolio review materials","Work closely with advisers on client cases"],jd:"Sample Wealth — Wealth Planning Associate\nDublin, Ireland · Office\n\nRole overview\nHelp advisers prepare accurate client plans, coordinate financial information and respond to enquiries.\n\nResponsibilities\n• Support suitability and needs assessment\n• Maintain client documentation and portfolio reviews\n• Prepare research and financial planning reports\n• Collaborate with advisers and investment teams\n\nRequirements\n• Strong financial services interest\n• Excellent client communication\n• Methodical documentation standards\n\nThis is a fictional job-description sample.",jdComplete:true,discoveryPassed:true},
 {id:"ready-tp-003",employer:"Example Advisory",role:"Transfer Pricing Senior Consultant",location:"London · Hybrid",type:"Transfer Pricing",level:"Senior Consultant",stage:"JD complete",keyPoints:["Prepare intercompany documentation","Perform financial benchmarking analysis","Work with colleagues across tax teams"],jd:"Example Advisory — Transfer Pricing Senior Consultant\nLondon, United Kingdom · Hybrid\n\nRole overview\nJoin an international tax consulting team focused on intercompany pricing arrangements and supporting documentation.\n\nResponsibilities\n• Carry out functional interviews and industry analyses\n• Prepare economic benchmarking and documentation\n• Review related-party financing arrangements\n• Coordinate deliverables across teams\n\nRequirements\n• Experience in transfer pricing advisory\n• Understanding of OECD guidance\n• Clear business writing and client handling\n\nThis is a fictional job-description sample.",jdComplete:true,discoveryPassed:true},
 {id:"pending-jd-004",employer:"Demo Services",role:"Analyst — Description Missing",location:"Remote",type:"Analyst",level:"Entry",stage:"JD missing",keyPoints:[],jd:"",jdComplete:false,discoveryPassed:false}
];
function eligibleJobs(){return DISCOVERY_READY_SAMPLES.filter(j=>j.discoveryPassed&&j.jdComplete&&j.jd.trim().length>=80)}
function remainingJobs(){const prefs=p().jobPreferences||{};return eligibleJobs().filter(j=>!prefs[j.id])}
function swipeStats(){const prefs=p().jobPreferences||{};return {yes:Object.values(prefs).filter(v=>v==="interested").length,no:Object.values(prefs).filter(v=>v==="not-interested").length,total:eligibleJobs().length}}
function jobSwipe(){
 const left=remainingJobs(),c=left[0],count=swipeStats();
 if(!c)return '<div class="hub-swipe"><div class="job-swipe-finish"><div style="font-size:57px">✓</div><h2>All caught up!</h2><p>You reviewed all '+count.total+' JD-complete sample jobs.</p><p class="muted small">'+count.yes+' interested · '+count.no+' not interested</p><div class="row" style="justify-content:center">'+btn("View Discovery","hub-tab","discovery","primary")+btn("Reset sample swipes","reset-swipes")+'</div></div></div>';
 return '<div class="hub-swipe"><div class="row" style="margin-bottom:11px"><span class="pill">JD verified · Discovery passed</span><span class="micro">'+(count.total-left.length+1)+' / '+count.total+' jobs</span></div>'+
 '<div class="job-swipe-card" id="jobSwipeCard" tabindex="0" aria-label="'+safe(c.role)+' at '+safe(c.employer)+'; swipe left for not interested, right for interested">'+
 '<div class="job-swipe-hero"><span class="eyebrow" style="color:#daff5b">'+safe(c.type)+'</span><h2>'+safe(c.role)+'</h2><p>'+safe(c.employer)+'</p><span class="art" aria-hidden="true">✦</span></div>'+
 '<div class="job-swipe-details"><div class="job-swipe-chips"><span class="pill">'+safe(c.location)+'</span><span class="pill">'+safe(c.level)+'</span><span class="pill">Full JD available</span></div>'+
 '<h3>At a glance</h3><ul>'+c.keyPoints.map(x=>'<li>'+safe(x)+'</li>').join("")+'</ul>'+
 '<details><summary>Read full job description</summary><div class="jd-full">'+safe(c.jd)+'</div></details></div></div>'+
 '<div class="job-swipe-controls"><button class="pass" data-action="swipe-job" data-value="not-interested">← Not interested</button><button class="save" data-action="swipe-job" data-value="interested">Interested →</button></div>'+
 '<div class="job-swipe-hint">Swipe left or right · Only JD-complete jobs appear here</div>'+
 '<div class="micro" style="text-align:center">This is an offline sample. No Taaza/Freshmaal status is written.</div></div>';
}
function statsPage(kind="personal"){
 const x=swipeStats(),done=app.reminders.filter(y=>y.done).length,c=completeness(p());
 const social=kind==="social";
 return '<div class="stats-top"><div class="hub-topactions"><span class="eyebrow">'+(social?"NETWORKING":"PERSONAL PROGRESS")+'</span><span class="pill">Sample metrics</span></div>'+
 '<h2 class="hub-title">'+(social?"Social statistics":"Your targets & reminders")+'</h2>'+
 '<div class="small-stat-grid"><div class="card"><div class="kpi">'+x.yes+'</div><span class="micro">Jobs interested</span></div><div class="card"><div class="kpi">'+c.percent+'%</div><span class="micro">Profile readiness</span></div><div class="card"><div class="kpi">'+done+'/'+app.reminders.length+'</div><span class="micro">Reminders done</span></div></div>'+
 '<div class="card" style="margin-top:12px"><div class="row"><h3>Weekly targets</h3><span class="pill">'+x.yes+'/'+app.weeklyTarget+' job interests</span></div><div class="progress"><div style="width:'+Math.min(100,Math.round(x.yes/app.weeklyTarget*100))+'%"></div></div>'+
 '<div class="row">'+btn("− Reduce target","change-target","-1")+btn("+ Raise target","change-target","1")+'</div><p class="micro" style="margin-top:8px">Targets are local examples. Real tracking will be tied to authenticated user data.</p></div>'+
 '<div class="card" style="margin-top:12px"><div class="row"><h3>Reminders</h3><span class="pill">'+app.reminders.filter(y=>!y.done).length+' pending</span></div>'+
 '<div class="reminder-list">'+app.reminders.map(t=>'<label class="reminder-entry"><span class="small">'+safe(t.text)+'</span><input type="checkbox" data-reminder-id="'+t.id+'" '+(t.done?"checked":"")+' aria-label="Mark reminder complete" /></label>').join("")+'</div>'+
 '<div class="form" style="grid-template-columns:minmax(0,1fr) auto"><input class="gm-input" id="reminder-new" maxlength="120" placeholder="Add reminder (this session)" aria-label="New reminder"/>'+btn("Add","add-reminder","","primary")+'</div>'+
 '<p class="micro" style="margin-top:8px">In-app checklist preview only — no push alerts or scheduled notifications.</p></div>'+
 (social?'<div class="card" style="margin-top:12px"><h3>Networking targets</h3><p class="small muted">Connections, follow-ups and research completion will use private user-specific metrics after the backend migration.</p>'+btn("Back to Targets","hub-tab","dashboard")+'</div>':'')+'</div>';
}

function rank(){const d=p(),job=DEMO_JOBS.find(j=>j.id===app.rankJobId)||DEMO_JOBS[0];const prompt="Rank only this user’s selected job. Score Profile Fit and Career Fit 0–100, weigh 55%/45%, explain evidence and gaps without making up facts. Return JSON with keys jobId, profileFit, careerFit, rationale.\\nUSER PROFILE: "+JSON.stringify({headline:d.headline,careerGoals:d.goals,experience:d.experience.map(x=>({role:x.title,summary:x.summary,results:x.achievements.map(a=>({action:a.action,result:a.result,metric:a.metric}))}))})+"\\nJOB DESCRIPTION: "+JSON.stringify(job);
const values=Object.values(d.ranking);
return pageTitle("My job rankings","Personal scores from my profile, not other members' scores")+note("Your own ChatGPT ranking prompt is the planned low-API-cost path. Direct write access requires a scoped connector and availability testing; this preview only copies and imports text.")+'<div class="grid two"><div class="card"><h2>1. Rank in your ChatGPT</h2><label class="field"><span>Choose a sample vacancy</span><select id="rank-job-select">'+DEMO_JOBS.map(j=>'<option value="'+safe(j.id)+'" '+(j.id===job.id?"selected":"")+'>'+safe(j.employer+" · "+j.title)+'</option>').join("")+'</select></label><p class="small muted">Compact selected profile evidence + one JD. No Garamaal ranking API model call.</p><div class="paper">'+safe(prompt)+'</div>'+btn("Copy my prompt","copy-prompt","","primary")+'</div><div class="card"><h2>2. Import only my score</h2><p class="small muted">Provide valid JSON; this preview recalculates 55/45 and saves it only to this sample user.</p><label class="field"><span>Paste JSON output</span><textarea id="ranking-json" placeholder="Paste JSON for the selected job"></textarea></label><div style="margin-top:10px">'+btn("Validate and import","rank-import","","primary")+'</div><hr class="section-divider"><h2>My scores</h2>'+(values.length?values.map(x=>'<div class="achievement"><strong>'+safe(x.jobId)+'</strong> · '+x.score.toFixed(1)+'/100<p class="small muted">'+safe(x.rationale)+'</p></div>').join(""):'<p class="small muted">No personal scores have been imported.</p>')+'</div></div>'}
function usage(){return pageTitle("Usage & credits","Personal billing, failed-run costs and safe spending limits")+note("Credit balances are examples. Financial enforcement and provider reconciliation are not implemented; only a backend can ensure charges are authorised.")+'<div class="grid three"><div class="card"><div class="kpi">€0.00</div><span class="small muted">Prepaid balance (sample)</span></div><div class="card"><div class="kpi">€0.00</div><span class="small muted">Reserved</span></div><div class="card"><div class="kpi">€0.00</div><span class="small muted">Spent in this demo</span></div></div><div class="card" style="margin-top:16px"><h2>Planned payment safeguards</h2><ol class="inline-list"><li>Check account identity and job ownership.</li><li>Estimate the maximum cost and reserve prepaid credit.</li><li>Reject requests above the per-user limit.</li><li>Run queue with idempotent retry protection.</li><li>Record model tokens, compute time and partial failures.</li><li>Settle actual costs, refund unused reserves and provide receipts.</li></ol><p class="small muted">No API key or payment secret belongs in HTML.</p></div>'}
function account(){return pageTitle("Account, privacy & connections","UID ownership and explicit integrations, before inviting friends")+note("The selected preview account is not a verified Firebase sign-in; this interface never claims to enforce real user privacy.")+'<div class="grid two"><div class="card"><h2>'+safe(p().name)+'</h2><p class="small muted">Local preview UID: '+safe(app.uid)+'</p><p>All future requests must use a server-verified Firebase UID, not a manually switched name or client-provided identity.</p>'+btn("Sign out of preview","signout")+'</div><div class="card"><h2>Future integrations</h2><p class="small"><strong>Google:</strong> Firebase Auth and legacy Drive/Sheets migration</p><p class="small"><strong>Firestore:</strong> private profiles, rankings, application statuses</p><p class="small"><strong>Private documents:</strong> original CVs, supporting proofs and generated outputs</p><p class="small"><strong>ChatGPT:</strong> manual copy/import first; tightly scoped OAuth write connector later</p><p class="small"><strong>OpenAI API:</strong> central key kept server-side with user-level prepaid limits</p></div></div><div class="card" style="margin-top:16px"><h2>More tools</h2><div class="row">'+btn("My job rankings","goto","rank","soft")+btn("Usage & credits","goto","usage")+btn("Full Jobs frontend","goto","jobs")+btn("Social Hub","goto","social")+'</div><p class="micro" style="margin-top:10px">These controls also keep Rankings and Usage accessible from the compact mobile bottom navigation.</p></div><div class="card" style="margin-top:16px"><h2>Page inventory</h2><p class="small muted">Dashboard · Original Jobs Dashboard / Discovery / Make CV / Add Job · Profile · Social Research / Swipe / Follow-ups · Rankings · Credits · Account. Their original functions will be migrated gradually after identity and security foundations are built.</p></div>'}
function render(){document.getElementById("root").innerHTML=app.uid?shell(app.view==="home"?home():app.view==="profile"?profile():app.view==="jobs"||app.view==="social"?original(app.view):app.view==="rank"?rank():app.view==="usage"?usage():account()):login()}
function update(el){let path=el.dataset.path;if(!path)return;const seg=path.split(":"),d=p(),v=el.value;let obj=null;
if(seg[0]==="root"){d[seg[1]]=v;return}
if(seg[0]==="paste"){d.originalRaw=v;return}
if(seg[0]==="experience")obj=d.experience[+seg[1]];
if(seg[0]==="ach")obj=d.experience[+seg[1]]?.achievements[+seg[2]];
if(seg[0]==="edu")obj=d.education[+seg[1]];
if(seg[0]==="award")obj=d.achievements[+seg[1]];
if(seg[0]==="skill")obj=d.skills[+seg[1]];
if(obj)obj[seg.at(-1)]=v;
}
document.addEventListener("input",event=>{if(app.uid&&event.target.dataset.path){update(event.target);app.dirty=true;const n=document.getElementById("draft-status");if(n)n.textContent="Changes in this preview";}});
document.addEventListener("click",async event=>{
const hit=event.target.closest("[data-action],[data-nav],[data-tab]");if(!hit)return;
if(hit.dataset.nav){app.view=hit.dataset.nav;app.moreOpen=false;render();window.scrollTo(0,0);return}
if(hit.dataset.tab){app.section=hit.dataset.tab;render();return}
const act=hit.dataset.action,val=hit.dataset.value;
if(act==="toggle-more"){app.moreOpen=!app.moreOpen;render();if(app.moreOpen)document.getElementById("more-first")?.focus();return}
if(act==="close-more"){app.moreOpen=false;render();return}
if(act==="enter"){app.uid="sample-"+val;if(!app.profiles[app.uid])app.profiles[app.uid]=model(val);app.view="home";render();return}
if(act==="signout"){app.uid=null;app.moreOpen=false;app.dirty=false;render();return}
if(!app.uid)return;
const d=p();
if(act==="goto"){app.view=val;app.moreOpen=false;render();window.scrollTo(0,0);return}
if(act==="add-exp"){d.experience.unshift({company:"",title:"",start:"",end:"",location:"",summary:"",achievements:[]});app.openExperience=0;}
else if(act==="add-ach"){const role=d.experience[+val];role.achievements.push({challenge:"",action:"",result:"",metric:"",unit:"",evidence:"",bullet:""});app.openExperience=+val;app.openAchievementKey=val+":"+(role.achievements.length-1);}
else if(act==="add-edu")d.education.push({school:"",degree:"",dates:""});
else if(act==="add-award")d.achievements.push({name:"",detail:""});
else if(act==="add-skill")d.skills.push({name:"",level:""});
else if(act==="save"){d.saves++;app.dirty=false;app.notice="Draft saved in this browser tab only. No cloud data was changed."}
else if(act==="preview-bullet"){const [i,j]=val.split(":").map(Number),a=d.experience[i]?.achievements[j];if(a){const raw=(a.bullet?.trim()||[a.action,a.result].filter(Boolean).join(" ")).replace(/\s+/g," ").trim();app.bulletPreview={id:val,bullet:raw||"Add an action and an outcome first.",words:raw?raw.split(/\s+/).length:0};}}
else if(act==="copy-prompt"){const pre=document.querySelector(".paper");try{await navigator.clipboard.writeText(pre.textContent);alert("Copied. Paste into your ChatGPT to rank this job.")}catch(_){alert("Clipboard unavailable. Select and copy the prompt manually.")}return}
else if(act==="rank-import"){try{const raw=JSON.parse(document.getElementById("ranking-json").value);if(raw.jobId!==app.rankJobId||![raw.profileFit,raw.careerFit].every(n=>typeof n==="number"&&Number.isFinite(n)&&n>=0&&n<=100)||typeof raw.rationale!=="string"||raw.rationale.length>1200)throw Error("Expected selected job ID, numeric 0–100 fit scores and a short rationale.");d.ranking[raw.jobId]={jobId:raw.jobId,profileFit:raw.profileFit,careerFit:raw.careerFit,score:.55*raw.profileFit+.45*raw.careerFit,rationale:raw.rationale};alert("Saved to this preview account only.")}catch(e){alert(e.message)}}
else if(act==="job-nav"){const frame=document.getElementById("legacy-frame");if(frame)frame.contentWindow?.postMessage({kind:"garamaal-prototype",page:val},"*");return}
render();
if(app.notice){inform(app.notice);app.notice="";}
});
document.addEventListener("change",event=>{
 if(event.target?.id==="rank-job-select"){app.rankJobId=event.target.value;render()}
});
document.addEventListener("keydown",event=>{
 if(event.key==="Escape"&&app.moreOpen){app.moreOpen=false;render();document.querySelector('[data-action="toggle-more"]')?.focus();return}
 if(event.target?.matches?.('[data-tab]')&&["ArrowRight","ArrowLeft","Home","End"].includes(event.key)){
  event.preventDefault();let index=TABS.indexOf(event.target.dataset.tab);
  if(event.key==="Home")index=0;else if(event.key==="End")index=TABS.length-1;
  else index=(index+(event.key==="ArrowRight"?1:-1)+TABS.length)%TABS.length;
  app.section=TABS[index];render();document.getElementById("tab-"+index)?.focus();
 }
});
window.addEventListener("message",event=>{if(event.data?.kind==="garamaal-prototype"&&["jobs","social"].includes(event.data.go)&&event.source===document.getElementById("legacy-frame")?.contentWindow){app.view=event.data.go;render()}});
render();
</script>
</body>
