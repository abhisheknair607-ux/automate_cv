/* QA-only motion, 2D illustrated cut-outs and accessible account drawer */
.action{transition:transform .3s cubic-bezier(.2,1.5,.4,1),box-shadow .25s,filter .3s;transform-origin:25% 50%}
.action:hover{transform:translateY(-5px) rotate(-1deg);box-shadow:0 11px 0 #101010,0 15px 20px #0004;filter:saturate(1.07)}
.action:nth-child(2):hover,.action:nth-child(4):hover{transform:translateY(-4px) rotate(1deg)}
.action:active{transform:translateY(3px) scale(.965) rotate(-1.4deg)}
.action:before{content:'';position:absolute;inset:-35% auto -35% -130%;width:60%;background:linear-gradient(110deg,transparent,#ffffff80,transparent);transform:skewX(-15deg);transition:left .58s;pointer-events:none;z-index:4}
.action:hover:before{left:150%}
.action .circle{transition:transform .32s cubic-bezier(.2,1.4,.4,1)}.action:hover .circle{transform:rotate(-18deg) scale(1.08)}
.action-copy{max-width:49%;z-index:3}
.art2d{position:absolute;right:-7px;bottom:-7px;width:46%;height:115%;background-position:center right;background-size:cover;background-repeat:no-repeat;z-index:1;pointer-events:none;transition:transform .38s cubic-bezier(.2,1.6,.4,1);mask-image:linear-gradient(to right,transparent 0%,black 20%);-webkit-mask-image:linear-gradient(to right,transparent 0%,black 20%)}
.action:hover .art2d{transform:rotate(5deg) scale(1.1) translateY(-5px)}.action:active .art2d{transform:rotate(-6deg) scale(.97)}
.bottom button{transition:background .22s,color .22s,transform .23s cubic-bezier(.2,1.7,.4,1)}.bottom button:hover{transform:translateY(-3px)}.bottom button:active{transform:translateY(2px) scale(.93)}.bottom button b{display:block;transition:transform .28s cubic-bezier(.2,1.6,.4,1)}.bottom button:hover b{transform:rotate(-17deg) scale(1.14)}.bottom button.sel b{animation:qaTwist .4s cubic-bezier(.25,1.4,.35,1)}

const btn=(text,event,value='',cls='')=>'<button class="btn '+cls+'" data-action="'+event+'" data-value="'+esc(value)+'">'+text+'</button>';
const head=(name,back=true,extras='')=>'<header class="header '+(name==='GARAMAAL'?'':'innerhead')+'"><div class="row" style="gap:4px"><button class="back" data-go="home" aria-label="Back home">'+(back?'‹':'✦')+'</button><strong class="header-name">'+esc(name)+'</strong></div><div class="top-right">'+extras+'<button class="avatar" data-action="drawer-open" aria-label="Open account drawer" aria-haspopup="dialog">'+esc(state.person[0])+'</button></div></header>';
function home(){const x=person(),interest=Object.values(x.jobChoices).filter(t=>t==='interested').length,due=x.reminders.filter(t=>!t.done).length;return head('GARAMAAL',false)+'<main class="home-area"><h1 class="question">What do<br>you want<br>to do <em>today?</em></h1><div class="quick"><button data-go="stats">◎ Targets '+interest+'/'+x.weeklyJobGoal+'</button><button data-go="stats">◷ Reminders '+due+'</button><button data-go="stats">▥ My stats</button></div><section class="action-stack" aria-label="Main actions">'+action('Update profile','profile','◉','lime','Build your career story','✎')+action('Apply jobs','jobs','↗','white','Discover · Swipe · Make CV','✦','disc')+action('Network','social','⇄','purple','Targets · Research · Connect','◎')+action('Statistics','stats','▥','white','Goals · Progress · Reminders','GOAL<br>GETTER!','note')+'</section><div class="journey"><span>START YOUR<br>JOURNEY</span><button data-go="jobs" aria-label="Start your journey">⟶</button></div><p class="tinyfoot">MOTION QA · SAMPLE DATA · NO LIVE COSTS</p></main>'}
function tabs(kind){const items=kind==='jobs'?[['dashboard','Dashboard','▦'],['discovery','Discovery','⌕'],['swipe','Swipe','⇄'],['cv','Make CV','▤'],['more','More','⋯']]:[['dashboard','Targets','◎'],['research','Research','▣'],['swipe','Swipe','⇄'],['followups','Follow-ups','↗'],['stats','Stats','▥']];const selected=kind==='jobs'?state.jobTab:state.socialTab;return '<nav class="bottom" aria-label="'+kind+' tabs">'+items.map(([id,t,icon])=>'<button class="'+(id===selected?'sel ':'')+(id==='swipe'?'spotlight':'')+'" data-tab="'+kind+':'+id+'"><b aria-hidden="true">'+icon+'</b>'+(id==='swipe'?'<span class="qa-swipe-arrows" aria-hidden="true"><i class="left"></i><i class="right"></i></span>':'')+t+'</button>').join('')+'</nav>'}
function feature(kind){let extra=kind==='jobs'&&(state.jobTab==='cv'||state.jobTab==='discovery')?'<button class="mini-icon" data-action="tab" data-value="jobs:more" aria-label="Add job">＋</button><button class="mini-icon" data-action="show-filters" aria-label="Filters">☷</button>':'';return head(kind==='jobs'?'Jobs':'Social',true,extra)+'<main class="main">'+(kind==='jobs'?jobs():social())+'</main>'+tabs(kind)}
function jobRows(list){if(!list.length)return '<div class="empty">No matching jobs in this sample.</div>';return list.map(job=>'<div class="item"><div class="row"><strong>'+esc(job.role)+'</strong><span class="chipstatus">'+(job.complete?'JD ready':'JD missing')+'</span></div><p>'+esc(job.company)+' · '+esc(job.place)+'</p><div class="row"><span class="pill">'+esc(job.type)+'</span>'+btn('Read JD','job-detail',job.id)+'</div></div>').join('')}
function jobs(){const x=person(),approved=DEMO_JOBS.filter(j=>j.complete);switch(state.jobTab){
case'dashboard':return '<div class="grid3"><div class="card"><b class="number">4</b><span class="cap">Jobs found</span></div><div class="card"><b class="number">3</b><span class="cap">JD ready</span></div><div class="card"><b class="number">'+Object.values(x.jobChoices).filter(v=>v==='interested').length+'</b><span class="cap">Interested</span></div></div><div class="card"><div class="row"><h2>Your jobs</h2><span class="pill">Sample</span></div><p>The full existing Jobs dashboard and CV workflow are preserved in the source branch. This is a compact offline view.</p><div class="btnrow">'+btn('Discovery','tab','jobs:discovery','primary')+btn('Start swipe','tab','jobs:swipe','lime')+'</div></div><div class="card"><h2>Ready to review</h2>'+jobRows(DEMO_JOBS.slice(0,3))+'</div>';
case'discovery':{const matches=DEMO_JOBS.filter(j=>(state.jobFilter==='All'||j.type===state.jobFilter)&&[j.role,j.company,j.place].join(' ').toLowerCase().includes(state.search.toLowerCase()));return '<div class="row"><h1 class="title">Discovery</h1><span class="pill">'+matches.length+' jobs</span></div><input class="input" id="job-search" placeholder="Search title, company, location" value="'+esc(state.search)+'" aria-label="Search jobs"><div class="scrollchips">'+['All','Corporate Finance','Wealth Management','Transfer Pricing'].map(f=>'<button class="'+(f===state.jobFilter?'active':'')+'" data-filter="'+esc(f)+'">'+f+'</button>').join('')+'</div><div class="card"><div class="row"><h2>Jobs discovered</h2>'+btn('+ Add Job','tab','jobs:more')+'</div>'+jobRows(matches)+'</div>';}
case'swipe':return jobSwipe();
case'cv':{const interested=approved.filter(j=>x.jobChoices[j.id]==='interested');return '<div class="row"><h1 class="title">Make CV</h1>'+btn('+ Add Job','tab','jobs:more')+'</div><div class="card"><h2>Selected jobs</h2><p>Jobs you swipe right appear here in this offline sample. No paid CV generation is connected.</p>'+(interested.length?interested.map(j=>'<div class="item"><strong>'+esc(j.role)+'</strong><p>'+esc(j.company)+'</p><span class="pill">Interested</span><div style="margin-top:9px">'+btn('Make CV — preview','disabled-action')+'</div></div>').join(''):'<p>Swipe right on an opportunity to shortlist it here.</p>')+'</div><div class="card"><h2>Existing feature preserved</h2><p>Live model tiers, status management, CV download and generation remain in the complete GitHub Jobs HTML — not this offline preview.</p></div>';}
case'more':return '<h1 class="title">More Jobs tools</h1><div class="card"><h2>Add Job</h2><p>The original Add Job form is retained in the full version.</p>'+btn('Open Discovery','tab','jobs:discovery','primary')+'</div><div class="card"><h2>Statistics & targets</h2>'+btn('View statistics','go','stats')+'</div><div class="card"><h2>Personal rankings</h2><p>Separate per-user job scores and ChatGPT prompt flow remain in the full source.</p></div>';
}}
function eligible(){return DEMO_JOBS.filter(j=>j.complete&&j.jd.length>100)}
function queue(){return eligible().filter(j=>!person().jobChoices[j.id])}
function jobSwipe(){let items=queue(),job=items[0],total=eligible().length;let done=total-items.length;if(!job)return '<div class="card empty"><div style="font-size:58px">✓</div><h2>All caught up!</h2><p>You reviewed all '+total+' demo vacancies.</p>'+btn('Reset sample swipes','reset-jobs','','primary')+'</div>';return '<div class="row" style="margin-bottom:10px"><span class="pill">Discovery cleared · JD ready</span><span class="cap">'+(done+1)+' / '+total+'</span></div><div class="job-card" id="swipe-card" data-id="'+job.id+'" tabindex="0" aria-label="'+esc(job.role)+'; swipe left or right"><div class="job-head"><span class="mini-label">'+esc(job.type).toUpperCase()+'</span><h2>'+esc(job.role)+'</h2><small>'+esc(job.company)+'</small><div class="bigstar" aria-hidden="true">✦</div></div><div class="job-body"><div class="row"><span class="pill">'+esc(job.place)+'</span><span class="pill">Full JD</span></div><h3>At a glance</h3><ul>'+job.bullets.map(b=>'<li>'+esc(b)+'</li>').join('')+'</ul><details><summary>Read full job description</summary><div class="read-jd">'+esc(job.jd)+'</div></details></div></div><div class="swipe-buttons"><button data-rate="not-interested">← Not interested</button><button class="yes" data-rate="interested">Interested →</button></div><div class="center muted" style="margin-top:9px">Swipe left / right or tap a button</div><div class="center cap" style="margin-top:4px">Fictional JD data · No Sheets updates</div>'}
function social(){switch(state.socialTab){case'dashboard':return '<h1 class="title">Targets</h1><div class="grid3"><div class="card"><b class="number">3</b><span class="cap">Contacts</span></div><div class="card"><b class="number">1</b><span class="cap">Accepted</span></div><div class="card"><b class="number">1</b><span class="cap">Follow-up</span></div></div><div class="card"><h2>Target departments</h2><div class="scrollchips"><button class="active">Corporate Finance</button><button>Valuations</button><button>Transfer Pricing</button><button>Wealth Mgmt</button></div><div class="row">'+btn('Research','tab','social:research','primary')+btn('Swipe contacts','tab','social:swipe')+'</div></div><div class="card"><h2>Fictional contacts</h2>'+contactRows()+'</div>';
case'research':return '<h1 class="title">Research</h1><div class="card"><h2>Target search</h2><label class="field"><span>Company</span><input value="Example Partners" readonly></label><label class="field"><span>Department</span><input value="Corporate Finance" readonly></label><label class="field"><span>Designation</span><input value="Partner" readonly></label>'+btn('Copy research prompt (sample)','preview-notice')+'</div><div class="card"><h2>Screenshots & sources</h2><p>The full source preserves the screenshot/text import and verification stages. This standalone preview does not upload files.</p></div>';
case'swipe':{let candidates=SAMPLE_CONTACTS.filter(c=>!person().socialChoices[c.name]);let c=candidates[0];return c?'<div class="card"><span class="pill">People swipe · '+candidates.length+' remaining</span><h1 class="title" style="margin-top:16px">'+esc(c.name)+'</h1><h2>'+esc(c.role)+'</h2><p>'+esc(c.company)+'</p><div class="note">Connection invitations are manual, never automatically sent.</div><div class="swipe-buttons"><button data-contact="later">← Later</button><button class="yes" data-contact="interested">Interested →</button></div></div>':'<div class="card empty">You reviewed all sample contacts.<div style="margin-top:12px">'+btn('Reset people cards','reset-contacts')+'</div></div>';}
case'followups':return '<h1 class="title">Follow-ups</h1><div class="card"><h2>Accepted connections</h2><div class="item"><strong>Casey Sample</strong><p>Valuations Manager · Demo Advisory</p><span class="pill">Follow-up due</span></div><div class="note">Drafts are manual and do not send a LinkedIn message.</div></div>';
case'stats':return stats(true);
}}
function contactRows(){return SAMPLE_CONTACTS.map(c=>'<div class="item"><div class="row"><strong>'+esc(c.name)+'</strong><span class="chipstatus">'+c.status+'</span></div><p>'+esc(c.role)+' · '+esc(c.company)+'</p></div>').join('')}
function profile(){const x=person(),v=x.profile;const tabs=['Work Experience','Education','Achievements','Interests','Skills'];let panel='';switch(state.profileTab){case'Work Experience':panel='<details open class="accordion"><summary>'+esc(v.company)+' · '+esc(v.role)+'</summary><div class="inside"><label class="field"><span>Company</span><input data-profile="company" value="'+esc(v.company)+'"></label><label class="field"><span>Designation</span><input data-profile="role" value="'+esc(v.role)+'"></label><details class="accordion" open><summary>STAR result 1</summary><div class="inside"><label class="field"><span>Action</span><textarea>Coordinated a clearer review process.</textarea></label><label class="field"><span>Outcome</span><textarea>Improved reporting consistency.</textarea></label><details class="accordion"><summary>Optional metrics & evidence</summary><div class="inside"><label class="field"><span>Verified metric</span><input placeholder="Leave blank if unverified"></label></div></details></div></details></div></details>'+btn('+ Add role (preview)','preview-notice');break;
case'Education':panel='<label class="field"><span>Institution</span><input data-profile="school" value="'+esc(v.school)+'"></label><label class="field"><span>Qualification</span><input data-profile="degree" value="'+esc(v.degree)+'"></label>';break;
case'Achievements':panel='<label class="field"><span>Qualification / achievement</span><input placeholder="Add professional credential"></label><label class="field"><span>Evidence</span><textarea placeholder="Supporting details"></textarea></label>';break;
case'Interests':panel='<label class="field"><span>Career goals</span><textarea data-profile="goals">'+esc(v.goals)+'</textarea></label>';break;
case'Skills':panel='<label class="field"><span>Key skill</span><input data-profile="skill" value="'+esc(v.skill)+'"></label>';break;}
return '<h1 class="title">My profile</h1><div class="card"><div class="row"><strong>Profile readiness</strong><span class="pill">Sample · 83%</span></div><div class="progress"><div style="width:83%"></div></div></div><div class="profile-tabs">'+tabs.map(t=>'<button data-profiletab="'+t+'" class="'+(t===state.profileTab?'sel':'')+'">'+t+'</button>').join('')+'</div><div class="card"><h2>'+state.profileTab+'</h2>'+panel+'<div style="margin-top:12px">'+btn('Save this preview','save-preview','','primary')+'</div></div>'}
function stats(network=false){const x=person(),choices=Object.values(x.jobChoices),liked=choices.filter(v=>v==='interested').length,marked=x.reminders.filter(v=>v.done).length;let goal=network?x.weeklyNetworkGoal:x.weeklyJobGoal, current=network?1:liked;return '<h1 class="title">'+(network?'Social statistics':'Statistics')+'</h1><div class="grid3"><div class="card"><b class="number">'+(network?'3':liked)+'</b><span class="cap">'+(network?'Contacts':'Interested')+'</span></div><div class="card"><b class="number">'+(network?'1':choices.length)+'</b><span class="cap">'+(network?'Accepted':'Reviewed')+'</span></div><div class="card"><b class="number">'+marked+'/'+x.reminders.length+'</b><span class="cap">Reminders done</span></div></div><div class="card"><h2>Weekly target</h2><div class="row"><b>'+current+' / '+goal+'</b><span class="pill">'+(network?'Accepted connections':'Interested jobs')+'</span></div><div class="progress"><div style="width:'+Math.min(100,current/goal*100)+'%"></div></div><div class="btnrow">'+btn('− Lower','target',network?'network:-1':'jobs:-1')+btn('+ Raise','target',network?'network:1':'jobs:1')+'</div></div><div class="card"><div class="row"><h2>Reminders</h2><span class="pill">'+x.reminders.filter(r=>!r.done).length+' pending</span></div>'+x.reminders.map(r=>'<label class="statreminder"><span>'+esc(r.text)+'</span><input type="checkbox" data-reminder="'+r.id+'" '+(r.done?'checked':'')+'></label>').join('')+'<div class="row" style="margin-top:12px"><input class="input" id="reminder-input" placeholder="New reminder" style="flex:1;min-width:0;width:auto;margin:0">'+btn('Add','add-reminder','','primary')+'</div><p>Local checklist only — no push notifications or calendar scheduling.</p></div>'}
function account(){return '<h1 class="title">Sample account</h1><div class="card"><h2>Preview persona</h2><p>Choose a fictional sample workspace. The two profiles have independent local choices and reminders.</p><div class="btnrow">'+btn('Abhishek','person','Abhishek',state.person==='Abhishek'?'primary':'')+btn('Pooja','person','Pooja',state.person==='Pooja'?'primary':'')+'</div></div><div class="card"><h2>About this download</h2><p>Offline design preview. This is not authenticated, linked to your real Google Sheets or connected to an API.</p><p>The full original Jobs and Social HTML files remain in the separate GitHub prototype branch.</p></div>'}
function layout(){let isHome=state.view==='home',feature=state.view==='jobs'||state.view==='social';app.className=isHome?'home':'inner';let top=isHome?'':head(state.view==='jobs'?'Jobs':state.view==='social'?'Social':state.view==='profile'?'My profile':state.view==='account'?'Account':'Statistics',true,feature&&state.view==='jobs'&&['discovery','cv'].includes(state.jobTab)?'<button class="mini-icon" data-action="tab" data-value="jobs:more" aria-label="Add job">＋</button><button class="mini-icon" data-action="show-filters" aria-label="Show filters">☷</button>':'');if(isHome){app.innerHTML=home();return;}let main=state.view==='jobs'?featurePage('jobs'):state.view==='social'?featurePage('social'):state.view==='profile'?profile():state.view==='stats'?stats(false):account();app.innerHTML=top+'<main class="main '+(feature?'':'no-nav')+'">'+main+'</main>'+(feature?tabs(state.view):'')+(state.toast?'<div class="banner" role="status">'+esc(state.toast)+'</div>':'')}
function featurePage(kind){return kind==='jobs'?jobs():social()}
function toast(txt){state.toast=txt;layout();setTimeout(()=>{state.toast='';layout()},1800)}
function handleRate(value){let job=queue()[0];if(!job)return;person().jobChoices[job.id]=value;layout()}

const qaDrawer=document.getElementById('qa-drawer');let qaOpener=null;
function closeDrawer(){qaDrawer.hidden=true;if(qaOpener?.focus)qaOpener.focus()}
function openDrawer(el){qaOpener=el||document.activeElement;const x=person();qaDrawer.hidden=false;
qaDrawer.innerHTML='<button type="button" class="qa-shade" data-drawer="close" aria-label="Close menu"></button><aside class="qa-panel" role="dialog" aria-modal="true" aria-labelledby="qa-title"><div class="qa-top"><span class="qa-script">Garamaal<i>.</i></span><button class="qa-x" data-drawer="close" aria-label="Close menu">×</button></div>'+ 
'<div class="qa-person"><div class="qa-monogram">'+esc(state.person[0])+'</div><h2 id="qa-title">'+esc(state.person)+' · Workspace</h2><p>Your personal career control centre</p></div>'+ 
'<div class="qa-cost"><small>Total recorded CV cost</small><strong>—</strong><p>Unavailable offline. The actual prototype reads recorded expenses from the existing Jobs backend when permitted.</p></div>'+ 
'<nav class="qa-links" aria-label="Profile sections"><button data-drawer="profile"><b>◉</b> My profile <i>›</i></button><button data-drawer="stats"><b>▥</b> Statistics <i>›</i></button><button data-drawer="reminders"><b>◷</b> Reminders & targets <i>›</i></button><button data-drawer="account"><b>◈</b> Usage & account <i>›</i></button><button data-drawer="home"><b>⌂</b> Back home <i>›</i></button></nav>'+ 
'<footer class="qa-signoff"><span>Made with care,<br>for you. <b>♡</b></span><small>GARAMAAL · OFFLINE MOTION QA</small></footer></aside>';
qaDrawer.querySelector('.qa-x')?.focus()}
qaDrawer.addEventListener('click',e=>{const control=e.target.closest('[data-drawer]');if(!control)return;const act=control.dataset.drawer;if(act==='close'){closeDrawer();return}closeDrawer();state.view=act==='reminders'?'stats':act;layout()});
document.addEventListener('keydown',e=>{if(qaDrawer.hidden)return;if(e.key==='Escape'){e.preventDefault();closeDrawer()} });

app.addEventListener('click',event=>{let el=event.target.closest('[data-go],[data-tab],[data-rate],[data-action],[data-filter],[data-profiletab],[data-contact]');if(!el)return;let d=el.dataset;if(d.go){state.view=d.go;if(d.go==='jobs')state.jobTab='dashboard';if(d.go==='social')state.socialTab='dashboard';layout();window.scrollTo(0,0);return}if(d.tab){const [kind,tab]=d.tab.split(':');if(kind==='jobs')state.jobTab=tab;else state.socialTab=tab;state.view=kind;layout();return}if(d.rate){handleRate(d.rate);return}if(d.filter){state.jobFilter=d.filter;layout();return}if(d.profiletab){state.profileTab=d.profiletab;layout();return}if(d.contact){let c=SAMPLE_CONTACTS.find(t=>!person().socialChoices[t.name]);if(c)person().socialChoices[c.name]=d.contact;layout();return}if(d.action){switch(d.action){case'tab':{const[k,v]=d.value.split(':');state.view=k;if(k==='jobs')state.jobTab=v;else state.socialTab=v;layout();break;}case'go':state.view=d.value;layout();break;case'job-detail':{const j=DEMO_JOBS.find(v=>v.id===d.value);if(j)toast(j.complete?'Open the Jobs Swipe tab to review the complete JD.':'Full JD has not been supplied yet.');break;}case'disabled-action':toast('Offline preview only — no paid CV generated.');break;case'reset-jobs':person().jobChoices={};layout();break;case'reset-contacts':person().socialChoices={};layout();break;case'preview-notice':toast('Available in the complete prototype branch.');break;case'drawer-open':openDrawer(el);break;case'show-filters':if(state.view==='jobs'){state.jobTab='discovery';layout();document.getElementById('job-search')?.focus()}break;case'person':state.person=d.value;state.view='home';layout();break;case'target':{const [kind,change]=d.value.split(':');let key=kind==='network'?'weeklyNetworkGoal':'weeklyJobGoal';person()[key]=Math.max(1,Math.min(100,person()[key]+Number(change)));layout();break;}case'add-reminder':{const input=document.getElementById('reminder-input'),text=String(input?.value||'').trim();if(text){const arr=person().reminders;arr.push({id:Math.max(0,...arr.map(x=>x.id))+1,text:text.slice(0,120),done:false});layout()}break;}case'save-preview':toast('Preview only. No data was sent to any server.');break;}}});
app.addEventListener('change',event=>{const el=event.target;if(el.dataset.reminder){let r=person().reminders.find(x=>x.id===Number(el.dataset.reminder));if(r){r.done=el.checked;layout()}}else if(el.dataset.profile){person().profile[el.dataset.profile]=el.value}});
app.addEventListener('input',event=>{const el=event.target;if(el.id==='job-search'){state.search=el.value;const start=el.selectionStart;layout();const next=document.getElementById('job-search');if(next){next.focus();next.setSelectionRange(start,start)}}else if(el.dataset.profile)person().profile[el.dataset.profile]=el.value});
let swipeStart=null;app.addEventListener('pointerdown',event=>{let card=event.target.closest('#swipe-card');if(card&&!event.target.closest('details,summary,button,a,input,textarea'))swipeStart={id:event.pointerId,x:event.clientX,y:event.clientY}});app.addEventListener('pointerup',event=>{if(!swipeStart||event.pointerId!==swipeStart.id)return;const dx=event.clientX-swipeStart.x,dy=event.clientY-swipeStart.y;swipeStart=null;if(Math.abs(dx)>75&&Math.abs(dx)>Math.abs(dy)*1.5)handleRate(dx>0?'interested':'not-interested')});app.addEventListener('keydown',event=>{if(event.target.id==='swipe-card'&&['ArrowLeft','ArrowRight'].includes(event.key)){event.preventDefault();handleRate(event.key==='ArrowRight'?'interested':'not-interested')} });
layout();
})();
</script>
</body></html>
