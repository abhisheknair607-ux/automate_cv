/* Model-tier prototype extension: non-invasive, local preview only */

.tier-banner strong{display:block;font-size:12px;color:#1d497e}.tier-banner p{font-size:11px;color:#647b98;margin:4px 0 0;max-width:720px}
.tier-pill{font-size:10px;background:#fff;border:1px solid #d6e4f7;color:#456c9c;padding:5px 9px;border-radius:30px;font-weight:700}
.tier-inline{display:flex;align-items:center;gap:7px;padding:0 5px}
.tier-inline label{font-size:11px;color:#64748b;font-weight:750;white-space:nowrap}
.tier-select{background:#f3f7ff;color:#204770;font-weight:750;border:1px solid #cdddf6;border-radius:8px;padding:6px 8px;min-height:31px;font-size:11px;max-width:135px}
.tier-detail{background:#f8faff;border:1px solid #dce8fa;padding:16px;border-radius:12px;margin:14px 0 17px}
.tier-detail header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tier-detail header strong{font-size:13px}.tier-detail select{border-radius:9px;min-height:37px;border:1px solid #bacdeb;background:#fff;padding:7px 11px;font-weight:750}
.tier-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:13px 0 9px}
.tier-cell{background:#fff;border:1px solid #e0eafa;padding:10px;border-radius:9px;min-width:0}
.tier-cell span{display:block;font-size:10px;color:#7486a0}.tier-cell strong{font-size:11px;overflow-wrap:anywhere;color:#193a63}
.tier-note{font-size:10px;color:#536e8b;line-height:1.55}

/* Live, reduced-motion-safe CV queue indication. Pure CSS; no extra images. */
.cv-activity-slot:empty{display:none}
.cv-activity{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:10px 0 1px;padding:9px 11px;border:1px solid #cbdcf9;border-radius:9px;background:#f1f6ff;font-size:11px;color:#23558b;font-weight:730}
.cv-activity.waiting{background:#fffbf1;color:#805b0b;border-color:#f6deb0}
.cv-activity .cv-spin{width:13px;height:13px;flex:none;border:2px solid #c5d7f0;border-top-color:#2563eb;border-radius:50%;animation:rotate .9s linear infinite}
.cv-activity.waiting .cv-spin{border-top-color:#b7791f}
.cv-activity small{font-size:10px;opacity:.8;font-weight:550}
.cv-queue-overview{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 12px;padding:9px 13px;background:#fff;border:1px solid #dbe6f5;border-radius:10px;font-size:11px;color:#46617f}
.cv-queue-overview strong{font-weight:800;color:#1a4784}
.cv-queue-overview .cv-dot{height:7px;width:7px;border-radius:50%;background:#367cf1;box-shadow:0 0 0 3px #e5efff}

#cv-install-app{border:1px solid #dbe6f5;border-radius:8px;background:#edf4ff;color:#1d4e7d;padding:7px 10px;font-size:11px;font-weight:700;white-space:nowrap}
#cv-install-app:hover{background:#dcecff}

/* Two immediately editable per-candidate settings on every Freshmaal job card. */
.job-settings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px;border-top:1px solid #edf1f7;padding-top:10px}
.job-setting{min-width:0;display:flex;flex-direction:column;gap:5px}
.job-setting label{font-size:10px;font-weight:750;color:#536781}
.job-setting select{width:100%;max-width:none;min-width:0;text-overflow:ellipsis;background:#f3f7ff;border:1px solid #cbdaf0;border-radius:8px;padding:7px 6px;font-size:11px;min-height:34px}
.job-setting select.status-select{background:#fff;border-color:#cbd5e1;color:#263850}

.category-strip .chip{flex:none;white-space:nowrap}

<body>
<div class="shell">
 <aside class="sidebar"><div class="brand"><div class="brandmark">F</div><div><strong>Freshmaal</strong><small>JOB CONTROL CENTRE</small></div></div><nav id="deskNav"></nav><div class="side-bottom">Connected architecture<span>Taaza → Freshmaal → CV automation</span><span style="margin-top:8px">Separate overlay · No ranking API</span></div></aside>
 <div class="main"><header class="topbar"><div class="crumb">Workspace / <strong id="crumbTitle">Overview</strong></div><div class="top-actions"><span id="modeBadge" class="demo">PREVIEW</span><div id="candidateToggle" class="switch"></div><div id="avatar" class="avatar">A</div></div></header><main id="content" class="container" aria-live="polite"></main></div>
</div>
<div class="mobilebar" id="mobileNav"></div>
<div id="drawerMount"></div><div id="toastMount" role="status" aria-live="polite"></div>
<script>
'use strict';
const DEMO = !(window.google && google.script && google.script.run);
// PLANNED tier mappings: the live runner will store this mapping in GitHub,
// not in Sheets or browser JS. Demo selections are local browser state only.
const MODEL_PRESETS={
 Economy:['gpt-6-luna','gpt-6-luna','gpt-6-luna'],
 Balanced:['gpt-6-luna','gpt-6-luna','gpt-6.1-sol'],
 Premium:['gpt-5.6-terra','gpt-5.6-terra','gpt-5.6-sol']
};
const tierPreviewMemory={};
const demoNotInterested={};
function getPreviewTier(row,candidate=state.candidate){
  const live=state.detail?.row===row?state.detail:state.data?.rows?.find(x=>x.row===row);
  if(!DEMO && live && MODEL_PRESETS[live.tier]) return live.tier;
  const key=candidate+':'+row; if(MODEL_PRESETS[tierPreviewMemory[key]])return tierPreviewMemory[key];
 try{const p=localStorage.getItem('freshmaal-tier-preview:'+key);return MODEL_PRESETS[p]?p:'Premium'}catch(e){return 'Premium'}
}
function getPreviewClTier(row){const job=state.detail?.row===row?state.detail:state.data?.rows?.find(x=>x.row===row);return job?.clTierExplicit&&MODEL_PRESETS[job.clTier]?job.clTier:getPreviewTier(row)}
function tierChoices(row,kind='tier'){const current=kind==='clTier'?getPreviewClTier(row):getPreviewTier(row);return Object.keys(MODEL_PRESETS).map(name=>`<option value="${name}" ${current===name?'selected':''}>${name}</option>`).join('')}
function tierInfo(tier){const names=MODEL_PRESETS[tier]||MODEL_PRESETS.Premium;return `<div class="tier-grid">${names.map((v,i)=>`<div class="tier-cell"><span>Stage ${i+1}</span><strong>${v}</strong></div>`).join('')}</div><div class="tier-note">When the current merged analysis is enabled, Stages 1 and 2 make one model call using the Stage 2 setting. Stage 3 remains the Word-document generation stage.</div>`}

function jobStatusOptions(job) {
  const options=Array.isArray(job.statusOptions)?job.statusOptions.slice():[];
  if(job.status&&!options.includes(job.status))options.unshift(job.status);
  if(!options.length)options.push('Not started','Ready','Applied');
  return [...new Set(options.map(String))];
}
function statusChoices(job) {
  const selected=String(job.status||'');
  const opts=jobStatusOptions(job);
  return `<option value="" ${!selected?'selected':''}>Choose status</option>`+
    opts.map(name=>`<option value="${h(name)}" ${selected===name?'selected':''}>${h(name)}</option>`).join('');
}

function tierBanner(){return `<section class="tier-banner"><strong>CV model · ${h(state.candidate)}</strong><span class="tier-pill">Economy · Balanced · Premium</span></section>`}
async function changePreviewTier(row,tier,kind='tier'){
 if(!MODEL_PRESETS[tier])return;
 const item=state.detail?.row===row?state.detail:state.data?.rows?.find(j=>j.row===row);
 if(!DEMO){
   if(!item){toast('Refresh jobs first.',true);return}
   try{
     const result=await run('updateFreshControl',{row,candidate:state.candidate,field:kind,value:tier,expected:expected(item)});
     item[kind]=tier;
     if(kind==='clTier')item.clTierExplicit=true;
     if(state.detail?.row===row){state.detail[kind]=tier;if(kind==='clTier')state.detail.clTierExplicit=true;}
     if(state.data)state.data.rows.forEach(j=>{if(j.row===row){j[kind]=tier;if(kind==='clTier')j.clTierExplicit=true;}});
     toast(result.message);
     if(state.detail)drawDetail();else render();
   }catch(e){if(state.detail)drawDetail();else render()}
   return;
 }
 item[kind]=tier;
 toast(tier+' '+(kind==='clTier'?'cover letter':'CV')+' tier selected (demo).');
 render();if(state.detail)drawDetail();
}

const ICONS={grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',discover:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',files:'<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v6h5"/><path d="M10 13h6M10 17h6"/>',plus:'<path d="M12 5v14M5 12h14"/>',arrow:'<path d="m5 12 14 0m-6-6 6 6-6 6"/>',up:'<path d="m7 14 5-5 5 5"/>',down:'<path d="m7 10 5 5 5-5"/>',left:'<path d="m15 18-6-6 6-6"/>',right:'<path d="m9 18 6-6-6-6"/>',refresh:'<path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.4 9A7 7 0 0 1 18 7l2 5M4 12l2 5a7 7 0 0 0 12.6-2"/>',external:'<path d="M12 4h8v8M20 4l-9 9"/><path d="M20 14v6H4V4h6"/>',check:'<path d="m4 12 5 5L20 6"/>',close:'<path d="M5 5l14 14M19 5 5 19"/>',brief:'<rect x="3" y="6" width="18" height="15" rx="2"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',file:'<path d="M6 3h8l5 5v13H6zM14 3v5h5M9 13h7M9 17h7"/>',sort:'<path d="m7 4-3 3 3 3M4 7h13M17 20l3-3-3-3M20 17H7"/>',trash:'<path d="M4 7h16M9 7V4h6v3m-9 0 1 14h10l1-14M10 10v8M14 10v8"/>',shield:'<path d="M12 2 3 6v6c0 6 4 9 9 11 5-2 9-5 9-11V6z"/><path d="m8 12 3 3 5-6"/>'};
function icon(name){return `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]||ICONS.file}</svg>`}
function h(x){return String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function safeUrl(s){try{const v=new URL(String(s));return /^https?:$/.test(v.protocol)?v.href:null}catch(e){return null}}
const navigation=[{id:'dashboard',label:'Dashboard',icon:'grid'},{id:'discovery',label:'Discovery',icon:'discover'},{id:'fresh',label:'Make CV',icon:'files'},{id:'add',label:'Add Job',icon:'plus'}];
function storedCandidate(){try{return localStorage.getItem('freshmaal-candidate')}catch(e){return null}}
function storeCandidate(name){try{localStorage.setItem('freshmaal-candidate',name)}catch(e){}}
const state={cvQueue:null,pendingCv:{},candidate:storedCandidate()==='Pooja'?'Pooja':'Abhishek',section:'dashboard',filter:'all',tabId:'all',query:'',sort:'newest',page:1,pageSize:innerWidth<721?10:25,data:null,detail:null,stats:null,busy:false,loadingMore:false,listRequest:0,bulk:new Map(),demo:DEMO,lastY:0,bootstrap:null,initError:null};
const demoJobs=Array.from({length:168},(_,i)=>({row:i+2,company:['Sample Advisory','Demo Finance Group','Example Partners','Illustration Bank','Placeholder Consulting'][i%5],role:['Corporate Finance Analyst','Transfer Pricing Senior Associate','Private Wealth Associate','Valuations Analyst','Financial Planning Associate','Finance Business Partner','Investment Analyst'][i%7],url:'https://example.com/jobs/demo-'+(i+1),location:i%4===0?'London':'Dublin',jd:i%3?'Full demonstration job description. The person will support investment analysis, commercial and financial modelling, relationships and related client projects. Duties include preparing written reports and financial schedules.':'Open original job description',jdReady:i%3!==0,transferred:i%4===0,score:65+(i*7)%32,rank:i+1,selected:i%5===0,cv:i%11===0,cl:i%13===0,web:false,status:i%9===0?'Applied':'NA',workflow:i%11===0?'Complete':'',cvLink:'',clLink:'',folder:'',error:'',transferStatus:i%4===0?'Sent to Freshmaal':'',deadline:'',source:'Demo'}));
function expected(job){return {company:job.company,role:job.role,url:job.url}}
function toast(text,error=false){const m=document.getElementById('toastMount');m.innerHTML=`<div class="toast ${error?'error':''}">${h(text)}</div>`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>m.innerHTML='',4400)}
function call(name,arg){if(DEMO)return Promise.resolve(demoServer(name,arg));return new Promise((resolve,reject)=>{try{google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e&&e.message||String(e))))[name](arg)}catch(e){reject(e)}})}
function demoServer(name,arg){if(name==='getBootstrap')return {email:'demo@example.com',people:['Abhishek','Pooja'],links:{taaza:'#',fresh:'#'}};
  if(name==='getStats')return{discovered:demoJobs.length,applications:demoJobs.filter(x=>x.transferred).length,selected:demoJobs.filter(x=>x.transferred&&x.selected).length,cvRequested:demoJobs.filter(x=>x.transferred&&x.cv).length,applied:demoJobs.filter(x=>x.transferred&&x.status==='Applied').length,missingJD:demoJobs.filter(x=>!x.jdReady).length};
  if(name==='listJobs'){
    let rows=demoJobs.map((j,i)=>({...j,source:arg.source}));if(arg.source==='fresh')rows=rows.filter(j=>j.transferred).map(j=>({...j,score:state.candidate==='Pooja'?Math.max(50,j.score-13):j.score}));
    const q=String(arg.query||'').toLowerCase();rows=rows.filter(j=>(j.company+' '+j.role+' '+j.location).toLowerCase().includes(q));
    if(arg.filter==='missing')rows=rows.filter(j=>!j.jdReady);if(arg.filter==='ready')rows=rows.filter(j=>j.jdReady&&!j.transferred);if(arg.filter==='transferred')rows=rows.filter(j=>j.transferred);if(arg.filter==='selected')rows=rows.filter(j=>j.selected);if(arg.filter==='cv')rows=rows.filter(j=>j.cv);if(arg.filter==='applied')rows=rows.filter(j=>String(j.status||'').trim().toLowerCase()==='applied');if(arg.filter==='unapplied')rows=rows.filter(j=>!!j.cvLink&&String(j.status||'').trim().toLowerCase()!=='applied');if(arg.filter==='unscored')rows=[];
    const interestKey=arg.candidate||state.candidate;
    rows=rows.map(j=>({...j,notInterested:!!demoNotInterested[interestKey+':'+j.url]}));
    rows=rows.filter(j=>arg.filter==='not-interested'?j.notInterested:!j.notInterested);
    if(arg.sort==='company')rows.sort((a,b)=>a.company.localeCompare(b.company));else if(arg.sort==='score')rows.sort((a,b)=>b.score-a.score);else rows.sort((a,b)=>b.row-a.row);
    const pageSize=arg.pageSize||10;return {rows:rows.slice(arg.offset==null?(arg.page-1)*pageSize:arg.offset,(arg.offset==null?(arg.page-1)*pageSize:arg.offset)+pageSize),page:arg.page,pages:Math.max(1,Math.ceil(rows.length/pageSize)),total:rows.length};}
  if(name==='getJob') {const j=demoJobs.find(x=>x.row===arg.row);return j?{...j,notInterested:!!demoNotInterested[(arg.candidate||state.candidate)+':'+j.url],source:arg.source,statusOptions:['NA','CV','CV+CL','CV+CL+WS','ERROR','Applied']}:null}
  if(name==='addDiscovery'){const existing=demoJobs.find(x=>x.url===arg.url);if(existing)return{row:existing.row,created:false,message:'Existing demo vacancy retained.'};const row=Math.max(...demoJobs.map(x=>x.row))+1;demoJobs.push({...arg,row,jdReady:String(arg.jd||'').length>=80,transferred:false,selected:false,cv:false,cl:false,web:false,status:'NA',score:'',transferStatus:''});return{row,created:true,message:'Added to preview only.'}}
  if(name==='saveDiscovery'){const j=demoJobs.find(x=>x.row===arg.row);Object.assign(j,arg.updates);j.jdReady=String(j.jd||'').length>=80;return {saved:true,message:'Demo JD saved locally — sheets unchanged.'}}
  if(name==='transferJob'){const j=demoJobs.find(x=>x.row===arg.row);if(!j.jdReady)throw new Error('Save full JD first.');j.transferred=true;return{created:true,freshRow:j.row,message:'Marked transferred in preview only.'}}
  if(name==='updateFreshJD')return{changed:true,message:'Demo update only.'};
  if(name==='setNotInterested'){
    const j=demoJobs.find(x=>x.row===arg.row);if(!j)throw new Error('Job not found in demo.');
    demoNotInterested[arg.candidate+':'+j.url]=arg.value;
    return{saved:true,notInterested:arg.value,message:arg.value?'Moved to Not Interested (demo).':'Restored (demo).'};
  }
  if(name==='updateFreshControl'){const j=demoJobs.find(x=>x.row===arg.row);j[arg.field]=arg.value;return{saved:true,value:arg.value,message:'Preview state updated only.'}}
  if(name==='bulkTransfer'){const results=arg.jobs.map(x=>{const j=demoJobs.find(z=>z.row===x.row);if(j&&!j.jdReady)return{ok:false,row:x.row,error:'Missing JD'};j.transferred=true;return{ok:true,row:x.row}});return{results,completed:results.filter(x=>x.ok).length,failed:results.filter(x=>!x.ok).length}};
  return{};}
async function run(name,arg,{quiet=false}={}){try{return await call(name,arg)}catch(e){if(!quiet)toast(e.message||String(e),true);throw e}}
function setBusy(v){state.busy=v;document.getElementById('content').classList.toggle('loading',v)}
function nav(section){state.section=section;state.filter='all';state.tabId='all';state.query='';state.sort='newest';state.page=1;state.bulk.clear();state.detail=null;state.data=null;state.listRequest++;render();if(section==='discovery'||section==='fresh')fetchList();if(section==='dashboard')fetchStats();window.scrollTo(0,0)}
function switchCandidate(name){if(!['Abhishek','Pooja'].includes(name))return;state.candidate=name;storeCandidate(name);state.page=1;state.bulk.clear();state.detail=null;state.data=null;state.stats=null;state.listRequest++;render();if(['discovery','fresh'].includes(state.section))fetchList();else if(state.section==='dashboard')fetchStats()}
async function fetchList(){
 if(!['discovery','fresh'].includes(state.section))return;
 const section=state.section,person=state.candidate,request=++state.listRequest;
 // New searches/filters start at the first batch. Next batches use loadMore() below.
 state.page=1;state.loadingMore=false;
 const params={source:section==='discovery'?'taaza':'fresh',candidate:person,tabId:state.tabId,query:state.query,filter:state.filter,sort:state.sort,page:1,pageSize:state.pageSize};
 setBusy(true);
 try{
  const data=await run('listJobs',params);
  if(request===state.listRequest&&section===state.section&&person===state.candidate){
   state.data=data;state.page=data.page;state.initError=null;
   if(section==='discovery')state.tabId=data.tabId||'all';
   const inp=document.activeElement,wasSearching=inp&&inp.id==='search',cursor=wasSearching?inp.selectionStart:null;
   const tabScroll=document.getElementById('categoryTabs')?.scrollLeft||0;
   render();
   const nextTabs=document.getElementById('categoryTabs');if(nextTabs)nextTabs.scrollLeft=tabScroll;
   if(wasSearching){const next=document.getElementById('search');if(next){next.focus();try{next.setSelectionRange(cursor,cursor)}catch(e){}}}
  }
 }catch(e){if(request===state.listRequest){state.initError=e.message;render()}}
 finally{if(request===state.listRequest)setBusy(false)}
}
async function loadMore(){
 if(state.loadingMore||!state.data||state.data.rows.length>=state.data.total)return;
 const prior=state.data,request=state.listRequest,section=state.section,person=state.candidate;
 const next=prior.page+1;state.loadingMore=true;
 const pager=document.querySelector('.pagination');
 if(pager)pager.innerHTML='<span class="meta" role="status">Loading more jobs below…</span>';
 try{
  const data=await run('listJobs',{source:section==='discovery'?'taaza':'fresh',candidate:person,tabId:state.tabId,query:state.query,filter:state.filter,sort:state.sort,page:next,pageSize:state.pageSize,offset:prior.rows.length});
  // A search, filter, candidate or tab change cancels stale in-flight batches.
  if(prior!==state.data||request!==state.listRequest||section!==state.section||person!==state.candidate)return;
  const seen=new Set(prior.rows.map(x=>x.row));const added=data.rows.filter(x=>!seen.has(x.row));
  prior.rows.push(...added);prior.page=data.page;prior.pages=data.pages;prior.total=data.total;state.page=data.page;
  // Append just the next cards without rebuilding existing DOM or scrolling upward.
  const grid=document.querySelector('.jobs');if(grid)grid.insertAdjacentHTML('beforeend',added.map(card).join(''));
  const bar=document.querySelector('.pagination');if(bar)bar.outerHTML=pagination();
  const count=document.getElementById('jobCount');if(count)count.textContent=prior.rows.length+' of '+prior.total+' shown';
 }catch(e){if(prior===state.data&&request===state.listRequest){const bar=document.querySelector('.pagination');if(bar)bar.outerHTML=pagination()}}
 finally{if(prior===state.data&&request===state.listRequest){state.loadingMore=false;const bar=document.querySelector('.pagination');if(bar)bar.outerHTML=pagination()}}
}
async function fetchStats(){const person=state.candidate;try{const v=await run('getStats',person,{quiet:true});if(person===state.candidate){state.stats=v;if(state.section==='dashboard')render()}}catch(e){if(state.section==='dashboard')toast(e.message||String(e),true)}}
function navRender(){const n=()=>navigation.map(x=>`<button class="nav-btn ${state.section===x.id?'active':''}" data-action="nav" data-value="${x.id}">${icon(x.icon)}<span>${x.label}</span></button>`).join('');document.getElementById('deskNav').innerHTML=n();document.getElementById('mobileNav').innerHTML=n().replaceAll('class="nav-btn','class="mobile-btn nav-btn');document.getElementById('candidateToggle').innerHTML=['Abhishek','Pooja'].map(x=>`<button class="${state.candidate===x?'active':''}" data-action="candidate" data-value="${x}">${x}</button>`).join('');document.getElementById('crumbTitle').textContent=navigation.find(x=>x.id===state.section).label;document.getElementById('avatar').textContent=state.candidate[0];document.getElementById('modeBadge').textContent=DEMO?'DEMO ONLY':'GOOGLE SHEETS LIVE';if(!DEMO)document.getElementById('modeBadge').style.cssText='background:#e8f9ed;color:#14783c'}
function title(head,sub,button){return `<div class="heading"><div><h1>${h(head)}</h1></div>${button||''}</div>`}
function kpi(label,value,sublabel,i){return `<div class="kpi"><i>${icon(i)}</i><label>${label}</label><strong>${value}</strong><small>${sublabel}</small></div>`}
function dash(){return title('Overview','',`<button class="btn btn-primary" data-action="nav" data-value="add">${icon('plus')} Add job</button>`)+`<div class="kpis">${kpi('Discovered',state.stats?state.stats.discovered:'—','Vacancies in Taaza','discover')}${kpi('Applications',state.stats?state.stats.applications:'—','Jobs in Freshmaal','brief')}${kpi('Shortlisted',state.stats?state.stats.selected:'—',state.candidate+' selected','target')}${kpi('CV requested',state.stats?state.stats.cvRequested:'—','Existing CV checkboxes','shield')}</div><div class="grid2"><section class="panel"><div class="subhead">Next move</div><div class="quick"><button class="btn" data-action="quick" data-value="missing">${icon('file')} Seems Kacha</button><button class="btn" data-action="quick" data-value="ready">${icon('arrow')} Seems Fresh</button><button class="btn" data-action="quick" data-value="cv">${icon('files')} Make CV</button><button class="btn" data-action="quick" data-value="selected">${icon('target')} Shortlisted</button><button class="btn" data-action="view-not-interested" data-source="discovery">${icon('trash')} Not Interested · Taaza</button><button class="btn" data-action="view-not-interested" data-source="fresh">${icon('trash')} Not Interested · CV</button></div></section><section class="panel flow-strip"><div class="flow-title">From vacancy to CV</div><div class="flow-trail"><span>Seems Kacha</span><span>Seems Taaza</span><span>Seems Fresh</span><span>Garam CV Ready</span></div></section></div>`}
function filterOptions(){return state.section==='discovery'?[['all','All jobs'],['missing','Seems Kacha'],['ready','Seems Taaza'],['transferred','In Freshmaal'],['not-interested','Not Interested']]:[['all','All jobs'],['unapplied','Unapplied · CV ready'],['selected','My shortlist'],['cv','CV requests'],['applied','Applied'],['unscored','Unscored'],['not-interested','Not Interested']]}
function discoveryTabs(){
 if(state.section!=='discovery')return '';
 const tabs=state.data?.tabs||[];
 const all=[{id:'all',name:'All jobs'},{id:'common',name:'Common · Jobs only'},...tabs];
 return '<div class="category-strip" id="categoryTabs" role="group" aria-label="Job source categories">'+
   all.map(x=>'<button class="chip '+(state.tabId===x.id?'active':'')+'" data-action="category" data-value="'+h(x.id)+'" aria-pressed="'+(state.tabId===x.id)+'" title="'+h(x.name)+'">'+h(x.name)+'</button>').join('')+
   '</div>';
}
function filters(){return `<div class="panel toolbar"><div class="toolbar-main"><div class="searchbox">${icon('discover')}<input id="search" type="search" aria-label="Search jobs" placeholder="Search jobs..." value="${h(state.query)}" autocomplete="off"/></div><select id="sort" aria-label="Sort results"><option value="newest" ${state.sort==='newest'?'selected':''}>Newest rows</option><option value="company" ${state.sort==='company'?'selected':''}>Company A–Z</option>${state.section==='fresh'?`<option value="score" ${state.sort==='score'?'selected':''}>Highest score</option>`:''}</select><button class="btn" title="Refresh from Google Sheets" data-action="refresh">${icon('refresh')}</button></div><div class="toolbar-bottom"><div class="chiprow">${filterOptions().map(([key,label])=>`<button class="chip ${state.filter===key?'active':''}" data-action="filter" data-value="${key}">${label}</button>`).join('')}</div><span class="meta" id="jobCount">${state.data?state.data.rows.length+' of '+state.data.total+' shown':'Loading jobs...'}</span></div>${discoveryTabs()}</div>`}
function identity(job){return encodeURIComponent(JSON.stringify(expected(job)))}

function activityFor(job){
  if(DEMO||job.cvLink||String(job.status||'').toLowerCase()==='applied')return null;
  const key=state.candidate.toLowerCase()+':'+Number(job.row);
  const active=state.cvQueue?.byJob?.[key];
  if(active)return active;
  if(state.pendingCv[key] && Date.now()-state.pendingCv[key]<120000)
    return {state:'queued',queueNumber:null,pending:true};
  return null;
}
function activityMarkup(job){
  const active=activityFor(job);
  if(!active)return '';
  const queued=active.state==='queued';
  const message=queued
    ?(active.queueNumber?'Queued · #'+Number(active.queueNumber):'Queued · awaiting GitHub')
    :'Generating CV';
  const phase=!queued&&job.workflow&&/^(CLAIMED|INITIALISING|STAGE_[123]|NORMALIZE|QA|DRIVE_UPLOAD|FINALIZE)$/i.test(job.workflow)
    ?' · '+h(job.workflow.replaceAll('_',' ')):'';
  return '<div class="cv-activity '+(queued?'waiting':'running')+
    '" role="status"><span class="cv-spin" aria-hidden="true"></span><span>'+
    message+phase+'</span><small>'+ (queued?'Manual CV queue':'Processing on GitHub Actions')+'</small></div>';
}
function queueOverview(){
  const q=state.cvQueue;
  if(DEMO)return '';
  if(!q)return '<div class="cv-queue-overview" id="cv-queue-summary">Checking CV queue…</div>';
  return '<div class="cv-queue-overview" id="cv-queue-summary"><span class="cv-dot"></span>'+

function refreshQueueWidgets(){

  });
  document.querySelectorAll('.cv-activity-slot[data-row]').forEach(slot=>{
    const row=Number(slot.dataset.row);

async function pollCvQueue(){
  if(DEMO)return;
  try{
    const q=await run('getCvQueue',null,{quiet:true});
    state.cvQueue=q;
    for(const key of Object.keys(state.pendingCv)){
      if(q.byJob?.[key] || Date.now()-state.pendingCv[key]>120000)delete state.pendingCv[key];
    }
    refreshQueueWidgets();
  }catch(e){
    // A temporary GitHub API failure must not erase a previously confirmed state.
    if(!state.cvQueue){
      const el=document.getElementById('cv-queue-summary');
      if(el)el.textContent='CV queue temporarily unavailable · try refresh';
    }
  }
}

function downloadCv(row){
 const job=state.detail?.row===row?state.detail:state.data?.rows?.find(j=>j.row===row);
 if(!job||!job.cvLink){toast('No completed CV is ready for this candidate.',true);return}
 const link=safeUrl(job.cvLink),match=link&&link.match(/\/d\/([a-zA-Z0-9_-]+)/);
 if(!match||!/^(?:https:\/\/docs\.google\.com\/|https:\/\/drive\.google\.com\/)/.test(link)){
   toast('The CV link is not a recognised Google Drive document.',true);return;
 }

function sameJobUrl(a,b){
 try{const x=new URL(a),y=new URL(b);const norm=u=>{
   const q=[...u.searchParams.entries()].filter(([k])=>!(/^(utm_.+|fbclid|gclid|msclkid|igshid|ref_src|source|trk|tracking|tm_event|tm_company)$/i.test(k)));
   q.sort((a,b)=>a[0].localeCompare(b[0]));return u.hostname.toLowerCase().replace(/^www\./,'')+u.pathname.replace(/\/$/,'')+JSON.stringify(q);
 };return norm(x)===norm(y)}catch(e){return String(a).trim()===String(b).trim()}
}
async function setInterest(row,value){

   const res=await run('setNotInterested',{source,candidate,row,value,expected:expected(job)});
   toast(res.message);if(section!==state.section||candidate!==state.candidate)return;job.notInterested=value;

     // No scroll reset, and the next batch uses a live offset to fill gaps.
     const hiddenByCurrentFilter=state.filter==='not-interested'?!value:value;
     if(hiddenByCurrentFilter){const before=state.data.rows.length;
       const removed=state.data.rows.filter(x=>sameJobUrl(x.url,job.url));
       state.data.rows=state.data.rows.filter(x=>!sameJobUrl(x.url,job.url));

async function runCvNow(row) {
  const job=state.detail?.row===row?state.detail:state.data?.rows?.find(x=>x.row===row);
  if(!job){toast('Refresh this job before running CV.',true);return}
  if(DEMO){toast('Preview only: the OpenAI API is not called in demo mode.');return}
  if(!job.cv){toast('Tick Make CV first and save it.',true);return}
  if(activityFor(job)){toast('This CV is already queued or running.',true);return}
  const candidate=state.candidate,tier=getPreviewTier(row),clTier=getPreviewClTier(row);
  if(!confirm('Start a PAID OpenAI API run for '+candidate+' at '+job.company+' — '+job.role+' (row '+row+', CV: '+tier+', CL: '+(job.cl?clTier:'off')+')? Only this job will be requested.'))return;
  try{
    const result=await run('runCvApiNow',{candidate,row,expected:expected(job),confirm:true});
    state.pendingCv[candidate.toLowerCase()+':'+row]=Date.now();
    toast(result.message);
    refreshQueueWidgets();
    setTimeout(pollCvQueue,1500);
  }catch(e){}
}

async function saveJD(){const d=state.detail;if(!d)return;const value=document.getElementById('detail-jd').value;if(String(value).trim()===String(d.jd||'').trim()){toast('No changes to the JD.');return}if(d.jd&&d.jd.length>80&&!confirm('Replace the existing Taaza job description in Column D?'))return;try{const res=await run('saveDiscovery',{row:d.row,expected:expected(d),expectedJD:d.jd,updates:{jd:value}});d.jd=value;d.jdReady=value.length>=80;toast(res.message);fetchList();drawDetail()}catch(e){}}
async function saveFields(){const d=state.detail;if(!d)return;const changes={company:document.getElementById('edit-company').value,role:document.getElementById('edit-role').value,url:document.getElementById('edit-url').value,location:document.getElementById('edit-location').value,deadline:document.getElementById('edit-deadline').value,salary:document.getElementById('edit-salary').value};try{const res=await run('saveDiscovery',{row:d.row,expected:expected(d),updates:changes});Object.assign(d,changes);toast(res.message);drawDetail();fetchList()}catch(e){}}
async function syncJD(){const d=state.detail;if(!d)return;if(!confirm('Replace the Freshmaal JD for this job using the currently saved Taaza JD? This may make generated CVs outdated.'))return;try{const res=await run('updateFreshJD',{row:d.row,expected:expected(d),confirm:true});toast(res.message)}catch(e){}}
async function saveAdd(mode){const get=id=>document.getElementById(id).value.trim();const payload={company:get('add-company'),role:get('add-role'),url:get('add-url'),location:get('add-location'),deadline:get('add-deadline'),salary:get('add-salary'),jd:get('add-jd')};if(!payload.company||!payload.role||!safeUrl(payload.url)){toast('Company, designation and a valid vacancy URL are required.',true);return}if(mode==='send'&&payload.jd.length<80){toast('Paste and save the complete JD before sending to Freshmaal.',true);return}setBusy(true);try{const res=await run('addDiscovery',payload);toast(res.message);if(mode==='send'){const result=await run('transferJob',{row:res.row,expected:expected(payload)});toast(result.message)}if(res.created)document.getElementById('addForm').reset();nav('discovery')}catch(e){}finally{setBusy(false)}}
async function transferBulk(){const choices=[...state.bulk.values()];if(!choices.length)return;if(!confirm('Transfer '+choices.length+' selected vacancies to Freshmaal? Jobs without complete JD will be skipped.'))return;try{const res=await run('bulkTransfer',{jobs:choices.map(x=>({row:x.row,expected:expected(x)}))});toast(res.completed+' transferred or matched; '+res.failed+' failed.');state.bulk.clear();fetchList()}catch(e){}}
let debounce;document.addEventListener('input',e=>{if(e.target.id==='search'){clearTimeout(debounce);debounce=setTimeout(()=>{state.query=e.target.value;state.page=1;fetchList()},260)}});
document.addEventListener('change',e=>{const a=e.target.dataset.action;if(a==='tier-mode'||a==='cl-tier-mode'){changePreviewTier(Number(e.target.dataset.row),e.target.value,a==='cl-tier-mode'?'clTier':'tier');return}if(a==='inline-status'){control(Number(e.target.dataset.row),'status',e.target.value,e.target);return}if(e.target.id==='sort'){state.sort=e.target.value;state.page=1;fetchList();return}if(e.target.id==='fresh-status'){const d=state.detail;if(d)control(d.row,'status',e.target.value,e.target);return}if(a==='bulk-select'){const row=Number(e.target.dataset.row),job=state.data?.rows.find(x=>x.row===row);if(e.target.checked&&job)state.bulk.set(row,job);else state.bulk.delete(row);render();return}if(a==='inline-control'||a==='detail-control'){const row=a==='detail-control'?state.detail?.row:Number(e.target.dataset.row),field=e.target.dataset.field;control(row,field,e.target.checked,e.target)}});
document.addEventListener('click',async e=>{if(e.target.classList.contains('modal-back')){closeDetail();return}const x=e.target.closest('[data-action]');if(!x)return;const a=x.dataset.action,value=x.dataset.value,row=Number(x.dataset.row);if(a==='nav'){nav(value);return}if(a==='candidate'){switchCandidate(value);return}if(a==='quick'){nav(value==='missing'||value==='ready'?'discovery':'fresh');state.filter=value;render();fetchList();return}if(a==='filter'){state.filter=value;state.page=1;state.bulk.clear();fetchList();return}if(a==='category'){state.tabId=value;state.page=1;state.bulk.clear();fetchList();return}if(a==='load-more'){loadMore();return}if(a==='set-interest'){setInterest(row,value==='true');return}if(a==='view-not-interested'){nav(x.dataset.source==='fresh'?'fresh':'discovery');state.filter='not-interested';render();fetchList();return}if(a==='refresh'){fetchList();return}if(a==='open-link'){openLink(x.dataset.url);return}if(a==='detail'){details(row);return}if(a==='close'){closeDetail();return}if(a==='transfer'){transfer(row);return}if(a==='run-cv-now'){runCvNow(row);return}if(a==='download-cv'){downloadCv(row);return}if(a==='copy-prompt'){copyCvPrompt(row);return}if(a==='bulk-transfer'){transferBulk();return}if(a==='save-jd'){saveJD();return}if(a==='save-fields'){saveFields();return}if(a==='sync-jd'){syncJD();return}});
document.addEventListener('submit',e=>{if(e.target.id==='addForm'){e.preventDefault();const mode=e.submitter?.dataset.mode||'save';saveAdd(mode)}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.detail)closeDetail()});
window.addEventListener('resize',()=>{const size=innerWidth<721?10:25;if(state.pageSize!==size){state.pageSize=size;state.page=1;if(['discovery','fresh'].includes(state.section))fetchList()}});
async function init(){render();try{const b=await run('getBootstrap');state.bootstrap=b;if(!DEMO)toast('Connected to both Google Sheets as '+b.email);await fetchStats()}catch(e){state.initError=e.message;nav('discovery')}}
init();
if(!DEMO){
  if('serviceWorker' in navigator && location.protocol==='https:'){
    navigator.serviceWorker.register('/sw.js',{scope:'/'}).catch(()=>{});
  }
  let installEvent=null;
  function showInstall(){
    if(window.matchMedia('(display-mode: standalone)').matches)return;
    const top=document.querySelector('.top-actions');
    if(!top)return;
    let btn=document.getElementById('cv-install-app');
    if(!btn){
      btn=document.createElement('button');
      btn.id='cv-install-app';btn.type='button';
      btn.textContent='Install app';
      btn.title='Install Freshmaal in Chrome as a standalone desktop/mobile app';
      btn.addEventListener('click',async()=>{
        if(!installEvent){
          toast('In Chrome, open the menu (⋮) → Cast, save and share → Install page as app.',false);
          return;
        }
        const event=installEvent;installEvent=null;
        try{await event.prompt();await event.userChoice;}catch(_){}
        btn.hidden=true;
      });
      const toggle=document.getElementById('candidateToggle');
      top.insertBefore(btn,toggle||top.firstChild);
    }
  }
  window.addEventListener('beforeinstallprompt',event=>{
    event.preventDefault();installEvent=event;showInstall();
  });
  window.addEventListener('appinstalled',()=>{
    const btn=document.getElementById('cv-install-app');
    if(btn)btn.hidden=true;
  });
  showInstall();
  setTimeout(pollCvQueue,1200);
  setInterval(()=>{if(!document.hidden)pollCvQueue()},15000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)pollCvQueue()});
}
</script>
</body>
</html>
