/* Model-tier prototype extension: non-invasive, local preview only */
.tier-banner{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 17px;margin:0 0 14px;background:linear-gradient(110deg,#ecf3ff,#fff);border:1px solid #dbe7fa;border-radius:13px;flex-wrap:wrap}
.tier-banner strong{display:block;font-size:12px;color:#1d497e}.tier-banner p{font-size:11px;color:#647b98;margin:4px 0 0;max-width:720px}
.tier-pill{font-size:10px;background:#fff;border:1px solid #d6e4f7;color:#456c9c;padding:5px 9px;border-radius:30px;font-weight:700}
.tier-inline{display:flex;align-items:center;gap:7px;padding:0 5px}
.tier-inline label{font-size:11px;color:#64748b;font-weight:750;white-space:nowrap}
.tier-select{background:#f3f7ff;color:#204770;font-weight:750;border:1px solid #cdddf6;border-radius:8px;padding:6px 8px;min-height:31px;font-size:11px;max-width:135px}
.tier-detail{background:#f8faff;border:1px solid #dce8fa;padding:16px;border-radius:12px;margin:14px 0 17px}
.tier-detail header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tier-detail header strong{font-size:13px}.tier-detail select{border-radius:9px;min-height:37px;border:1px solid #bacdeb;background:#fff;padding:7px 11px;font-weight:750}
.tier-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:13px 0 9px}
.tier-cell{background:#fff;border:1px solid #e0eafa;padding:10px;border-radius:9px;min-width:0}
.tier-cell span{display:block;font-size:10px;color:#7486a0}.tier-cell strong{font-size:11px;overflow-wrap:anywhere;color:#193a63}
.tier-note{font-size:10px;color:#536e8b;line-height:1.55}
@media(max-width:721px){.tier-grid{grid-template-columns:1fr}.tier-inline{width:100%;justify-content:space-between;padding:7px 0}.tier-select{min-width:140px}.tier-banner{align-items:flex-start}}

.toolbar{padding:10px 12px;margin-bottom:10px}.toolbar-bottom{margin-top:9px}.jobs{grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.job{padding:13px 15px;display:flex;flex-direction:column;justify-content:space-between;min-height:152px}.job .company{margin-bottom:7px}.jobcontrols{margin-top:10px;padding-top:9px}
.kpis{gap:9px;margin-bottom:11px}.kpi{padding:13px 16px}.kpi strong{font-size:25px}.kpi label{margin-bottom:4px}.kpi small{margin-top:0}
.grid2{grid-template-columns:1.5fr 1fr;gap:11px}.panel{padding:14px}.quick{grid-template-columns:repeat(2,minmax(0,1fr))}.quick button{min-height:46px}

.tier-banner{padding:8px 10px}.tier-banner strong{font-size:11px}.tier-pill{font-size:9px}

/* Live, reduced-motion-safe CV queue indication. Pure CSS; no extra images. */
.cv-activity-slot:empty{display:none}
.cv-activity{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:10px 0 1px;padding:9px 11px;border:1px solid #cbdcf9;border-radius:9px;background:#f1f6ff;font-size:11px;color:#23558b;font-weight:730}
.cv-activity.waiting{background:#fffbf1;color:#805b0b;border-color:#f6deb0}
.cv-activity .cv-spin{width:13px;height:13px;flex:none;border:2px solid #c5d7f0;border-top-color:#2563eb;border-radius:50%;animation:rotate .9s linear infinite}
.cv-activity.waiting .cv-spin{border-top-color:#b7791f}
.cv-activity small{font-size:10px;opacity:.8;font-weight:550}
.cv-queue-overview{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 12px;padding:9px 13px;background:#fff;border:1px solid #dbe6f5;border-radius:10px;font-size:11px;color:#46617f}
.cv-queue-overview strong{font-weight:800;color:#1a4784}
.cv-queue-overview .cv-dot{height:7px;width:7px;border-radius:50%;background:#367cf1;box-shadow:0 0 0 3px #e5efff}
@media(prefers-reduced-motion:reduce){.cv-activity .cv-spin{animation:none;border-color:#2563eb}}
/* Installable app: unobtrusive compact action in the existing account header. */
#cv-install-app{border:1px solid #dbe6f5;border-radius:8px;background:#edf4ff;color:#1d4e7d;padding:7px 10px;font-size:11px;font-weight:700;white-space:nowrap}
#cv-install-app:hover{background:#dcecff}
@media(max-width:500px){#cv-install-app{padding:6px 7px;font-size:10px}}
/* Two immediately editable per-candidate settings on every Freshmaal job card. */
.job-settings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px;border-top:1px solid #edf1f7;padding-top:10px}
.job-setting{min-width:0;display:flex;flex-direction:column;gap:5px}
.job-setting label{font-size:10px;font-weight:750;color:#536781}
.job-setting select{width:100%;max-width:none;min-width:0;text-overflow:ellipsis;background:#f3f7ff;border:1px solid #cbdaf0;border-radius:8px;padding:7px 6px;font-size:11px;min-height:34px}
.job-setting select.status-select{background:#fff;border-color:#cbd5e1;color:#263850}
@media(max-width:720px){.job-settings{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px;padding-top:8px}.job-setting:last-child{grid-column:auto}.job-setting label{font-size:9.5px;line-height:1.3;min-height:24px}.job-setting select{font-size:10px;padding:6px 3px;min-height:38px}}
@media(max-width:360px){.job-settings{gap:6px}.job-setting label{font-size:9px}.job-setting select{font-size:10px}}

/* Completed CV buttons share the existing action row rather than a new panel. */
.job.cv-ready .jobcontrols .row{gap:5px;flex-wrap:wrap}
.job.cv-ready .jobcontrols .btn-xs{min-height:29px;padding:4px 7px;font-size:10px;gap:4px}
.job.cv-ready .jobcontrols .btn-xs svg{width:13px;height:13px}
@media(max-width:720px){.job.cv-ready .jobcontrols{gap:6px;padding-top:7px;margin-top:7px}.job.cv-ready .checks{gap:8px}.job.cv-ready .jobcontrols .row{gap:4px}}

/* Compact cards keep statuses together and the options action beside preferences. */
.job-badges{align-items:center;gap:4px;margin-top:5px}
.job-badges .tag{padding:2px 6px;font-size:9px}

 <aside class="sidebar"><div class="brand"><div class="brandmark">G</div><div><strong>Garamaal</strong><small>JOB CONTROL CENTRE</small></div></div><nav id="deskNav"></nav><div class="side-bottom">Connected architecture<span>Taaza → Freshmaal → CV automation</span><span style="margin-top:8px">Separate overlay · No ranking API</span></div></aside>
 <div class="main"><header class="topbar"><div class="crumb">Workspace / <strong id="crumbTitle">Overview</strong></div><div class="top-actions"><span id="modeBadge" class="demo">PREVIEW</span><div id="candidateToggle" class="switch"></div><button id="expenseToggle" type="button" title="Recorded CV expenses" aria-label="Recorded CV expenses" data-action="expenses">$</button><div id="avatar" class="avatar">A</div></div></header><main id="content" class="container" aria-live="polite"></main></div>

'use strict';
const DEMO = !(window.google && google.script && google.script.run);
// PLANNED tier mappings: the live runner will store this mapping in GitHub,
// not in Sheets or browser JS. Demo selections are local browser state only.
const MODEL_PRESETS={
 Economy:['gpt-6-luna','gpt-6-luna','gpt-6-luna'],
 Balanced:['gpt-6-luna','gpt-6-luna','gpt-6.1-sol'],
 Premium:['gpt-5.6-terra','gpt-5.6-terra','gpt-5.6-sol']
};
const tierPreviewMemory={};
const demoNotInterested={};
const demoPreferences={};
function getPreviewTier(row,candidate=state.candidate){
  const live=state.detail?.row===row?state.detail:state.data?.rows?.find(x=>x.row===row);
  if(!DEMO && live && MODEL_PRESETS[live.tier]) return live.tier;
  const key=candidate+':'+row; if(MODEL_PRESETS[tierPreviewMemory[key]])return tierPreviewMemory[key];
 try{const p=localStorage.getItem('freshmaal-tier-preview:'+key);return MODEL_PRESETS[p]?p:'Premium'}catch(e){return 'Premium'}
}
function getPreviewClTier(row){const job=state.detail?.row===row?state.detail:state.data?.rows?.find(x=>x.row===row);return job?.clTierExplicit&&MODEL_PRESETS[job.clTier]?job.clTier:getPreviewTier(row)}
function tierChoices(row,kind='tier'){const current=kind==='clTier'?getPreviewClTier(row):getPreviewTier(row);return Object.keys(MODEL_PRESETS).map(name=>`<option value="${name}" ${current===name?'selected':''}>${name}</option>`).join('')}
function tierInfo(tier){const names=MODEL_PRESETS[tier]||MODEL_PRESETS.Premium;return `<div class="tier-grid">${names.map((v,i)=>`<div class="tier-cell"><span>Stage ${i+1}</span><strong>${v}</strong></div>`).join('')}</div><div class="tier-note">When the current merged analysis is enabled, Stages 1 and 2 make one model call using the Stage 2 setting. Stage 3 remains the Word-document generation stage.</div>`}

function jobStatusOptions(job) {
  const options=Array.isArray(job.statusOptions)?job.statusOptions.slice():[];
  if(job.status&&!options.includes(job.status))options.unshift(job.status);
  if(!options.length)options.push('Not started','Ready','Applied');
  return [...new Set(options.map(String))];
}
function statusChoices(job) {
  const selected=String(job.status||'');
  const opts=jobStatusOptions(job);
  return `<option value="" ${!selected?'selected':''}>Choose status</option>`+
    opts.map(name=>`<option value="${h(name)}" ${selected===name?'selected':''}>${h(name)}</option>`).join('');
}

function tierBanner(){return `<section class="tier-banner"><strong>CV model · ${h(state.candidate)}</strong><span class="tier-pill">Economy · Balanced · Premium</span></section>`}
async function changePreviewTier(row,tier,kind='tier'){
 if(!MODEL_PRESETS[tier])return;
 const item=state.detail?.row===row?state.detail:state.data?.rows?.find(j=>j.row===row);
 if(!DEMO){
   if(!item){toast('Refresh jobs first.',true);return}
   try{
     const result=await run('updateFreshControl',{row,candidate:state.candidate,field:kind,value:tier,expected:expected(item)});

     if(kind==='clTier')item.clTierExplicit=true;
     if(state.detail?.row===row){state.detail[kind]=tier;if(kind==='clTier')state.detail.clTierExplicit=true;}
     if(state.data)state.data.rows.forEach(j=>{if(j.row===row){j[kind]=tier;if(kind==='clTier')j.clTierExplicit=true;}});

     if(state.detail)drawDetail();else render();
   }catch(e){if(state.detail)drawDetail();else render()}
   return;
 }
 item[kind]=tier;
 toast(tier+' '+(kind==='clTier'?'cover letter':'CV')+' tier selected (demo).');
 render();if(state.detail)drawDetail();
}

async function fetchList(){
 if(!['discovery','fresh'].includes(state.section))return;
 const section=state.section,person=state.candidate,request=++state.listRequest;
 // New searches/filters start at the first batch. Next batches use loadMore() below.

 setBusy(true);
 try{
  const data=await run('listJobs',params);
  if(request===state.listRequest&&section===state.section&&person===state.candidate){
   state.data=data;state.page=data.page;state.initError=null;
   if(section==='discovery')state.tabId=data.tabId||'all';
   const inp=document.activeElement,wasSearching=inp&&inp.id==='search',cursor=wasSearching?inp.selectionStart:null;

  }
 }catch(e){if(request===state.listRequest){state.initError=e.message;render()}}

}
async function loadMore(){
 if(state.loadingMore||!state.data||state.data.rows.length>=state.data.total)return;
 const prior=state.data,request=state.listRequest,section=state.section,person=state.candidate;
 const next=prior.page+1;state.loadingMore=true;
 const pager=document.querySelector('.pagination');
 if(pager)pager.innerHTML='<span class="meta" role="status">Loading more jobs below…</span>';
 try{
  const data=await run('listJobs',{source:section==='discovery'?'taaza':'fresh',candidate:person,tabId:state.tabId,query:state.query,filter:state.filter,sort:state.sort,page:next,pageSize:state.pageSize,offset:prior.rows.length});
  // A search, filter, candidate or tab change cancels stale in-flight batches.
  if(prior!==state.data||request!==state.listRequest||section!==state.section||person!==state.candidate)return;
  const seen=new Set(prior.rows.map(x=>x.row));const added=data.rows.filter(x=>!seen.has(x.row));
  prior.rows.push(...added);prior.page=data.page;prior.pages=data.pages;prior.total=data.total;state.page=data.page;
  // Append just the next cards without rebuilding existing DOM or scrolling upward.
  const grid=document.querySelector('.jobs');if(grid)grid.insertAdjacentHTML('beforeend',added.map(card).join(''));
  const bar=document.querySelector('.pagination');if(bar)bar.outerHTML=pagination();
  const count=document.getElementById('jobCount');if(count)count.textContent=prior.rows.length+' of '+prior.total+' shown';
 }catch(e){if(prior===state.data&&request===state.listRequest){const bar=document.querySelector('.pagination');if(bar)bar.outerHTML=pagination()}}
 finally{if(prior===state.data&&request===state.listRequest){state.loadingMore=false;const bar=document.querySelector('.pagination');if(bar)bar.outerHTML=pagination()}}
}

function activityFor(job){
  if(DEMO||job.cvLink||String(job.status||'').toLowerCase()==='applied')return null;
  const key=state.candidate.toLowerCase()+':'+Number(job.row);
  const active=state.cvQueue?.byJob?.[key];
  if(active)return active;
  if(state.pendingCv[key] && Date.now()-state.pendingCv[key]<120000)
    return {state:'queued',queueNumber:null,pending:true};
  return null;
}
function activityMarkup(job){
  const active=activityFor(job);
  if(!active)return '';
  const queued=active.state==='queued';
  const message=queued
    ?(active.queueNumber?'Queued · #'+Number(active.queueNumber):'Queued · awaiting GitHub')
    :'Generating CV';
  const phase=!queued&&job.workflow&&/^(CLAIMED|INITIALISING|STAGE_[123]|NORMALIZE|QA|DRIVE_UPLOAD|FINALIZE)$/i.test(job.workflow)
    ?' · '+h(job.workflow.replaceAll('_',' ')):'';
  return '<div class="cv-activity '+(queued?'waiting':'running')+
    '" role="status"><span class="cv-spin" aria-hidden="true"></span><span>'+
    message+phase+'</span><small>'+ (queued?'Manual CV queue':'Processing on GitHub Actions')+'</small></div>';
}
function queueOverview(){
  const q=state.cvQueue;
  if(DEMO)return '';
  if(!q)return '<div class="cv-queue-overview" id="cv-queue-summary">Checking CV queue…</div>';
  return '<div class="cv-queue-overview" id="cv-queue-summary"><span class="cv-dot"></span>'+
    '<strong>'+q.running+' running</strong><span>'+q.queued+' queued</span>'+
    '<span title="'+h(q.queueNote||'')+'">Manual CV requests · refreshes automatically</span></div>';
}
function refreshQueueWidgets(){
  const overview=document.getElementById('cv-queue-summary');
  if(overview){const shell=document.createElement('div');shell.innerHTML=queueOverview();overview.replaceWith(shell.firstElementChild);}
  if(state.section!=='fresh')return;
  document.querySelectorAll('.job[data-job-row]').forEach(node=>{
    const job=state.data?.rows?.find(j=>j.row===Number(node.dataset.jobRow));
    const btn=node.querySelector('[data-action="run-cv-now"]');
    if(btn&&job)btn.disabled=!job.cv||!!job.cvLink||job.notInterested||String(job.status||'').toLowerCase()==='applied'||!!activityFor(job);
  });
  document.querySelectorAll('.cv-activity-slot[data-row]').forEach(slot=>{
    const row=Number(slot.dataset.row);
    const job=state.data?.rows?.find(j=>j.row===row);
    if(job)slot.innerHTML=activityMarkup(job);
  });
  if(state.detail && state.detail.source==='fresh'){
    const detail=document.querySelector('#cv-detail-activity');
    if(detail)detail.innerHTML=activityMarkup(state.detail);
  }
}
async function pollCvQueue(){
  if(DEMO)return;
  try{
    const q=await run('getCvQueue',null,{quiet:true});

function updateList(job){if(state.data)state.data.rows=state.data.rows.map(x=>x.row===job.row?{...x,...job}:x)}
function sameJobUrl(a,b){
 try{const x=new URL(a),y=new URL(b);const norm=u=>{
   const q=[...u.searchParams.entries()].filter(([k])=>!(/^(utm_.+|fbclid|gclid|msclkid|igshid|ref_src|source|trk|tracking|tm_event|tm_company)$/i.test(k)));
   q.sort((a,b)=>a[0].localeCompare(b[0]));return u.hostname.toLowerCase().replace(/^www\./,'')+u.pathname.replace(/\/$/,'')+JSON.stringify(q);
 };return norm(x)===norm(y)}catch(e){return String(a).trim()===String(b).trim()}
}
const preferencePending=new Set();
async function setPreference(row,value,element){
 const section=state.section,candidate=state.candidate,source=section==='discovery'?'taaza':'fresh';
 const job=state.detail?.row===row?state.detail:state.data?.rows?.find(x=>x.row===row);if(!job)return;
 const key=source+'|'+candidate+'|'+row;
 if(preferencePending.has(key))return;
 preferencePending.add(key);
 if(element)element.disabled=true;
 try{
   const res=await run('setJobPreference',{source,candidate,row,value,expected:expected(job)});
   toast(res.message);
   if(section!==state.section||candidate!==state.candidate)return;
   job.preference=value;job.favorite=value==='Favorite';job.notInterested=value==='Not Interested';
   if(state.detail?.row===row){Object.assign(state.detail,{preference:value,favorite:job.favorite,notInterested:job.notInterested});drawDetail();}
   await fetchList();
 }catch(e){toast(e.message||'Could not save preference.',true);}
 finally{preferencePending.delete(key);if(element&&element.isConnected)element.disabled=false;}
}

async function runCvNow(row) {
  const job=state.detail?.row===row?state.detail:state.data?.rows?.find(x=>x.row===row);
  if(!job){toast('Refresh this job before running CV.',true);return}
  if(DEMO){toast('Preview only: the OpenAI API is not called in demo mode.');return}
  if(!job.cv){toast('Tick Make CV first and save it.',true);return}
  if(activityFor(job)){toast('This CV is already queued or running.',true);return}
  const candidate=state.candidate,tier=getPreviewTier(row),clTier=getPreviewClTier(row);
  if(!confirm('Start a PAID OpenAI API run for '+candidate+' at '+job.company+' — '+job.role+' (row '+row+', CV: '+tier+', CL: '+(job.cl?clTier:'off')+')? Only this job will be requested.'))return;
  try{
    const result=await run('runCvApiNow',{candidate,row,expected:expected(job),confirm:true});
    state.pendingCv[candidate.toLowerCase()+':'+row]=Date.now();
    toast(result.message);
    refreshQueueWidgets();
    setTimeout(pollCvQueue,1500);
  }catch(e){}
}

async function transfer(row){const job=state.detail&&state.detail.row===row?state.detail:state.data?.rows?.find(x=>x.row===row);if(!job)return;try{const result=await run('transferJob',{row,expected:expected(job)});toast(result.message);if(state.detail&&state.detail.row===row)state.detail.transferStatus=result.message;fetchList()}catch(e){}}
async function saveJD(){const d=state.detail;if(!d)return;const value=document.getElementById('detail-jd').value;if(String(value).trim()===String(d.jd||'').trim()){toast('No changes to the JD.');return}if(d.jd&&d.jd.length>80&&!confirm('Replace the existing Taaza job description in Column D?'))return;try{const res=await run('saveDiscovery',{row:d.row,expected:expected(d),expectedJD:d.jd,updates:{jd:value}});d.jd=value;d.jdReady=value.length>=80;d.transferStatus=res.message;toast(res.message);fetchList();drawDetail()}catch(e){}}
async function saveFields(){const d=state.detail;if(!d)return;const changes={company:document.getElementById('edit-company').value,role:document.getElementById('edit-role').value,url:document.getElementById('edit-url').value,location:document.getElementById('edit-location').value,deadline:document.getElementById('edit-deadline').value,salary:document.getElementById('edit-salary').value};try{const res=await run('saveDiscovery',{row:d.row,expected:expected(d),updates:changes});Object.assign(d,changes);toast(res.message);drawDetail();fetchList()}catch(e){}}
async function syncJD(){const d=state.detail;if(!d)return;if(!confirm('Replace the Freshmaal JD for this job using the currently saved Taaza JD? This may make generated CVs outdated.'))return;try{const res=await run('updateFreshJD',{row:d.row,expected:expected(d),confirm:true});toast(res.message)}catch(e){}}
async function saveAdd(mode){const get=id=>document.getElementById(id).value.trim();const payload={company:get('add-company'),role:get('add-role'),url:get('add-url'),location:get('add-location'),deadline:get('add-deadline'),salary:get('add-salary'),jd:get('add-jd')};if(!payload.company||!payload.role||!safeUrl(payload.url)){toast('Company, designation and a valid vacancy URL are required.',true);return}if(mode==='send'&&payload.jd.length<80){toast('Paste and save the complete JD before sending to Freshmaal.',true);return}setBusy(true);try{const res=await run('addDiscovery',payload);toast(res.message);if(mode==='send'&&!res.autoTransferred&&!res.transferError){const result=await run('transferJob',{row:res.row,expected:expected(payload)});toast(result.message)}if(res.created)document.getElementById('addForm').reset();nav('discovery')}catch(e){}finally{setBusy(false)}}

let debounce;document.addEventListener('input',e=>{if(e.target.id==='search'){clearTimeout(debounce);debounce=setTimeout(()=>{const next=e.target.value;if(next===state.query)return;state.query=next;state.page=1;fetchList()},650)}});
document.addEventListener('change',e=>{const a=e.target.dataset.action;if(a==='job-preference'){setPreference(Number(e.target.dataset.row),e.target.value,e.target);return}if(a==='tier-mode'||a==='cl-tier-mode'){changePreviewTier(Number(e.target.dataset.row),e.target.value,a==='cl-tier-mode'?'clTier':'tier');return}if(a==='inline-status'){control(Number(e.target.dataset.row),'status',e.target.value,e.target);return}if(e.target.id==='sort'){state.sort=e.target.value;state.page=1;fetchList();return}if(e.target.id==='fresh-status'){const d=state.detail;if(d)control(d.row,'status',e.target.value,e.target);return}if(a==='bulk-select'){const row=Number(e.target.dataset.row),job=state.data?.rows.find(x=>x.row===row);
 if(e.target.checked&&job){if(state.bulk.size>=20){e.target.checked=false;toast('Select at most 20 vacancies at a time.',true);return}state.bulk.set(row,job)}else state.bulk.delete(row);
 syncSelectionBar();return}if(a==='inline-control'||a==='detail-control'){const row=a==='detail-control'?state.detail?.row:Number(e.target.dataset.row),field=e.target.dataset.field;control(row,field,e.target.checked,e.target)}});
document.addEventListener('click',async e=>{if(e.target.classList.contains('modal-back')){if(e.target.id==='garamaal-install-help'){e.target.remove();return}closeDetail();return}const x=e.target.closest('[data-action]');if(!x)return;const a=x.dataset.action,value=x.dataset.value,row=Number(x.dataset.row);if(a==='migrate-preferences'){if(!confirm('Convert existing Not Interested checkboxes into Blank / Not Interested / Favorite dropdowns in both Taaza and Freshmaal? Existing choices will be preserved.'))return;try{const r=await run('migrateJobPreferences',{confirm:true});toast(r.message);fetchStats()}catch(e){}return}if(a==='expense-close'||a==='expense-backdrop'){expenseClose();return}if(a==='expenses'){showExpenses();return}if(a==='cost-source'){showCostSource(x.dataset.candidate||state.candidate,row);return}if(a==='preference-toggle'){const job=state.detail?.row===row?state.detail:state.data?.rows?.find(j=>j.row===row);if(job)setPreference(row,nextPreferenceValue(job.preference||'',value),x);return}if(a==='install-app'){if(DEMO){toast('Install is available on the live Garamaal website.',true)}else window.__cvInstall?.();return}if(a==='nav'){nav(value);return}if(a==='candidate'){switchCandidate(value);return}if(a==='quick'){nav(value==='missing'||value==='ready'?'discovery':'fresh',value);return}if(a==='filter'){state.filter=value;state.page=1;state.bulk.clear();fetchList();return}if(a==='sort-jobs'){state.sort=value;state.page=1;fetchList();return}if(a==='category'){state.tabId=value;state.page=1;state.bulk.clear();fetchList();return}if(a==='load-more'){loadMore();return}if(a==='view-not-interested'){nav(x.dataset.source==='fresh'?'fresh':'discovery','not-interested');return}if(a==='refresh'){fetchList();return}if(a==='open-link'){openLink(x.dataset.url);return}if(a==='detail'){details(row);return}if(a==='close'){closeDetail();return}if(a==='transfer'){transfer(row);return}if(a==='run-cv-now'){runCvNow(row);return}if(a==='download-cv'){downloadCv(row);return}if(a==='download-cl'){downloadCl(row);return}if(a==='copy-prompt'){copyCvPrompt(row);return}if(a==='bulk-preference'){bulkSetPreferences(value);return}if(a==='save-jd'){saveJD();return}if(a==='save-fields'){saveFields();return}if(a==='sync-jd'){syncJD();return}});
document.addEventListener('submit',e=>{if(e.target.id==='addForm'){e.preventDefault();const mode=e.submitter?.dataset.mode||'save';saveAdd(mode)}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.querySelector('.expense-pop'))expenseClose();else if(state.detail)closeDetail()}});
window.addEventListener('resize',()=>{const size=innerWidth<721?10:25;if(state.pageSize!==size){state.pageSize=size;state.page=1;if(['discovery','fresh'].includes(state.section))fetchList()}});
async function init(){render();try{const b=await run('getBootstrap');state.bootstrap=b;if(!DEMO)toast('Connected to both Google Sheets as '+b.email);await fetchStats()}catch(e){state.initError=e.message;nav('discovery')}}
init();
if(!DEMO){
  if('serviceWorker' in navigator && location.protocol==='https:'){
    navigator.serviceWorker.register('/sw.js',{scope:'/'}).catch(()=>{});
  }
  let installEvent=null;
  const isIos=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)
    ||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const isInstalled=isAppInstalled;
  function installHelp(){
    const existing=document.getElementById('garamaal-install-help');
    if(existing){existing.remove();return;}
    const ios=isIos();
    const box=document.createElement('div');
    box.id='garamaal-install-help';
    box.className='modal-back';
    box.setAttribute('role','presentation');
    const message=ios
      ?'Open Garamaal in Safari, tap the Share icon, choose Add to Home Screen, then tap Add.'
      :'In Chrome, open the menu (⋮), choose Add to Home screen or Install app, and confirm Install.';
    box.innerHTML='<div class="install-sheet" role="dialog" aria-modal="true" aria-label="Install Garamaal">'
      +'<strong>Install Garamaal</strong>'
      +'<p>'+message+'</p>'
      +'<p>After installing, launch Garamaal from your home screen. Your Google sign-in remains protected.</p>'
      +'<button type="button" class="btn btn-primary" id="install-help-close">Got it</button></div>';
    document.body.appendChild(box);
    box.addEventListener('click',e=>{if(e.target===box)box.remove()});
    box.querySelector('#install-help-close').addEventListener('click',()=>box.remove());
  }
  async function requestInstall(){
    if(!installEvent){installHelp();return;}
    const event=installEvent;installEvent=null;
    try{
      await event.prompt();
      const choice=await event.userChoice;
      if(choice?.outcome!=='accepted')installHelp();
    }catch(_){installHelp();}
    showInstall();
  }
  function showInstall(){
    const installed=isInstalled();
    // On phones the install control lives above bottom navigation, not in
    // the crowded account header. This prevents side overflow/blank gutters.
    const mobile=window.matchMedia('(max-width:720px)').matches;
    const top=document.querySelector('.top-actions');
    let dock=document.getElementById('garamaal-install-dock');
    if(!dock){
      dock=document.createElement('div');
      dock.id='garamaal-install-dock';
      document.body.appendChild(dock);
    }
    const parent=mobile?dock:top;
    let btn=document.getElementById('cv-install-app');
    if(!btn&&parent){
      btn=document.createElement('button');
      btn.id='cv-install-app';btn.type='button';
      btn.textContent='Install app';
      btn.title='Install Garamaal on your phone or desktop';
      btn.addEventListener('click',requestInstall);
    }
    if(btn && parent && btn.parentNode!==parent){
      if(mobile)parent.appendChild(btn);
      else{
        const toggle=document.getElementById('candidateToggle');
        parent.insertBefore(btn,toggle||parent.firstChild);
      }
    }
    if(btn)btn.hidden=installed || state.section==='dashboard';
    if(dock)dock.hidden=installed || !mobile || state.section==='dashboard';
  }
  window.__cvInstall=requestInstall;
  window.__cvInstallUI=showInstall;
  window.addEventListener('beforeinstallprompt',event=>{
    event.preventDefault();installEvent=event;showInstall();
  });
  window.addEventListener('appinstalled',()=>{
    installEvent=null;
    if(state.section==='dashboard')render();
    showInstall();
  });
  showInstall();
  window.addEventListener('resize',showInstall);
  setTimeout(pollCvQueue,1200);
  setInterval(()=>{if(!document.hidden)pollCvQueue()},15000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)pollCvQueue()});
}
</script>
