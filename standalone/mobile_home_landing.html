<!-- Garamaal Stage 1 mobile launcher; intentionally an additive shell.
     All existing Jobs and Social views stay in their unchanged source files. -->
<section id="gmv3-launch" class="gmv3-launch" aria-label="Garamaal start screen">
  <header class="gmv3-head">
    <span class="gmv3-wordmark">GARAMAAL<span class="gmv3-dot">.</span></span>
    <button class="gmv3-avatar" type="button" data-gmv3="drawer" aria-label="Open account drawer"><span id="gmv3-initial">A</span></button>
  </header>
  <div class="gmv3-scroll">
    <div class="gmv3-hero">
      <p class="gmv3-eyebrow">YOUR CAREER CONTROL CENTRE</p>
      <h1>What do<br>you want<br>to do <em>today?</em></h1>
      <div class="gmv3-pills" role="group" aria-label="Quick progress">
        <button type="button" data-gmv3="targets">◎ <span>Targets</span></button>
        <button type="button" data-gmv3="reminders">◷ <span>Reminders</span></button>
      </div>
    </div>
    <div class="gmv3-cards" role="group" aria-label="Choose your next action">
      <button class="gmv3-action gm-lime" type="button" data-gmv3="profile">
        <span class="gmv3-symbol" aria-hidden="true">◉</span>
        <span class="gmv3-copy"><strong>Update profile</strong><small>Build your career story</small></span>
        <span class="gmv3-artwork gmv3-art-profile" aria-hidden="true"></span>
      </button>
      <button class="gmv3-action gm-white" type="button" data-gmv3="jobs">
        <span class="gmv3-symbol" aria-hidden="true">↗</span>
        <span class="gmv3-copy"><strong>Apply jobs</strong><small>Discovery, Make CV, Add Job</small></span>
        <span class="gmv3-artwork gmv3-art-jobs" aria-hidden="true"></span>
      </button>
      <button class="gmv3-action gm-purple" type="button" data-gmv3="network">
        <span class="gmv3-symbol" aria-hidden="true">⇄</span>
        <span class="gmv3-copy"><strong>Network</strong><small>Research, Swipe & Connect</small></span>
        <span class="gmv3-artwork gmv3-art-network" aria-hidden="true"></span>
      </button>
      <button class="gmv3-action gm-white" type="button" data-gmv3="statistics">
        <span class="gmv3-symbol" aria-hidden="true">▥</span>
        <span class="gmv3-copy"><strong>Statistics</strong><small>See progress and priorities</small></span>
        <span class="gmv3-artwork gmv3-art-stats" aria-hidden="true"></span>
      </button>
    </div>
    <button type="button" class="gmv3-journey" data-gmv3="jobs">
      <span>START YOUR<br>JOURNEY</span><span aria-hidden="true">⟶</span>
    </button>
    <p class="gmv3-footnote">Stage 1 UI preview · Original Jobs and Social functions preserved</p>
  </div>
  <div class="gmv3-subview" id="gmv3-subview" hidden>
    <div class="gmv3-subbar"><button type="button" data-gmv3="home" aria-label="Back to launch screen">‹</button><strong id="gmv3-subtitle">Overview</strong><span></span></div>
    <div id="gmv3-subbody" class="gmv3-subbody" aria-live="polite"></div>
  </div>
</section>
