name: standalone-migration-parity-tests

on:
  push:
    branches:
      - migration/standalone-google-auth-no-appscript
    paths:
      - 'standalone/**'
      - 'webapp/**'
      - 'Dockerfile'
      - 'Dockerfile.standalone'
      - 'package.json'
      - '.github/workflows/standalone-parity-tests.yml'
  pull_request:
    paths:
      - 'standalone/**'
      - 'webapp/**'
      - 'Dockerfile'
      - 'Dockerfile.standalone'
      - 'package.json'

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify standalone release scripts
        run: bash -n standalone/deploy.sh standalone/deploy-staging.sh standalone/cutover-live.sh standalone/enable-run-cv-now.sh standalone/deploy-live-update.sh standalone/deploy-social-readonly.sh standalone/deploy-social-hosting-only.sh
      - name: Verify standalone JS syntax
        run: |
          node --check standalone/sheets.js
          node --check standalone/runtime.js
          node --check standalone/server.js
          node --check standalone/queue.js
          node --check standalone/bridge.js
          node --check standalone/social_store.js
          node --check standalone/social_server.js
          node --check standalone/social_research.js
          bash -n standalone/deploy-social-update-guarded.sh
          bash -n standalone/deploy-jobs-social-button-overlay.sh
          bash -n standalone/deploy-social-editable-guarded.sh
      - name: Test existing and migrated app logic (no API calls)
        run: |
          npm test
          node webapp/tests/not_interested.test.js
      - name: Resolve production dependency tree for deployability
        run: npm install --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Validate both photo icons decode into PNG before packaging
        run: |
          node - <<'JS'
          const sharp=require('sharp');
          (async()=>{
            for (const size of [192,512]){
              const f='standalone/pwa/garamaal-icon-192.jpg';
              const image=sharp(f,{failOn:'error'});
              const result=await image.resize(size,size).png().toBuffer({resolveWithObject:true});
              if(result.info.width!==size||result.info.height!==size)
                throw Error(f+' dimensions are incorrect');
              console.log(f+' verified as decodable '+size+'x'+size+' image');
            }
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - name: Build isolated Cloud Run container (no cloud credentials, no API costs)
        run: docker build -f Dockerfile.standalone -t cv-standalone-test:ci .
      - name: Build independent Social-only container (Jobs files excluded)
        run: docker build -f Dockerfile.social -t garamaal-social-test:ci .
      - name: Smoke test Social service routes and verify Jobs endpoints are absent
        run: |
          set -euo pipefail
          docker run -d --rm --name garamaal-social-smoke -p 127.0.0.1:18082:8080             -e GOOGLE_CLOUD_PROJECT=abhishek-cv-automation             garamaal-social-test:ci
          trap 'docker logs garamaal-social-smoke || true; docker rm -f garamaal-social-smoke || true' EXIT
          for attempt in {1..25}; do
            if curl -fsS http://127.0.0.1:18082/health > /tmp/social-health.json; then break; fi
            sleep 1
          done
          python3 - <<'PY'
          import json
          x=json.load(open("/tmp/social-health.json",encoding="utf-8"))
          assert x["ok"] is True
          assert x["service"]=="garamaal-social"
          assert x["readOnly"] is True,"Social must start read-only"
          PY
          curl -fsS http://127.0.0.1:18082/social -o /tmp/social-ui.html
          curl -fsS http://127.0.0.1:18082/social/bridge.js -o /tmp/social-bridge.js
          grep -q 'Research Inbox' /tmp/social-ui.html
          for url in / /api/listJobs /api/getCvQueue /api/download; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:18082${url}")"
            test "$code" = 404 || { echo "Unexpected Jobs route: $url -> $code"; exit 1; }
          done
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"candidate":"Abhishek"}' http://127.0.0.1:18082/api/social/data)"
          test "$code" = 401 || { echo "Social API must reject unsigned requests: $code"; exit 1; }
      - name: Smoke test container health and block unauthenticated API access
        run: |
          set -euo pipefail
          docker run -d --rm --name cv-standalone-smoke -p 127.0.0.1:18081:8080 cv-standalone-test:ci
          trap 'docker logs cv-standalone-smoke || true; docker rm -f cv-standalone-smoke || true' EXIT
          for attempt in {1..25}; do
            if curl -fsS http://127.0.0.1:18081/health > /tmp/health.json; then break; fi
            sleep 1
          done
          python - <<'PY'
          import json
          x = json.load(open('/tmp/health.json', encoding='utf8'))
          assert x['ok'] is True
          assert x['readOnly'] is True, 'Pilot must not permit writes'
          PY
          status="$(curl -s -o /tmp/unauthorized.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"arg":{}}' http://127.0.0.1:18081/api/listJobs)"
          test "$status" = 401
