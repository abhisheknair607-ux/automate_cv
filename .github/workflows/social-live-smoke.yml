name: social-live-public-smoke
on:
  push:
    branches:
      - test/social-live-smoke-20261019
    paths:
      - 'standalone/test/live_social_smoke.py'
      - '.github/workflows/social-live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate script syntax
        run: python -m py_compile standalone/test/live_social_smoke.py
      - name: Test deployed Firebase Hosting and Social Cloud Run publicly
        run: python standalone/test/live_social_smoke.py
