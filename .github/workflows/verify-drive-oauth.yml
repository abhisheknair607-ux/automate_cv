name: verify-drive-oauth

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-drive-oauth.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install Google API dependencies
        run: python -m pip install --disable-pip-version-check --quiet google-api-python-client google-auth google-auth-httplib2

      - name: Validate Google user OAuth and Drive output folder (read-only)
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          DRIVE_OUTPUT_FOLDER_ID: ${{ vars.DRIVE_OUTPUT_FOLDER_ID }}
          PROMPT1_FILE_ID: ${{ vars.PROMPT1_FILE_ID }}
          SUMMARY_DOC_FILE_ID: ${{ vars.SUMMARY_DOC_FILE_ID }}
        run: |
          python - <<'PY'
          import os, sys
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          required = ('GOOGLE_OAUTH_CLIENT_ID','GOOGLE_OAUTH_CLIENT_SECRET',
                      'GOOGLE_OAUTH_REFRESH_TOKEN','DRIVE_OUTPUT_FOLDER_ID')
          absent = [name for name in required if not os.getenv(name)]
          if absent:
              sys.exit('MISSING_CONFIG: ' + ', '.join(absent))
          credential = Credentials(
              token=None,
              refresh_token=os.environ['GOOGLE_OAUTH_REFRESH_TOKEN'],
              token_uri='https://oauth2.googleapis.com/token',
              client_id=os.environ['GOOGLE_OAUTH_CLIENT_ID'],
              client_secret=os.environ['GOOGLE_OAUTH_CLIENT_SECRET'],
              scopes=['https://www.googleapis.com/auth/drive'],
          )
          try:
              credential.refresh(Request())
          except Exception as err:
              # The oauth library puts Google's sanitized error code in a dict.
              # Never echo the exception message, OAuth token or client credentials.
              data = next((v for v in getattr(err, 'args', ()) if isinstance(v, dict)), {})
              reason = str(data.get('error', 'unknown')).lower()
              known = {
                  'invalid_grant': 'Revoked/expired token or authorization issued to another OAuth client.',
                  'invalid_client': 'Google OAuth client ID or client secret is incorrect.',
                  'invalid_scope': 'The refresh-token OAuth grant does not authorize requested scopes.',
                  'unauthorized_client': 'OAuth client is not authorized for this grant.',
                  'access_denied': 'Google account denied authorization.',
                  'invalid_request': 'Google rejected an OAuth token request parameter.',
              }
              if reason in known:
                  sys.exit('OAUTH_' + reason.upper() + ': ' + known[reason])
              sys.exit('OAUTH_REFRESH_FAILED: Provider error code=' +
                       (reason if reason.isidentifier() and len(reason) <= 40 else 'unknown'))
          print('OAUTH_REFRESH_OK (user credential, no OpenAI calls)')
          api = build('drive','v3',credentials=credential,cache_discovery=False)
          try:
              folder = api.files().get(
                  fileId=os.environ['DRIVE_OUTPUT_FOLDER_ID'],
                  fields='id,name,mimeType,capabilities(canAddChildren)',
                  supportsAllDrives=True,
              ).execute()
          except Exception as err:
              code = getattr(getattr(err,'resp',None),'status',None)
              sys.exit('DRIVE_FOLDER_ACCESS_FAILED: HTTP ' + str(code) + ' (check Drive owner/account and sharing)')
          if folder.get('mimeType') != 'application/vnd.google-apps.folder':
              sys.exit('OUTPUT_FOLDER_INVALID: Configured output ID is not a folder')
          if folder.get('capabilities',{}).get('canAddChildren') is not True:
              sys.exit('OUTPUT_FOLDER_NOT_WRITABLE: OAuth user cannot add children to output folder')
          print('DRIVE_FOLDER_WRITABLE (checked via Drive capabilities; no files created)')
          for label, key in [('PROMPT1','PROMPT1_FILE_ID'),('SUMMARY','SUMMARY_DOC_FILE_ID')]:
              file_id = os.getenv(key)
              if not file_id:
                  print(label + '_ID_NOT_SET')
                  continue
              try:
                  api.files().get(fileId=file_id,fields='id,name',supportsAllDrives=True).execute()
              except Exception as err:
                  code = getattr(getattr(err,'resp',None),'status',None)
                  sys.exit(label + '_SOURCE_ACCESS_FAILED: HTTP ' + str(code))
              print(label + '_SOURCE_ACCESS_OK')
          print('GOOGLE_DRIVE_PREFLIGHT_OK: No files changed; no OpenAI requests made.')
          PY
