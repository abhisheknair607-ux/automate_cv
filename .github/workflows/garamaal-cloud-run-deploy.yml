name: Garamaal guarded Cloud Run deployment
run-name: Deploy Garamaal ${{ github.sha }}
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: garamaal-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Ensure main is the intended release branch
        shell: bash
        run: |
          test "${GITHUB_REF}" = refs/heads/main
          test -f standalone/copper_porcelain.css
          grep -Fq 'copper-porcelain.css?v=1' standalone/server.js
      - name: Validate existing Workload Identity configuration
        shell: bash
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$WIF_PROVIDER" || { echo "::error::Repository or production environment variable GCP_WORKLOAD_IDENTITY_PROVIDER is missing"; exit 1; }
          test -n "$WIF_SERVICE_ACCOUNT" || { echo "::error::Repository or production environment variable GCP_SERVICE_ACCOUNT is missing"; exit 1; }
          echo "Existing Workload Identity variables are configured."
      - name: Authenticate to Google Cloud without service account keys
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Install Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
      - name: Guarded production rollout (0% canary, smoke checks, rollback)
        shell: bash
        run: bash standalone/deploy-garamaal-production.sh --plan && bash standalone/deploy-garamaal-production.sh --release
      - name: Verify Copper & Porcelain theme on live endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 45 'https://garamaal.web.app/prototype' -o /tmp/garamaal-prototype.html
          grep -Fq '/prototype/copper-porcelain.css?v=1' /tmp/garamaal-prototype.html
          curl -fsSL --retry 3 --max-time 45 'https://garamaal.web.app/prototype/copper-porcelain.css' -o /tmp/garamaal-theme.css
          grep -Fq -- '--gm-copper:#a94f34' /tmp/garamaal-theme.css
