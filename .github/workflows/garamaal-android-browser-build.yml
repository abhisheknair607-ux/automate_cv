name: Garamaal Android browser MVP
on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/android/**"
      - ".github/workflows/garamaal-android-browser-build.yml"
  pull_request:
    paths:
      - "mobile/android/**"
      - ".github/workflows/garamaal-android-browser-build.yml"
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Check browser extraction and PWA integration
        run: |
          node --check standalone/server.js
          node --test standalone/test/mobile_capture_handoff.test.js
      - name: Build Android test APK
        working-directory: mobile/android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: garamaal-browser-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
