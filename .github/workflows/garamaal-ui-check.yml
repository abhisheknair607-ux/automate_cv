name: Garamaal UI integration safety
on:
  pull_request:
    paths: ["standalone/**", "garamaal-release-webapp/**", "Dockerfile.garamaal-ui", "package.json", ".github/workflows/garamaal-ui-check.yml"]
  push:
    branches: [main]
    paths: ["standalone/**", "garamaal-release-webapp/**", "Dockerfile.garamaal-ui", "package.json", ".github/workflows/garamaal-ui-check.yml"]
permissions:
  contents: read
jobs:
  protect-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Protect CV worker and original Dashboard; allow reviewed Taaza modules only
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD^ HEAD -- Dockerfile prompts requirements.txt webapp/Code.gs webapp/Index.html
          # Only the specifically reviewed Taaza integration modules may
          # differ from main. Every other Python worker source stays protected.
          unapproved="$(git diff --name-only HEAD^ HEAD -- src | grep -Ev '^src/automate_cv/(job_alert_providers|job_dedupe|linkedin_alert_import|taaza_dedupe_audit|taaza_duplicate_proposals|taaza_sync|jd_recovery)\.py$' || true)"
          if [[ -n "$unapproved" ]]; then
            echo "Unexpected Python/CV source changes are not permitted:"
            printf '%s\n' "$unapproved"
            exit 1
          fi
  standalone-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test production UI webapp snapshot alongside standalone code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/garamaal-ui-test
          cp -R standalone /tmp/garamaal-ui-test/standalone
          cp -R garamaal-release-webapp /tmp/garamaal-ui-test/webapp
          cp package.json /tmp/garamaal-ui-test/package.json
          cp Dockerfile.garamaal-ui /tmp/garamaal-ui-test/Dockerfile.standalone
          cd /tmp/garamaal-ui-test
          node --check standalone/server.js
          node --check standalone/mobile_jobs_filters_stats.js
          node --check standalone/mobile_jobs_swipe.js
          node --check standalone/swipe_progress.js
          node --test \
            standalone/test/parity.test.js \
            standalone/test/stage3_candidate_progress.test.js \
            standalone/test/stage3_ribbon_drawer.test.js \
            standalone/test/stage13_live_bulk.test.js \
            standalone/test/stage14_location_filters.test.js \
            standalone/test/stage15_multifacet.test.js \
            standalone/test/stage17_production_gate.test.js \
            standalone/test/tactile_hold_state.test.js \
            standalone/test/live_swipe.test.js \
            standalone/test/pwa_swipe_dashboard_repair.test.js \
            standalone/test/swipe_full_cv_controls.test.js
      - name: Build actual Cloud Run image from a restrictive temporary release bundle
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          build_dir="$(mktemp -d)"
          trap 'rm -rf "$build_dir"' EXIT
          cp Dockerfile.garamaal-ui "$build_dir/Dockerfile"
          cp package.json "$build_dir/package.json"
          cp -R standalone "$build_dir/standalone"
          cp -R garamaal-release-webapp "$build_dir/garamaal-release-webapp"
          # Simulate the source modes that caused Cloud Run revision 00063-bib to crash.
          chmod -R go-rwx "$build_dir"
          test "$(stat -c '%a' "$build_dir/standalone/server.js")" = "600"
          docker build --file "$build_dir/Dockerfile" --tag garamaal-ui:ci "$build_dir"
      - name: Smoke test the actual Cloud Run container entrypoint
        shell: bash
        run: |
          set -euo pipefail
          container="garamaal-beta-smoke-ci"
          docker run --detach --rm --name "$container" -p 127.0.0.1:18765:8080 \
            -e PORT=8080 \
            -e GOOGLE_CLOUD_PROJECT=abhishek-cv-automation \
            -e APP_READ_ONLY=false \
            -e APP_ALLOW_PRODUCTION_WRITES=true \
            -e ALLOW_MANUAL_CV_DISPATCH=true \
            -e ALLOWED_EMAILS=abhisheknair607@gmail.com \
            -e GARAMAAL_PROFILE_BETA_ENABLED=true \
            -e GARAMAAL_PROFILE_BETA_DATA_SCOPE=staging \
            -e GARAMAAL_PROFILE_BETA_EMAIL=abhisheknair607@gmail.com \
            garamaal-ui:ci
          trap 'docker logs "$container" 2>&1 | tail -80; docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          ok=0
          for i in $(seq 1 20); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:18765/health > /tmp/garamaal-smoke-health.json; then
              ok=1; break
            fi
            sleep 1
          done
          if test "$ok" != 1; then
            echo "Container did not start; printed Node startup logs:" >&2
            exit 1
          fi
          python3 -c 'import json; h=json.load(open("/tmp/garamaal-smoke-health.json")); assert h["ok"] and h["readOnly"] is False'
          curl --fail --silent --max-time 5 http://127.0.0.1:18765/prototype | grep -Fq '/prototype/profile-beta-ui.js?v=sitebeta2'

