name: taaza-dedupe-check

# Manual, READ-ONLY duplicate scan of existing Taaza Jobs.
# Only metadata and read-only values methods; no cleanup and no cron.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: taaza-master-writers
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Sheets read-only client
        run: pip install --quiet google-api-python-client google-auth google-auth-httplib2
      - name: Check existing Taaza duplicates without changing the workbook
        env:
          TAAZA_SPREADSHEET_ID: 1jt3WXqpnzVOYcKCpABIp-7UMUPr48kVhMkLfzGEHHZY
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: PYTHONPATH=src python -m automate_cv.taaza_dedupe_audit --live
