name: taaza-dedupe-check

# Manual, READ-ONLY duplicate scan of existing Taaza Jobs.
# Only metadata and read-only values methods; no cleanup and no cron.
on:
  workflow_dispatch:
    inputs:
      apply_statuses:
        description: 'Write reviewed duplicate status proposals to Q only (no deletions)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: taaza-master-writers
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Sheets read-only client
        run: pip install --quiet google-api-python-client google-auth google-auth-httplib2
      - name: Check protected Taaza duplicate proposals (read-only by default)
        env:
          TAAZA_SPREADSHEET_ID: 1jt3WXqpnzVOYcKCpABIp-7UMUPr48kVhMkLfzGEHHZY
          GARAMAAL_DEDUPE_STATUS_APPROVED: ${{ vars.GARAMAAL_DEDUPE_STATUS_APPROVED }}
          APPLY_STATUSES: ${{ inputs.apply_statuses }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: |
          args=()
          if [[ "$APPLY_STATUSES" == "true" ]]; then
            if [[ "$GARAMAAL_DEDUPE_STATUS_APPROVED" != "true" ]]; then
              echo "Duplicate status writes are still approval-locked." >&2
              exit 1
            fi
            args+=(--apply-statuses)
          fi
          PYTHONPATH=src python -m automate_cv.taaza_duplicate_proposals "${args[@]}"
