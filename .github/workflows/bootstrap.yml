name: bootstrap-repository

on:
  push:
    paths:
      - 'bootstrap/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct repository payload
        run: |
          cat bootstrap/part_* > /tmp/payload.b64
          base64 -d /tmp/payload.b64 > /tmp/payload.tar.gz
          tar -xzf /tmp/payload.tar.gz -C .
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap.yml
      - name: Commit generated repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Build Freshmal CV automation'
          git push
