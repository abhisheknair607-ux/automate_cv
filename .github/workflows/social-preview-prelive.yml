name: Social preview routes before live Hosting release (read-only)
on:
  push:
    branches: ['diagnostics/social-preview-prelive-20261018']
    paths: ['.github/workflows/social-preview-prelive.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check preview Social API, UI and protected Jobs HTML (no writes)
        run: |
          python3 - <<'PY'
          import hashlib,json,sys,urllib.error,urllib.request
          root="https://garamaal.web.app"
          preview="https://garamaal--social-preview-gthohwx8.web.app"
          def get(base,path,method="GET",body=None):
            req=urllib.request.Request(base+path,method=method,data=body,headers={"User-Agent":"Garamaal-Social-Preview-ReadOnly/1.0", "Content-Type":"application/json"})
            try:
              with urllib.request.urlopen(req,timeout=22) as r:return r.status,r.read(2500000)
            except urllib.error.HTTPError as e:return e.code,e.read(10000)
          main_status,main=get(root,"/")
          prev_status,prev=get(preview,"/")
          social_status,social=get(preview,"/social")
          bridge_status,bridge=get(preview,"/social/bridge.js")
          auth_status,auth=get(preview,"/api/social/data","POST",b'{"candidate":"Abhishek"}')
          config_status,config=get(preview,"/config")
          live_social_status,_=get(root,"/social")
          def result(name,status,data=None):
            print("PROBE",name,"HTTP",status,"BYTES",len(data) if data else 0)
          for args in [
            ("LIVE_JOBS_ROOT",main_status,main),("PREVIEW_JOBS_ROOT",prev_status,prev),
            ("PREVIEW_SOCIAL_PAGE",social_status,social),("PREVIEW_SOCIAL_BRIDGE",bridge_status,bridge),
            ("PREVIEW_SOCIAL_NOAUTH",auth_status,auth),("PREVIEW_FIREBASE_CONFIG",config_status,config),
            ("LIVE_SOCIAL_PAGE",live_social_status,None),
          ]:result(*args)
          print("LIVE_JOBS_SHA256",hashlib.sha256(main).hexdigest())
          print("PREVIEW_JOBS_SHA256",hashlib.sha256(prev).hexdigest())
          checks={
            "jobs_root_http_200":main_status==200 and prev_status==200,
            "jobs_root_byte_identical":main==prev,
            "social_html_valid":social_status==200 and b"Research Inbox" in social and b"/social/bridge.js" in social,
            "social_bridge_loaded":bridge_status==200 and b"requestSpecial" in bridge,
            "noauth_social_api_rejected":auth_status==401,
            "existing_jobs_firebase_config_available":config_status==200 and b"apiKey" in config,
            "live_social_not_yet_deployed":live_social_status==404,
          }
          for k,v in checks.items():print("CHECK",k,"PASS" if v else "FAIL")
          if not all(checks.values()):
            print("PREVIEW_NOT_READY: do not deploy live Firebase Hosting")
            sys.exit(1)
          print("PREVIEW_READY_FOR_MANUAL_LIVE_HOSTING_RELEASE")
          PY
