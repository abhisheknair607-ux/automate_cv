name: garamaal-stage5-canary-preflight
on:
  push:
    branches:
      - release/taaza-stage5-canary-20261026
  pull_request:
    paths:
      - standalone/deploy-stage5-canary.sh
      - tests/test_stage5_canary_release.py
      - docs/GARAMAAL_STAGE5_RELEASE.md
      - .github/workflows/taaza-stage5-canary-preflight.yml
      - .github/workflows/taaza-stage5-approved-canary.yml
      - docs/taaza-stage5-canary-trigger-20261026.txt
permissions:
  contents: read
jobs:
  inspect-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail if Stage 5 unexpectedly changes CV worker or live UI
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only origin/main...HEAD)"
          if [[ -z "$changed" ]]; then exit 1; fi
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(standalone/deploy-stage5-canary\.sh|tests/test_stage5_canary_release\.py|docs/GARAMAAL_STAGE5_RELEASE\.md|\.github/workflows/taaza-stage5-canary-preflight\.yml|\.github/workflows/taaza-stage5-approved-canary\.yml|docs/taaza-stage5-canary-trigger-20261026\.txt)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Stage 5 release cannot change CV worker or production UI sources:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
      - name: Check script syntax (does not deploy)
        run: bash -n standalone/deploy-stage5-canary.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pytest
      - name: Test read-only plan and zero-traffic enforcement
        run: python -m pytest -q tests/test_stage5_canary_release.py
      - name: Check correct paired Garamaal UI container builds
        run: docker build --file Dockerfile.garamaal-ui --tag garamaal-stage5qa:ci .
