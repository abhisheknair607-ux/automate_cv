name: Release Garamaal manual controls
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-import-controls.yml
  workflow_dispatch:
    inputs:
      confirm:
        description: Type ACTIVATE_MANUAL_CONTROLS to re-run production release
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: garamaal-production-jobs-release
  cancel-in-progress: false
jobs:
  preflight:
    if: ${{ github.event_name == 'push' || inputs.confirm == 'ACTIVATE_MANUAL_CONTROLS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check new manual JD recovery integration before any deployment
        shell: bash
        run: |
          set -euo pipefail
          node --check standalone/server.js
          node --check standalone/bridge.js
          node --check standalone/jd_recovery_workflows.js
          node --test standalone/test/jd_recovery_manual_control.test.js standalone/test/jd_recovery_smart_sort.test.js standalone/test/bulk_select_25.test.js
          grep -Fq 'data-action="jd-recovery-run"' garamaal-release-webapp/Index.html
          if grep -Eq '^[[:space:]]+schedule:' .github/workflows/jd-recovery.yml; then
            echo "JD recovery must never run from a scheduler" >&2
            exit 1
          fi
  deploy:
    needs: preflight
    if: ${{ github.event_name == 'push' || inputs.confirm == 'ACTIVATE_MANUAL_CONTROLS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
      - name: Validate release safeguards
        run: bash standalone/deploy-import-controls.sh --plan
      - name: Deploy and verify Jobs production with canary and automatic rollback
        run: bash standalone/deploy-import-controls.sh --release
