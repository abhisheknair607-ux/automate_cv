name: Activate Garamaal manual alert controls
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-import-controls.yml
  workflow_dispatch:
    inputs:
      confirm:
        description: Type ACTIVATE_MANUAL_CONTROLS to re-run production release
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: garamaal-production-jobs-release
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.event_name == 'push' || inputs.confirm == 'ACTIVATE_MANUAL_CONTROLS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
      - name: Validate release safeguards
        run: bash standalone/deploy-import-controls.sh --plan
      - name: Deploy and verify Jobs production with canary and automatic rollback
        run: bash standalone/deploy-import-controls.sh --release
