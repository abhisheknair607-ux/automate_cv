name: taaza-one-time-imported-alerts-master-sync
on:
  push:
    branches:
      - release/taaza-sync-imported-alerts-20261026
    paths:
      - docs/taaza-imported-alerts-sync-approved-20261026.txt

permissions:
  contents: read
  id-token: write

concurrency:
  group: taaza-master-writers
  cancel-in-progress: false

jobs:
  run-existing-master-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify one-time approved trigger
        run: |
          set -euo pipefail
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = "docs/taaza-imported-alerts-sync-approved-20261026.txt"
          grep -Fxq "Approved single Taaza master sync for validated Email Alerts jobs only" docs/taaza-imported-alerts-sync-approved-20261026.txt
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing sync dependencies
        run: python -m pip install --quiet google-api-python-client google-auth google-auth-httplib2
      - name: Run existing idempotent Taaza regional-to-master sync
        env:
          TAAZA_SPREADSHEET_ID: 1jt3WXqpnzVOYcKCpABIp-7UMUPr48kVhMkLfzGEHHZY
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: python -m src.automate_cv.taaza_sync
