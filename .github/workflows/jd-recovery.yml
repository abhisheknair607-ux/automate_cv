name: JD recovery (manual only)
run-name: "JD Recovery · manual · up to ${{ inputs.limit }} jobs"
# The Discovery button is the only automatic entry point. Never schedule runs.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write verified full JDs (requires separate live approval)"
        type: boolean
        default: false
      approval:
        description: "Explicit manual write confirmation"
        required: false
        type: string
      limit:
        description: "Maximum shortlist per run"
        type: choice
        options: ["10", "25", "50"]
        default: "25"

permissions:
  contents: read
  id-token: write

concurrency:
  group: taaza-master-writers
  cancel-in-progress: false

jobs:
  recover:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public-fetch and Google Sheets dependencies
        run: python -m pip install --disable-pip-version-check --quiet httpx google-api-python-client google-auth google-auth-httplib2
      - name: Preview or separately approved transfer
        env:
          REQUEST_APPROVAL: ${{ inputs.approval }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          TAAZA_SPREADSHEET_ID: 1jt3WXqpnzVOYcKCpABIp-7UMUPr48kVhMkLfzGEHHZY
          FRESHMAL_SPREADSHEET_ID: 1ltT1gPFcpBdz1Wp_CuxkwFpfkwnnhjL316yVu3gxPCc
          EVENT_KIND: ${{ github.event_name }}
          REQUEST_APPLY: ${{ inputs.apply }}
          REQUEST_LIMIT: ${{ inputs.limit }}
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(--limit "25")
          if [[ "$EVENT_KIND" == "workflow_dispatch" && -n "$REQUEST_LIMIT" ]]; then
            ARGS=(--limit "$REQUEST_LIMIT")
          fi
          if [[ "$REQUEST_APPLY" == "true" ]]; then
            if [[ "$REQUEST_APPROVAL" != "RECOVER_VERIFIED_JD" ]]; then
              echo "::error::Manual write confirmation is required. No Sheets modifications."
              exit 1
            fi
            # The control server requires its OWN authenticated and enabled gates.
            export GARAMAAL_JD_RECOVERY_APPROVED=true
            ARGS+=(--apply)
          fi
          PYTHONPATH=src python -m automate_cv.jd_recovery "${ARGS[@]}"
