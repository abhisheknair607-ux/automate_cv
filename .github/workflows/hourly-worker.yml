name: hourly-cv-worker

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  worker:
    # Safe by default. Set repository variable AUTOMATION_ENABLED=true only
    # after API + Google credentials are configured and a dry run is complete.
    if: ${{ vars.AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: freshmal-hourly-worker
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-writer fonts-crosextra-carlito
      - run: pip install -r requirements.txt
      - name: Run Freshmal worker
        env:
          PYTHONPATH: src
          AUTOMATION_ENABLED: 'true'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-sol' }}
          OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT || 'medium' }}

          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

          FRESHMAL_SPREADSHEET_ID: ${{ vars.FRESHMAL_SPREADSHEET_ID || '1ltT1gPFcpBdz1Wp_CuxkwFpfkwnnhjL316yVu3gxPCc' }}
          FRESHMAL_SHEET_NAME: ${{ vars.FRESHMAL_SHEET_NAME || 'Sheet1' }}
          PROMPT1_FILE_ID: ${{ vars.PROMPT1_FILE_ID || '1MgNyy2qT__pcpWKNMkyMro81dHq0Wjr7' }}
          PROMPT2_FILE_ID: ${{ vars.PROMPT2_FILE_ID || '1artaIzFwznf3e6gi9gBrenP3EDhaqgrl' }}
          PROMPT3_FILE_ID: ${{ vars.PROMPT3_FILE_ID || '1RcISGnDHMqN0-7pSZlNUf5bxEgrCmsf0' }}
          DRIVE_OUTPUT_FOLDER_ID: ${{ vars.DRIVE_OUTPUT_FOLDER_ID || '1cGr5kUXgy_43NY9IINdpdT0OXY9NoBXF' }}

          SUMMARY_DOC_FILE_ID: ${{ vars.SUMMARY_DOC_FILE_ID || '1B6e8GKtUcZKjHtB6lzHRjZxcZQPW6d67' }}
          CV_FORMATTING_MASTER_FILE_ID: ${{ vars.CV_FORMATTING_MASTER_FILE_ID || '1GScLrTOXRcf6_dfdgVnFaAdzpOUVmySH' }}
          BASE_CV_FILE_ID: ${{ vars.BASE_CV_FILE_ID || '1jSEPPMgTLeU3LwrJVHCYCSVJ6KX_Tngr' }}
          HIGH_EXPERIENCE_REFERENCE_FILE_ID: ${{ vars.HIGH_EXPERIENCE_REFERENCE_FILE_ID || '1RXD7DBjYGnGO54SCkUJAEBY5zazMlvK5' }}
          LOWER_EXPERIENCE_REFERENCE_FILE_ID: ${{ vars.LOWER_EXPERIENCE_REFERENCE_FILE_ID || '1WNTfLU8SYKYOLVEl6xJn8zzo_RsNCup5' }}
          CV_COVER_LETTER_RULES_FILE_ID: ${{ vars.CV_COVER_LETTER_RULES_FILE_ID || '1lWexhNPCXdShRKKimBqSddnfGs23xz8t' }}
          COVER_LETTER_TEMPLATE_FILE_ID: ${{ vars.COVER_LETTER_TEMPLATE_FILE_ID }}
          FINAL_PROJECTS_FOLDER_ID: ${{ vars.FINAL_PROJECTS_FOLDER_ID || '1iL6KcU9sS8dP07rVYMld_Ennv9fA0zgS' }}
          PROJECTS_FOLDER_ID: ${{ vars.PROJECTS_FOLDER_ID || '1Bkaus-YAmSlzKWY8P57medj1Fh0D3ZwI' }}

          MAX_APPLICATIONS_PER_RUN: ${{ vars.MAX_APPLICATIONS_PER_RUN || '5' }}
          MAX_RETRIES: ${{ vars.MAX_RETRIES || '2' }}
          COST_HARD_STOP_USD: ${{ vars.COST_HARD_STOP_USD || '1.75' }}
        run: python -m automate_cv.runner
