name: hourly-cv-worker
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
jobs:
  worker:
    if: ${{ vars.AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-writer fonts-crosextra-carlito
      - run: pip install -r requirements.txt
      - name: Run Freshmal worker
        env:
          PYTHONPATH: src
          AUTOMATION_ENABLED: 'true'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-sol' }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          FRESHMAL_SPREADSHEET_ID: ${{ vars.FRESHMAL_SPREADSHEET_ID }}
          FRESHMAL_SHEET_NAME: ${{ vars.FRESHMAL_SHEET_NAME || 'Sheet1' }}
          PROMPT1_FILE_ID: ${{ vars.PROMPT1_FILE_ID }}
          PROMPT2_FILE_ID: ${{ vars.PROMPT2_FILE_ID }}
          PROMPT3_FILE_ID: ${{ vars.PROMPT3_FILE_ID }}
          DRIVE_OUTPUT_FOLDER_ID: ${{ vars.DRIVE_OUTPUT_FOLDER_ID }}
          SUMMARY_DOC_FILE_ID: ${{ vars.SUMMARY_DOC_FILE_ID }}
          CV_FORMATTING_MASTER_FILE_ID: ${{ vars.CV_FORMATTING_MASTER_FILE_ID }}
          BASE_CV_FILE_ID: ${{ vars.BASE_CV_FILE_ID }}
          HIGH_EXPERIENCE_REFERENCE_FILE_ID: ${{ vars.HIGH_EXPERIENCE_REFERENCE_FILE_ID }}
          LOWER_EXPERIENCE_REFERENCE_FILE_ID: ${{ vars.LOWER_EXPERIENCE_REFERENCE_FILE_ID }}
          CV_COVER_LETTER_RULES_FILE_ID: ${{ vars.CV_COVER_LETTER_RULES_FILE_ID }}
          COVER_LETTER_TEMPLATE_FILE_ID: ${{ vars.COVER_LETTER_TEMPLATE_FILE_ID }}
          FINAL_PROJECTS_FOLDER_ID: ${{ vars.FINAL_PROJECTS_FOLDER_ID }}
          PROJECTS_FOLDER_ID: ${{ vars.PROJECTS_FOLDER_ID }}
        run: python -m automate_cv.runner
