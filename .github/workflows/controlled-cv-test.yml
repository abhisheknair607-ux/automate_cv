name: controlled-cv-test

on:
  workflow_dispatch:
    inputs:
      row_number:
        description: Freshmal row number to process
        required: true
        default: '3'
      candidate:
        description: Candidate profile
        required: true
        default: 'abhishek'
        type: choice
        options:
          - abhishek
          - pooja

permissions:
  contents: read
  id-token: write

jobs:
  controlled-cv:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: freshmal-controlled-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-writer fonts-crosextra-carlito
      - run: pip install -r requirements.txt
      - name: Run one controlled Freshmal candidate row
        env:
          PYTHONPATH: src
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-sol' }}
          OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT || 'medium' }}

          STAGE1_MODEL: ${{ vars.STAGE1_MODEL || 'gpt-5.6-terra' }}
          STAGE2_MODEL: ${{ vars.STAGE2_MODEL || 'gpt-5.6-terra' }}
          STAGE3_MODEL: ${{ vars.STAGE3_MODEL || 'gpt-5.6-sol' }}
          STAGE1_REASONING_EFFORT: ${{ vars.STAGE1_REASONING_EFFORT || 'low' }}
          STAGE2_REASONING_EFFORT: ${{ vars.STAGE2_REASONING_EFFORT || 'medium' }}
          STAGE3_REASONING_EFFORT: ${{ vars.STAGE3_REASONING_EFFORT || 'medium' }}
          STAGE1_MAX_OUTPUT_TOKENS: ${{ vars.STAGE1_MAX_OUTPUT_TOKENS || '6000' }}
          STAGE2_MAX_OUTPUT_TOKENS: ${{ vars.STAGE2_MAX_OUTPUT_TOKENS || '8000' }}
          STAGE3_MAX_OUTPUT_TOKENS: ${{ vars.STAGE3_MAX_OUTPUT_TOKENS || '24000' }}
          PROMPT_CACHE_MODE: ${{ vars.PROMPT_CACHE_MODE || 'explicit' }}
          PROMPT_CACHE_TTL: ${{ vars.PROMPT_CACHE_TTL || '30m' }}

          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}

          FRESHMAL_SPREADSHEET_ID: ${{ vars.FRESHMAL_SPREADSHEET_ID }}
          FRESHMAL_SHEET_NAME: ${{ vars.FRESHMAL_SHEET_NAME || 'Sheet1' }}
          DRIVE_OUTPUT_FOLDER_ID: ${{ vars.DRIVE_OUTPUT_FOLDER_ID }}

          PROMPT1_FILE_ID: ${{ vars.PROMPT1_FILE_ID }}
          PROMPT2_FILE_ID: ${{ vars.PROMPT2_FILE_ID }}
          PROMPT3_FILE_ID: ${{ vars.PROMPT3_FILE_ID }}
          SUMMARY_DOC_FILE_ID: ${{ vars.SUMMARY_DOC_FILE_ID }}
          MASTER_EVIDENCE_BANK_FILE_ID: ${{ vars.MASTER_EVIDENCE_BANK_FILE_ID }}
          CV_FORMATTING_MASTER_FILE_ID: ${{ vars.CV_FORMATTING_MASTER_FILE_ID }}
          BASE_CV_FILE_ID: ${{ vars.BASE_CV_FILE_ID }}
          HIGH_EXPERIENCE_REFERENCE_FILE_ID: ${{ vars.HIGH_EXPERIENCE_REFERENCE_FILE_ID }}
          LOWER_EXPERIENCE_REFERENCE_FILE_ID: ${{ vars.LOWER_EXPERIENCE_REFERENCE_FILE_ID }}
          CV_COVER_LETTER_RULES_FILE_ID: ${{ vars.CV_COVER_LETTER_RULES_FILE_ID }}
          COVER_LETTER_TEMPLATE_FILE_ID: ${{ vars.COVER_LETTER_TEMPLATE_FILE_ID }}
          FINAL_PROJECTS_FOLDER_ID: ${{ vars.FINAL_PROJECTS_FOLDER_ID }}
          PROJECTS_FOLDER_ID: ${{ vars.PROJECTS_FOLDER_ID }}

          POOJA_PROMPT1_FILE_ID: ${{ vars.POOJA_PROMPT1_FILE_ID }}
          POOJA_PROMPT2_FILE_ID: ${{ vars.POOJA_PROMPT2_FILE_ID }}
          POOJA_PROMPT3_FILE_ID: ${{ vars.POOJA_PROMPT3_FILE_ID }}
          POOJA_SUMMARY_DOC_FILE_ID: ${{ vars.POOJA_SUMMARY_DOC_FILE_ID }}
          POOJA_MASTER_EVIDENCE_BANK_FILE_ID: ${{ vars.POOJA_MASTER_EVIDENCE_BANK_FILE_ID }}
          POOJA_BASE_CV_FILE_ID: ${{ vars.POOJA_BASE_CV_FILE_ID }}
          POOJA_CV_FORMATTING_MASTER_FILE_ID: ${{ vars.POOJA_CV_FORMATTING_MASTER_FILE_ID }}
          POOJA_HIGH_EXPERIENCE_REFERENCE_FILE_ID: ${{ vars.POOJA_HIGH_EXPERIENCE_REFERENCE_FILE_ID }}
          POOJA_LOWER_EXPERIENCE_REFERENCE_FILE_ID: ${{ vars.POOJA_LOWER_EXPERIENCE_REFERENCE_FILE_ID }}
          POOJA_CV_COVER_LETTER_RULES_FILE_ID: ${{ vars.POOJA_CV_COVER_LETTER_RULES_FILE_ID }}
          POOJA_COVER_LETTER_TEMPLATE_FILE_ID: ${{ vars.POOJA_COVER_LETTER_TEMPLATE_FILE_ID }}
          POOJA_FINAL_PROJECTS_FOLDER_ID: ${{ vars.POOJA_FINAL_PROJECTS_FOLDER_ID }}
          POOJA_PROJECTS_FOLDER_ID: ${{ vars.POOJA_PROJECTS_FOLDER_ID }}

          MAX_RETRIES: ${{ vars.MAX_RETRIES || '2' }}
          MAX_ROW_ATTEMPTS: ${{ vars.MAX_ROW_ATTEMPTS || '3' }}
          STALE_LOCK_MINUTES: ${{ vars.STALE_LOCK_MINUTES || '180' }}
          COST_HARD_STOP_USD: ${{ vars.COST_HARD_STOP_USD || '1.75' }}
        run: python -m automate_cv.controlled --row "${{ inputs.row_number }}" --candidate "${{ inputs.candidate }}"
