name: controlled-cv-test

on:
  workflow_dispatch:
    inputs:
      row_number:
        description: Freshmal row number to process
        required: true
        default: '3'

permissions:
  contents: read
  id-token: write

jobs:
  controlled-cv:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: freshmal-controlled-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-writer fonts-crosextra-carlito
      - run: pip install -r requirements.txt
      - name: Run one controlled Freshmal row
        env:
          PYTHONPATH: src
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT }}
          FRESHMAL_SPREADSHEET_ID: ${{ vars.FRESHMAL_SPREADSHEET_ID }}
          FRESHMAL_SHEET_NAME: ${{ vars.FRESHMAL_SHEET_NAME }}
          PROMPT1_FILE_ID: ${{ vars.PROMPT1_FILE_ID }}
          PROMPT2_FILE_ID: ${{ vars.PROMPT2_FILE_ID }}
          PROMPT3_FILE_ID: ${{ vars.PROMPT3_FILE_ID }}
          DRIVE_OUTPUT_FOLDER_ID: ${{ vars.DRIVE_OUTPUT_FOLDER_ID }}
          SUMMARY_DOC_FILE_ID: ${{ vars.SUMMARY_DOC_FILE_ID }}
          CV_FORMATTING_MASTER_FILE_ID: ${{ vars.CV_FORMATTING_MASTER_FILE_ID }}
          BASE_CV_FILE_ID: ${{ vars.BASE_CV_FILE_ID }}
          HIGH_EXPERIENCE_REFERENCE_FILE_ID: ${{ vars.HIGH_EXPERIENCE_REFERENCE_FILE_ID }}
          LOWER_EXPERIENCE_REFERENCE_FILE_ID: ${{ vars.LOWER_EXPERIENCE_REFERENCE_FILE_ID }}
          CV_COVER_LETTER_RULES_FILE_ID: ${{ vars.CV_COVER_LETTER_RULES_FILE_ID }}
          COVER_LETTER_TEMPLATE_FILE_ID: ${{ vars.COVER_LETTER_TEMPLATE_FILE_ID }}
          FINAL_PROJECTS_FOLDER_ID: ${{ vars.FINAL_PROJECTS_FOLDER_ID }}
          PROJECTS_FOLDER_ID: ${{ vars.PROJECTS_FOLDER_ID }}
          MAX_RETRIES: ${{ vars.MAX_RETRIES }}
          COST_HARD_STOP_USD: ${{ vars.COST_HARD_STOP_USD }}
        run: python -m automate_cv.controlled --row "${{ inputs.row_number }}"
