name: WIF source access probe

on:
  push:
    branches:
      - diagnostics/wif-readiness-2026-10-13
    paths:
      - '.github/workflows/wif-readonly-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  access-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Authenticate existing Google Cloud identity
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install small read-only Google clients
        run: python -m pip install google-auth google-api-python-client
      - name: Verify spreadsheets and Drive sources without stale OAuth secret
        env:
          FRESHMAL_SPREADSHEET_ID: ${{ vars.FRESHMAL_SPREADSHEET_ID }}
          POOJA_SUMMARY_DOC_FILE_ID: ${{ vars.POOJA_SUMMARY_DOC_FILE_ID }}
          POOJA_PROMPT1_FILE_ID: ${{ vars.POOJA_PROMPT1_FILE_ID }}
          POOJA_PROMPT2_FILE_ID: ${{ vars.POOJA_PROMPT2_FILE_ID }}
          POOJA_PROMPT3_FILE_ID: ${{ vars.POOJA_PROMPT3_FILE_ID }}
          POOJA_MASTER_EVIDENCE_BANK_FILE_ID: ${{ vars.POOJA_MASTER_EVIDENCE_BANK_FILE_ID }}
          POOJA_BASE_CV_FILE_ID: ${{ vars.POOJA_BASE_CV_FILE_ID }}
          POOJA_CV_FORMATTING_MASTER_FILE_ID: ${{ vars.POOJA_CV_FORMATTING_MASTER_FILE_ID }}
          POOJA_CV_COVER_LETTER_RULES_FILE_ID: ${{ vars.POOJA_CV_COVER_LETTER_RULES_FILE_ID }}
          POOJA_COVER_LETTER_TEMPLATE_FILE_ID: ${{ vars.POOJA_COVER_LETTER_TEMPLATE_FILE_ID }}
          PROMPT2_FILE_ID: ${{ vars.PROMPT2_FILE_ID }}
          PROMPT3_FILE_ID: ${{ vars.PROMPT3_FILE_ID }}
          MASTER_EVIDENCE_BANK_FILE_ID: ${{ vars.MASTER_EVIDENCE_BANK_FILE_ID }}
          BASE_CV_FILE_ID: ${{ vars.BASE_CV_FILE_ID }}
          CV_FORMATTING_MASTER_FILE_ID: ${{ vars.CV_FORMATTING_MASTER_FILE_ID }}
          SUMMARY_DOC_FILE_ID: ${{ vars.SUMMARY_DOC_FILE_ID }}
          PROMPT1_FILE_ID: ${{ vars.PROMPT1_FILE_ID }}
          DRIVE_OUTPUT_FOLDER_ID: ${{ vars.DRIVE_OUTPUT_FOLDER_ID }}
        run: |
          python - <<'PY'
          import os
          import google.auth
          from googleapiclient.discovery import build

          scopes = [
              'https://www.googleapis.com/auth/spreadsheets.readonly',
              'https://www.googleapis.com/auth/drive.metadata.readonly',
          ]
          creds, project = google.auth.default(scopes=scopes)
          print('Google credential class:', type(creds).__name__)
          print('Project configured:', bool(project))
          sheets = build('sheets', 'v4', credentials=creds, cache_discovery=False)
          drive = build('drive', 'v3', credentials=creds, cache_discovery=False)
          spreadsheet_id = os.environ['FRESHMAL_SPREADSHEET_ID']
          if not spreadsheet_id:
              raise RuntimeError('FRESHMAL_SPREADSHEET_ID is not configured')
          m = sheets.spreadsheets().get(
              spreadsheetId=spreadsheet_id,
              fields='spreadsheetId,sheets.properties.title'
          ).execute()
          print('SHEETS_READ_OK:', sorted(s['properties']['title'] for s in m['sheets']))
          for key in (
              'SUMMARY_DOC_FILE_ID', 'PROMPT1_FILE_ID', 'PROMPT2_FILE_ID', 'PROMPT3_FILE_ID',
              'MASTER_EVIDENCE_BANK_FILE_ID', 'BASE_CV_FILE_ID',
              'CV_FORMATTING_MASTER_FILE_ID', 'DRIVE_OUTPUT_FOLDER_ID',
              'POOJA_SUMMARY_DOC_FILE_ID', 'POOJA_PROMPT1_FILE_ID', 'POOJA_PROMPT2_FILE_ID',
              'POOJA_PROMPT3_FILE_ID', 'POOJA_MASTER_EVIDENCE_BANK_FILE_ID',
              'POOJA_BASE_CV_FILE_ID', 'POOJA_CV_FORMATTING_MASTER_FILE_ID',
              'POOJA_CV_COVER_LETTER_RULES_FILE_ID', 'POOJA_COVER_LETTER_TEMPLATE_FILE_ID',
          ):
              file_id = os.environ[key]
              if not file_id:
                  raise RuntimeError(key + ' is missing')
              f = drive.files().get(
                  fileId=file_id,
                  fields='id,mimeType,capabilities(canEdit,canAddChildren)'
              ).execute()
              print('DRIVE_METADATA_READ_OK:', key,
                    'canEdit=', f.get('capabilities',{}).get('canEdit',False),
                    'canAddChildren=', f.get('capabilities',{}).get('canAddChildren',False))
          print('WIF_READONLY_PROBE_COMPLETE')
          PY
