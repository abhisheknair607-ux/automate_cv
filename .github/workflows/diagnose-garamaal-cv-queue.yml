name: Diagnose Garamaal CV queue credential
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-garamaal-cv-queue.yml

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
      - name: Check production queue credential without printing any secret
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, urllib.request, urllib.error, re
          PROJECT="abhishek-cv-automation"
          SERVICE="automate-cv-dashboard"
          REGION="europe-west1"
          def cmd(parts):
              return subprocess.run(parts, capture_output=True, text=True, timeout=35)
          service=cmd(["gcloud","run","services","describe",SERVICE,
                       "--region",REGION,"--project",PROJECT,"--format=json"])
          if service.returncode:
              print("cloud_run_config=unavailable")
              raise SystemExit(0)
          config=json.loads(service.stdout)
          status=config.get("status",{}).get("traffic",[])
          active=[item for item in status if item.get("percent",0)>0]
          print("cloud_run_active_traffic="+str(sum(int(t.get("percent",0)) for t in active)))
          containers=config.get("spec",{}).get("template",{}).get("spec",{}).get("containers",[])
          env=[item for c in containers for item in c.get("env",[])]
          refs=[item.get("valueFrom",{}).get("secretKeyRef",{}) for item in env if item.get("name")=="GITHUB_WORKFLOW_TOKEN"]
          if len(refs)!=1 or not refs[0].get("name"):
              print("github_secret_binding=missing")
              raise SystemExit(0)
          print("github_secret_binding=present")
          ref=refs[0]
          secret=ref["name"]
          version=str(ref.get("key") or "latest")
          project=PROJECT
          match=re.fullmatch(r"projects/([^/]+)/secrets/([^/]+)",secret)
          if match:
              project,secret=match.groups()
          ver=cmd(["gcloud","secrets","versions","describe",version,
                   "--secret",secret,"--project",project,"--format=json"])
          if ver.returncode==0:
              state=json.loads(ver.stdout).get("state","UNKNOWN")
              print("github_secret_version_state="+state)
          else:
              print("github_secret_version_state=not_readable")
          result=cmd(["gcloud","secrets","versions","access",version,
                      "--secret",secret,"--project",project])
          if result.returncode:
              err=result.stderr.lower()
              if "permission" in err or "denied" in err or "403" in err:
                  print("credential_probe=service_account_lacks_secret_access")
              elif "not_found" in err or "not found" in err:
                  print("credential_probe=secret_version_not_found")
              else:
                  print("credential_probe=secret_read_unavailable")
              raise SystemExit(0)
          token=result.stdout.strip()
          if not token:
              print("credential_probe=empty_secret")
              raise SystemExit(0)
          print("credential_probe=nonempty_secret")
          def status(url):
              request=urllib.request.Request(url,headers={
                  "Authorization":"Bearer "+token,
                  "Accept":"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28",
                  "User-Agent":"garamaal-credential-check"
              })
              try:
                  with urllib.request.urlopen(request,timeout=15) as response:
                      return str(response.status)
              except urllib.error.HTTPError as error:
                  return str(error.code)
              except Exception:
                  return "network_failure"
          print("github_identity_http="+status("https://api.github.com/user"))
          print("github_queue_http="+status("https://api.github.com/repos/abhisheknair607-ux/automate_cv/actions/workflows/controlled-cv-test.yml/runs?event=workflow_dispatch&per_page=1"))
          PY
