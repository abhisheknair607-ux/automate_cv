name: job-alerts-to-taaza

# Manual-only until Gmail authorization and real-mail preview are verified.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Write approved validated jobs to Taaza (do NOT enable until approval)
        type: boolean
        default: false
      on_date:
        description: Optional Dublin-local date for preview (YYYY-MM-DD)
        type: string
        default: "2026-10-25"

permissions:
  contents: read
  id-token: write

concurrency:
  group: taaza-master-writers
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Gmail and Sheets libraries
        run: python -m pip install --quiet google-api-python-client google-auth google-auth-httplib2
      - name: Import alerts or preview
        env:
          LINKEDIN_GMAIL_CLIENT_ID: ${{ secrets.LINKEDIN_GMAIL_CLIENT_ID }}
          LINKEDIN_GMAIL_CLIENT_SECRET: ${{ secrets.LINKEDIN_GMAIL_CLIENT_SECRET }}
          LINKEDIN_GMAIL_REFRESH_TOKEN: ${{ secrets.LINKEDIN_GMAIL_REFRESH_TOKEN }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          APPLY: ${{ inputs.apply }}
          ON_DATE: ${{ inputs.on_date }}
          GARAMAAL_ALERT_IMPORT_APPROVED: ${{ vars.GARAMAAL_ALERT_IMPORT_APPROVED }}
        run: |
          args=()
          if [[ -n "$ON_DATE" ]]; then args+=(--on-date "$ON_DATE"); fi
          if [[ "$APPLY" == "true" ]]; then
            if [[ "$GARAMAAL_ALERT_IMPORT_APPROVED" != "true" ]]; then
              echo "Write blocked: parser approval and shared Gmail authorization required." >&2
              exit 1
            fi
            args+=(--apply)
          fi
          python -m src.automate_cv.linkedin_alert_import "${args[@]}"
