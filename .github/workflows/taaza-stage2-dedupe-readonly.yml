name: taaza-stage2-dedupe-readonly

# Isolated Stage 2 approval gate. Read-only access, zero edits, no cron.
on:
  push:
    branches:
      - feature/taaza-dedupe-stage2-readonly-20261026
    paths:
      - .github/workflows/taaza-stage2-dedupe-readonly.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: taaza-stage2-dedupe-readonly
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google read-only client
        run: python -m pip install --quiet google-api-python-client google-auth google-auth-httplib2
      - name: Read Taaza and print aggregated audit counts only
        env:
          TAAZA_SPREADSHEET_ID: 1jt3WXqpnzVOYcKCpABIp-7UMUPr48kVhMkLfzGEHHZY
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: PYTHONPATH=src python -m automate_cv.taaza_dedupe_audit --live
